                  </div>
                  <div>
                    <h3 className="font-semibold text-gray-900 mb-1">{item.title}</h3>
                    <p className="text-sm text-gray-600">{item.desc}</p>
                  </div>
                </div>
              </Card>
            ))}
          </div>

          {/* Nos inspirations */}
          <Card className="p-6 md:p-8 mb-6">
            <h2 className="text-xl font-bold text-gray-900 mb-5">Nos inspirations</h2>
            <div className="space-y-5">
              <div className="p-5 bg-indigo-50 rounded-xl">
                <p className="font-bold text-indigo-900 text-lg mb-2">Magnet Recognition (États-Unis)</p>
                <p className="text-gray-700 leading-relaxed">Un hôpital « Magnet » est un établissement reconnu pour l'excellence de ses pratiques infirmières et la qualité de son environnement de travail. Le programme, créé par l'American Nurses Credentialing Center (ANCC), évalue les établissements sur la base d'indicateurs mesurables : satisfaction des patient·e·s, conditions de travail du personnel, résultats cliniques. Les hôpitaux certifiés Magnet affichent de meilleurs résultats en termes de sécurité des soins et de rétention du personnel. CareWatch™ s'inspire de cette logique de transparence et de certification par la preuve.</p>
                <a href="https://www.nursingworld.org/organizational-programs/magnet/about-magnet/" target="_blank" rel="noopener noreferrer" className="text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-1 mt-2">Programme Magnet (ANCC) <ExternalLink className="w-4 h-4" /></a>
              </div>
              <div className="p-5 bg-teal-50 rounded-xl">
                <p className="font-bold text-teal-900 text-lg mb-2">Learning Health Systems (Suisse)</p>
                <p className="text-gray-700 leading-relaxed">Le concept de « système de santé apprenant » repose sur un cycle continu : les données issues de la pratique clinique sont analysées, transformées en connaissances, puis réinjectées dans les soins pour les améliorer. CareWatch™ applique cette logique aux expériences des patient·e·s : chaque témoignage alimente des indicateurs qui permettent aux établissements de s'améliorer en continu.</p>
                <a href="https://www.slhs.ch/en/" target="_blank" rel="noopener noreferrer" className="text-teal-600 hover:text-teal-700 font-medium flex items-center gap-1 mt-2">Swiss Learning Health System (SLHS) <ExternalLink className="w-4 h-4" /></a>
              </div>
              <div className="p-5 bg-amber-50 rounded-xl">
                <p className="font-bold text-amber-900 text-lg mb-2">Microsystèmes cliniques (Suède)</p>
                <p className="text-gray-700 leading-relaxed">En Suède, l'amélioration de la qualité des soins repose sur les microsystèmes cliniques : de petites équipes au sein des services qui mesurent leurs propres résultats, identifient les problèmes et mettent en œuvre des changements à leur échelle. CareWatch™ fournit à ces équipes les données dont elles ont besoin — au niveau du service, pas seulement de l'établissement.</p>
                <a href="https://www.microsystemfestival.com/" target="_blank" rel="noopener noreferrer" className="text-amber-600 hover:text-amber-700 font-medium flex items-center gap-1 mt-2">Qulturum — Microsystem Festival (Jönköping) <ExternalLink className="w-4 h-4" /></a>
              </div>
              <div className="p-5 bg-rose-50 rounded-xl">
                <p className="font-bold text-rose-900 text-lg mb-2">Care Quality Commission — CQC (Royaume-Uni)</p>
                <p className="text-gray-700 leading-relaxed">La CQC est l'organisme indépendant qui inspecte et évalue tous les services de santé en Angleterre selon cinq critères : sûrs, efficaces, bienveillants, adaptés et bien gouvernés. Les rapports sont publics et accessibles à tous. CareWatch™ s'inspire de cette transparence radicale.</p>
                <a href="https://www.cqc.org.uk/" target="_blank" rel="noopener noreferrer" className="text-rose-600 hover:text-rose-700 font-medium flex items-center gap-1 mt-2">Care Quality Commission (CQC) <ExternalLink className="w-4 h-4" /></a>
              </div>
              <div className="p-5 bg-emerald-50 rounded-xl">
                <p className="font-bold text-emerald-900 text-lg mb-2">Représentant·e·s des usager·ère·s (France)</p>
                <p className="text-gray-700 leading-relaxed">En France, des représentant·e·s des usager·ère·s indépendant·e·s, mandaté·e·s par des associations agréées, siègent dans les instances hospitalières et rapportent à la Haute Autorité de Santé (HAS) pour la certification des établissements. CareWatch™ transpose cette logique au contexte suisse : donner aux usager·ère·s un rôle actif dans l'évaluation de l'équité des soins.</p>
                <a href="https://www.has-sante.fr/jcms/c_431816/fr/representation-des-usagers" target="_blank" rel="noopener noreferrer" className="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-1 mt-2">HAS — Représentation des usagers <ExternalLink className="w-4 h-4" /></a>
              </div>
            </div>
            <p className="text-gray-600 mt-5">Notre approche combine ces modèles : <strong>Mesurer</strong> (indicateurs d'équité) → <strong>Transformer</strong> (accompagnement) → <strong>Certifier</strong> (label d'excellence).</p>
          </Card>

          {/* Accès aux soins */}
          <Card className="p-6 md:p-8 mb-6 bg-blue-50 border-blue-200">
            <div className="flex items-start gap-4 mb-4">
              <div className="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center flex-shrink-0">
                <Stethoscope className="w-6 h-6 text-blue-600" />
              </div>
              <div>
                <h2 className="text-xl font-bold text-blue-900 mb-2">Au-delà du traitement : l'accès aux soins</h2>
                <p className="text-blue-800 mb-3">CareWatch™ ne documente pas seulement comment les patient·e·s sont traité·e·s, mais aussi si les soins dont ils et elles ont besoin sont accessibles là où ils et elles vivent.</p>
              </div>
            </div>
            <p className="text-sm text-blue-700 mb-3">Notre module « Accès aux soins spécialisés » cartographie quatre dimensions essentielles :</p>
            <div className="grid sm:grid-cols-2 gap-2 mb-3">
              <div className="p-3 bg-white/70 rounded-lg">
                <p className="font-medium text-sm text-gray-900">Équipements spécialisés</p>
                <p className="text-sm text-gray-600">Voie veineuse écho-guidée, aphérèse, IRM 3T...</p>
              </div>
              <div className="p-3 bg-white/70 rounded-lg">
                <p className="font-medium text-sm text-gray-900">Maladies rares & négligées</p>
                <p className="text-sm text-gray-600">Drépanocytose, thalassémie, mucoviscidose...</p>
              </div>
              <div className="p-3 bg-white/70 rounded-lg">
                <p className="font-medium text-sm text-gray-900">Populations vulnérables</p>
                <p className="text-sm text-gray-600">Migrants, sans-papiers, précarité, diversité de genre...</p>
              </div>
              <div className="p-3 bg-white/70 rounded-lg">
                <p className="font-medium text-sm text-gray-900">Interprétariat & médiation</p>
                <p className="text-sm text-gray-600">Appartenances, Interpret, médiation interculturelle...</p>
              </div>
            </div>
          </Card>

          {/* Évolution de la plateforme */}
          <Card className="p-6 md:p-8 mb-6 bg-indigo-50 border-indigo-200">
            <h2 className="text-xl font-bold text-indigo-900 mb-4 flex items-center gap-2"><TrendingUp className="w-5 h-5" /> Évolution de la plateforme</h2>
            <div className="space-y-4">
              <div className="flex gap-3">
                <div className="w-8 h-8 rounded-lg bg-teal-100 flex items-center justify-center flex-shrink-0 mt-0.5">
                  <span className="text-sm font-bold text-teal-700">1</span>
                </div>
                <div>
                  <h4 className="font-medium text-gray-900">Phase 1 — Établissements hospitaliers <span className="text-xs font-semibold text-teal-700 bg-teal-100 px-2 py-0.5 rounded ml-2">En cours</span></h4>
                  <p className="text-sm text-gray-700">Hôpitaux et cliniques de Suisse romande, avec précision au niveau du service, département, consultation ou unité.</p>
                </div>
              </div>
              <div className="flex gap-3">
                <div className="w-8 h-8 rounded-lg bg-amber-100 flex items-center justify-center flex-shrink-0 mt-0.5">
                  <span className="text-sm font-bold text-amber-700">2</span>
                </div>
                <div>
                  <h4 className="font-medium text-gray-900">Phase 2 — AI, assurances, institutions sociales et soins à domicile</h4>
                  <p className="text-sm text-gray-700">Offices AI, bureaux d'expertise des assurances, institutions sociales et de protection de l'enfance (SPMi, DGEJ, APEA/KESB), et services de soins à domicile (IMAD, CMS).</p>
                </div>
              </div>
              <div className="flex gap-3">
                <div className="w-8 h-8 rounded-lg bg-purple-100 flex items-center justify-center flex-shrink-0 mt-0.5">
                  <span className="text-sm font-bold text-purple-700">3</span>
                </div>
                <div>
                  <h4 className="font-medium text-gray-900">Phase 3 — Cabinets et professionnel·le·s de santé</h4>
                  <p className="text-sm text-gray-700">Physiothérapie, ergothérapie, ostéopathie, chiropraxie et autres professionnel·le·s de santé pluri-disciplinaires. Couvrir l'ensemble du parcours de soins, pas seulement l'hôpital.</p>
                </div>
              </div>
            </div>
          </Card>

          {/* CTA */}
          <Card className="p-6 md:p-8 bg-gradient-to-r from-teal-500 to-emerald-500 text-white text-center">
            <h2 className="text-xl font-bold mb-2">Participez à l'observatoire</h2>
            <p className="text-teal-100 mb-4">Votre expérience compte. Chaque témoignage contribue à améliorer l'équité des soins pour tous.</p>
            <div className="flex flex-col sm:flex-row gap-3 justify-center">
              <Button onClick={() => { setLoginType('patient'); setShowLogin(true); }} className="bg-white text-teal-600 hover:bg-teal-50">
                Faire un signalement
              </Button>
              <Button variant="outline" onClick={() => setView('methodology')} className="border-white text-white hover:bg-white/20">
                Découvrir la méthodologie
              </Button>
            </div>
          </Card>
        </div>
      </div>
    );
  }

  if (view === 'methodology-public' || view === 'methodology') {
    return (
      <div className="min-h-screen bg-gradient-to-b from-gray-50 to-white">
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          <BackButton />
          
          {/* Hero */}
          <div className="text-center mb-10">
            <h1 className="text-3xl md:text-4xl font-bold text-gray-900 mb-3">Méthodologie</h1>
            <p className="text-gray-600 max-w-2xl mx-auto">Une approche scientifique, transparente et participative pour mesurer et améliorer l'équité des soins.</p>
          </div>

          {/* Vue d'ensemble du processus */}
          <Card className="p-6 mb-8 bg-gradient-to-r from-indigo-50 to-blue-50 border-indigo-200">
            <h2 className="text-lg font-bold text-indigo-900 mb-4">Le parcours d'un signalement</h2>
            <div className="flex flex-col md:flex-row gap-3">
              {[
                { step: '1', label: 'Signalement', desc: 'Anonyme, guidé', time: '5-10 min' },
                { step: '2', label: 'Modération', desc: 'Vérification', time: '< 48h' },
                { step: '3', label: 'Contestation', desc: 'Droit de réponse', time: '14 jours' },
                { step: '4', label: 'Publication', desc: 'Données agrégées', time: 'Continu' },
              ].map((s, i) => (
                <div key={s.step} className="flex-1 flex items-center gap-3">
                  <div className="flex flex-col items-center">
                    <div className="w-10 h-10 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold">{s.step}</div>
                    {i < 3 && <div className="hidden md:block w-0.5 h-4 bg-indigo-300" />}
                  </div>
                  <div className="flex-1 md:hidden">
                    <p className="font-medium text-indigo-900">{s.label}</p>
                    <p className="text-sm text-indigo-700">{s.desc} • {s.time}</p>
                  </div>
                  <div className="hidden md:block text-center flex-1">
                    <p className="font-medium text-indigo-900">{s.label}</p>
                    <p className="text-sm text-indigo-700">{s.desc}</p>
                    <p className="text-sm text-indigo-500">{s.time}</p>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          {/* Positionnement : ce que CareWatch™ n'est pas */}
          <Card className="p-6 md:p-8 mb-6 bg-amber-50 border-amber-200">
            <div className="flex items-start gap-4 mb-4">
              <div className="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center flex-shrink-0">
                <Info className="w-6 h-6 text-amber-600" />
              </div>
              <div>
                <h2 className="text-xl font-bold text-amber-900">Et les systèmes de signalement internes aux hôpitaux ?</h2>
                <p className="text-sm text-amber-700">Un angle différent et complémentaire</p>
              </div>
            </div>
            <p className="text-gray-700 mb-3">Les hôpitaux suisses disposent de systèmes internes de déclaration d'événements indésirables (connus sous le nom de CIRS — Critical Incident Reporting System), coordonnés par la Fondation Sécurité des patients Suisse et encadrés par l'ANQ (Association nationale pour le développement de la qualité dans les hôpitaux et les cliniques). Ces dispositifs sont essentiels pour la sécurité clinique : erreurs médicales, chutes, infections contractées à l'hôpital, incidents évités de justesse.</p>
            <div className="p-4 bg-white rounded-xl border border-amber-200 mb-3">
              <p className="font-bold text-amber-900 mb-2">Pourquoi un dispositif externe est indispensable</p>
              <p className="text-sm text-gray-700 mb-2">Les systèmes internes présentent des limites structurelles bien documentées. Au Royaume-Uni, le scandale de l'hôpital de Mid Staffordshire (2005–2009) a révélé que des centaines de décès évitables n'avaient jamais été signalés en interne. L'enquête publique Francis (2013) a conclu que la culture institutionnelle décourageait activement les signalements du personnel — par peur des représailles hiérarchiques.</p>
              <p className="text-sm text-gray-700 mb-2">Plus récemment, les rapports de la CQC au Royaume-Uni continuent de documenter des établissements où les systèmes de signalement internes sont sous-utilisés ou inefficaces, précisément parce que les professionnel·le·s craignent des conséquences sur leur carrière.</p>
              <p className="text-sm text-gray-800 font-semibold">Un dispositif externe et indépendant élimine cette barrière : quand l'anonymat est total et que le signalement échappe au contrôle de l'institution, la parole se libère.</p>
            </div>
            <div className="grid sm:grid-cols-2 gap-3 mb-3">
              <div className="p-3 bg-white rounded-xl border border-amber-100">
                <p className="text-sm font-bold text-amber-800 uppercase mb-1">CIRS / Sécurité des patients</p>
                <p className="text-sm text-gray-700">Interne à l'institution. Piloté par l'hôpital. Couvre les événements cliniques indésirables. Données non publiques.</p>
              </div>
              <div className="p-3 bg-white rounded-xl border border-teal-200">
                <p className="text-sm font-bold text-teal-800 uppercase mb-1">CareWatch™ / Qualité des soins</p>
                <p className="text-sm text-gray-700">Externe et indépendant. Initié par l'usager·ère. Couvre les discriminations perçues dans l'expérience de soins. Données agrégées publiques.</p>
              </div>
            </div>
            <p className="text-sm text-amber-800">Si un·e patient·e a le sentiment d'avoir été traité·e différemment à cause de son origine, son accent ou son type d'assurance, aucun formulaire CIRS ne captera cette expérience. CareWatch™ existe pour documenter ce que les dispositifs actuels ne mesurent pas.</p>
          </Card>

          {/* DMS */}
          <Card className="p-6 md:p-8 mb-6">
            <div className="flex items-start gap-4 mb-4">
              <div className="w-12 h-12 rounded-xl bg-teal-100 flex items-center justify-center flex-shrink-0">
                <ClipboardList className="w-6 h-6 text-teal-600" />
              </div>
              <div>
                <h2 className="text-xl font-bold text-gray-900">Questionnaire DMS</h2>
                <p className="text-sm text-teal-600">Discrimination in Medical Settings Scale</p>
              </div>
            </div>
            <p className="text-gray-600 mb-4">Instrument validé scientifiquement mesurant 7 dimensions de l'expérience de discrimination dans les soins. Développé par Peek et al. (2011), adapté pour le contexte suisse.</p>
            <div className="bg-gray-50 rounded-xl p-4 mb-4">
              <p className="text-sm font-medium text-gray-700 mb-2">Les 7 dimensions mesurées :</p>
              <div className="grid sm:grid-cols-2 gap-2">
                {['Courtoisie', 'Respect', 'Qualité de service', 'Intelligence perçue', 'Sentiment de peur', 'Attitude de supériorité', 'Écoute attentive'].map((d, i) => (
                  <div key={d} className="flex items-center gap-2 text-sm text-gray-600">
                    <span className="w-5 h-5 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-xs font-medium">{i+1}</span>
                    {d}
                  </div>
                ))}
              </div>
            </div>
            <p className="text-sm text-gray-600">Échelle de réponse : Jamais (1) → Toujours (5). Un score global est calculé pour chaque établissement.</p>
          </Card>

          {/* Intersectionnalité */}
          <Card className="p-6 md:p-8 mb-6">
            <div className="flex items-start gap-4 mb-4">
              <div className="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center flex-shrink-0">
                <Users className="w-6 h-6 text-purple-600" />
              </div>
              <div>
                <h2 className="text-xl font-bold text-gray-900">Motifs perçus et croisement des identités</h2>
                <p className="text-sm text-purple-600">Pourquoi nous demandons « pourquoi, selon vous ? »</p>
              </div>
            </div>
            <p className="text-gray-600 mb-3">Quand une personne ressent une discrimination, il est souvent difficile d'en identifier la cause exacte. Était-ce à cause de mon accent ? De ma couleur de peau ? De ma maladie ? CareWatch™ invite chaque personne à identifier les <strong>motifs perçus</strong> — sans obligation de preuve, et au conditionnel.</p>
            <p className="text-gray-600 mb-4">En croisant des centaines de témoignages, ces perceptions individuelles révèlent des tendances collectives fiables et orientent les actions de prévention.</p>
            
            <div className="bg-purple-50 rounded-xl p-4 mb-4">
              <p className="text-sm font-medium text-purple-900 mb-2">Qu'est-ce que l'intersectionnalité ?</p>
              <p className="text-sm text-gray-700 mb-3">Ce concept, introduit par la juriste Kimberlé Crenshaw en 1989, part d'un constat simple : nos identités ne s'additionnent pas, elles interagissent. Une femme noire atteinte d'une maladie chronique ne vit pas trois discriminations séparées, mais une expérience unique née de leur croisement. Comprendre ces croisements est essentiel pour agir efficacement.</p>
              <div className="grid sm:grid-cols-2 gap-2 mb-3">
                {[
                  { axis: 'Origine', items: 'Couleur de peau, ethnicité, nationalité, langue, religion' },
                  { axis: 'Identité', items: 'Genre, orientation sexuelle, transidentité' },
                  { axis: 'Caractéristiques', items: 'Âge, handicap, maladie chronique ou rare, santé mentale, apparence' },
                  { axis: 'Situation', items: 'Statut socio-économique, type d\'assurance, grossesse, littératie en santé' },
                ].map(a => (
                  <div key={a.axis} className="bg-white rounded-lg p-3 border border-purple-100">
                    <p className="text-sm font-bold text-purple-700 uppercase mb-1">{a.axis}</p>
                    <p className="text-sm text-gray-700">{a.items}</p>
                  </div>
                ))}
              </div>
              <a href="https://ligue-enseignement.be/education-enseignement/articles/la-ligue/la-roue-des-privileges-un-outil-pour-deconstruire-les-discriminations" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-sm text-purple-700 hover:text-purple-900 font-medium underline">Comprendre avec la Roue des privilèges (Ligue de l'Enseignement) <ExternalLink className="w-3 h-3" /></a>
            </div>
            <p className="text-sm text-gray-600">Chaque signalement peut comporter plusieurs motifs perçus simultanés. Les croisements les plus fréquents sont analysés de manière agrégée pour identifier les populations potentiellement exposées à un risque cumulé et orienter les politiques d'équité.</p>
          </Card>

          {/* Indice d'équité */}
          <Card className="p-6 md:p-8 mb-6">
            <div className="flex items-start gap-4 mb-4">
              <div className="w-12 h-12 rounded-xl bg-indigo-100 flex items-center justify-center flex-shrink-0">
                <Award className="w-6 h-6 text-indigo-600" />
              </div>
              <div>
                <h2 className="text-xl font-bold text-gray-900">Indice d’équité par établissement</h2>
                <p className="text-sm text-indigo-600">Une formule publique, appliquée dans la base de données elle-même</p>
              </div>
            </div>
            <p className="text-gray-600 mb-3">L’indice va de 0 à 100. Il n’utilise que les témoignages <strong>vérifiés par la modération</strong>, et n’est calculé qu’à partir de <strong>5 témoignages vérifiés</strong> pour un établissement. En dessous, l’établissement affiche « Pas encore d’évaluation ».</p>
            <div className="bg-indigo-50 rounded-xl p-4 mb-3 text-center">
              <p className="font-mono text-sm text-indigo-900">indice = 70 × (1 − ressenti moyen) + 30 × part des retours positifs</p>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <div className="p-3 bg-gray-50 rounded-xl">
                <p className="font-medium text-sm text-gray-900 mb-1">Ressenti moyen (70 %)</p>
                <p className="text-sm text-gray-700">Moyenne, sur les signalements vérifiés, des réponses au questionnaire DMS ramenées entre 0 (jamais) et 1 (toujours). Plus le ressenti de discrimination est faible, plus l’indice est élevé.</p>
              </div>
              <div className="p-3 bg-gray-50 rounded-xl">
                <p className="font-medium text-sm text-gray-900 mb-1">Retours positifs (30 %)</p>
                <p className="text-sm text-gray-700">Nombre d’expériences positives vérifiées divisé par le nombre total de témoignages vérifiés pour l’établissement.</p>
              </div>
            </div>
            <p className="text-sm text-gray-500 mt-3">Il n’existe ni inspection, ni « score de fiabilité », ni pondération par ancienneté : ce qui est affiché découle uniquement de cette formule. Le même calcul alimente le site et les données ouvertes.</p>
          </Card>

          {/* Niveaux d'évaluation */}
          <Card className="p-6 md:p-8 mb-6">
            <h2 className="text-xl font-bold text-gray-900 mb-4">Les 4 niveaux d'évaluation</h2>
            <p className="text-gray-600 mb-4">Le niveau découle directement de l’indice d’équité ci-dessus : 75 et plus, Exemplaire · 50 à 74, Satisfaisant · 25 à 49, À améliorer · moins de 25, Insuffisant. Rien n’est calculé sous 5 témoignages vérifiés.</p>
            <div className="space-y-3">
              {Object.entries(DB.ratings).filter(([k]) => k !== 'no_data').map(([k, r]) => (
                <div key={k} className={`flex items-center gap-4 p-4 rounded-xl bg-${r.color}-50 border border-${r.color}-200`}>
                  <div className="flex gap-0.5">
                    {[...Array(5)].map((_, i) => (
                      <Star key={i} className={`w-4 h-4 ${i < r.stars ? `text-${r.color}-500 fill-current` : 'text-gray-300'}`} />
                    ))}
                  </div>
                  <div className="flex-1">
                    <span className={`font-semibold text-${r.color}-700`}>{r.label}</span>
                    <p className={`text-sm text-${r.color}-600`}>{r.desc}</p>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          {/* Protection anti-abus */}
          <Card className="p-6 md:p-8 mb-6 bg-rose-50 border-rose-200">
            <h2 className="text-xl font-bold text-rose-900 mb-4">Protection contre les abus</h2>
            <p className="text-rose-800 mb-4">Pour garantir la fiabilité des données, plusieurs mécanismes de protection sont en place :</p>
            <div className="grid sm:grid-cols-2 gap-3">
              {[
                { title: 'Vérification géographique', desc: 'Le code postal est vérifié localement dans le navigateur puis immédiatement effacé. Seul le résultat de cohérence est conservé — jamais le code postal lui-même.' },
                { title: 'Modération humaine', desc: 'Chaque signalement est examiné par notre équipe sous 48h.' },
                { title: 'Droit de contestation', desc: 'Les établissements disposent de 14 jours pour contester avec des éléments factuels.' },
                { title: 'Seuil de 5 témoignages vérifiés', desc: 'Aucun indice n’est calculé ni publié pour un établissement en dessous de ce seuil.' },
              ].map(p => (
                <div key={p.title} className="p-3 bg-white rounded-xl">
                  <p className="font-medium text-rose-900">{p.title}</p>
                  <p className="text-sm text-rose-700">{p.desc}</p>
                </div>
              ))}
            </div>
          </Card>

          {/* Transparence */}
          <Card className="p-6 md:p-8 bg-gradient-to-r from-emerald-50 to-teal-50 border-emerald-200">
            <h2 className="text-xl font-bold text-emerald-900 mb-4">Transparence totale</h2>
            <p className="text-emerald-800 mb-4">Dans un esprit d'ouverture scientifique, toutes nos données et méthodes sont accessibles :</p>
            <div className="flex flex-wrap gap-3">
              <Button variant="outline" onClick={() => setView('opendata')} icon={FileText} className="border-emerald-500 text-emerald-700 hover:bg-emerald-100">
                Accéder à l'Open Data & API
              </Button>
              <Button variant="ghost" icon={ExternalLink} onClick={() => { _skipNextScroll = true; setView('opendata-spec'); }} className="text-emerald-700 hover:bg-emerald-100">
                Documentation technique
              </Button>
            </div>
          </Card>
        </div>
      </div>
    );
  }

  if (view === 'faq-public' || view === 'faq') {
    const faqCategories = [
      {
        title: 'Signalements',
        icon: ClipboardList,
        color: 'teal',
        items: [
          { q: 'Qui peut faire un signalement ?', a: 'Toute personne ayant vécu ou observé une situation de discrimination dans un établissement de santé suisse : patient·e·s, proches, témoins, ou professionnel·le·s de santé. Les signalements sont anonymes.' },
          { q: 'Combien de temps prend un signalement ?', a: 'Entre 5 et 10 minutes. Le formulaire est guidé, anonyme et sans pression — vous pouvez prendre votre temps. L\'enregistrement vocal est aussi disponible si vous préférez raconter votre expérience oralement.' },
          { q: 'Puis-je modifier mon signalement après l\'avoir envoyé ?', a: 'Oui, à tout moment, avec le numéro et le code personnel reçus à la fin de l\'envoi. Dans « Mes témoignages », le bouton Modifier permet de corriger la description et l\'impact ; le témoignage repasse ensuite en relecture par l\'équipe. Vous pouvez aussi modifier vos autorisations ou retirer le témoignage dans « Gérer mon signalement ». Aucun compte ni e-mail nécessaire.' },
          { q: 'Que se passe-t-il si je fais un faux signalement ?', a: 'Les faux signalements sont détectables grâce à nos mécanismes de vérification (cohérence géographique, patterns suspects). Cette rigueur protège à la fois les établissements et les témoins de bonne foi : plus les données sont fiables, plus votre témoignage a du poids. Un signalement honnête, même subjectif, n\'est jamais considéré comme abusif. Votre témoignage est protégé et votre anonymat garanti.' },
          { q: 'Les hôpitaux n\'ont-ils pas déjà un système de signalement ?', a: 'Si. Chaque hôpital suisse dispose d\'un système interne (CIRS). Mais ces systèmes présentent des limites bien documentées : au Royaume-Uni, le scandale de Mid Staffordshire a montré que des centaines de décès évitables n\'avaient jamais été signalés en interne, car la culture institutionnelle décourageait la parole. De plus, aucun formulaire interne ne couvre les discriminations perçues. CareWatch™ est complémentaire : externe, indépendant, anonymisé (détails généralisés), centré sur l\'équité de l\'expérience de soins.' },
        ]
      },
      {
        title: 'Modération & Vérification',
        icon: CheckCircle,
        color: 'emerald',
        items: [
          { q: 'Comment fonctionne la modération ?', a: 'Chaque signalement est examiné par notre équipe indépendante dans un délai de 48h ouvrées. Nous vérifions la cohérence géographique, la clarté du témoignage, et le respect de la charte. Aucun signalement n\'est publié automatiquement. L\'équipe de modération n\'a accès qu\'à des données anonymes — elle ne peut pas vous identifier.' },
          { q: 'L\'établissement peut-il contester un signalement ?', a: 'Oui. Chaque établissement reçoit une notification anonymisée et dispose de 14 jours pour contester avec des éléments factuels. La contestation est examinée par un comité indépendant. L\'établissement ne sait jamais qui a témoigné — votre protection est absolue.' },
          { q: 'Qu\'est-ce que l\'indice d\'équité ?', a: 'Un indicateur de 0 à 100 par établissement : 70 × (1 − ressenti moyen de discrimination) + 30 × part des retours positifs, calculé uniquement sur les témoignages vérifiés par la modération et seulement à partir de 5 témoignages vérifiés. Aucune donnée individuelle n\'est publiée pour l\'obtenir. La formule complète est sur la page Méthodologie.' },
        ]
      },
      {
        title: 'Confidentialité & Données',
        icon: Shield,
        color: 'indigo',
        items: [
          { q: 'Mes données sont-elles anonymes ?', a: 'CareWatch™ ne demande ni nom, ni compte ; aucun cookie, aucun identifiant d\'appareil, et aucune adresse IP n\'est conservée avec votre témoignage. L\'accès se fait par code d\'invitation. Le code postal est vérifié localement dans votre navigateur — jamais transmis. Votre récit, lui, est enregistré pour être lu par l\'équipe ; vous pouvez le retirer à tout moment avec votre numéro et votre code personnel. Avant publication, l\'équipe de modération généralise les détails trop spécifiques : par exemple, « 3 février » devient « février 2026 », ou « Unité 4B » devient « Médecine interne » — pour qu\'aucun témoignage ne puisse être relié à une seule personne.' },
          { q: 'Comment sont stockées et sécurisées les données ?', a: 'Site hébergé chez Infomaniak à Genève (ISO 27001) ; base des signalements chez Supabase, à Zurich (Suisse, centre de données AWS eu-central-2), chiffrée au repos. Communications chiffrées (HTTPS). Sans compte ni nom dès la conception. Code personnel stocké uniquement sous forme d\'empreinte. Base inaccessible directement depuis le navigateur. Journal des opérations sans information sur la personne. Politique de confidentialité conforme à la nLPD en pied de page.' },
          { q: 'Qui a accès aux signalements ?', a: 'Uniquement l\'équipe de modération CareWatch™, sous strict accord de confidentialité. Les données publiques sont toujours agrégées et anonymes. Aucun signalement individuel n\'est jamais publié ni transmis à l\'établissement. Même l\'équipe de modération ne peut pas vous identifier.' },
          { q: 'Comment sont utilisées les données ?', a: 'Pour calculer les évaluations des établissements, alimenter la recherche sur l\'équité des soins, et informer les politiques publiques. Toutes les données publiées sont agrégées et anonymes — les détails sont agrégés et généralisés — jamais publiés individuellement. Licence CC BY-NC-SA 4.0.' },
        ]
      },
      {
        title: 'Établissements & Évaluations',
        icon: Building,
        color: 'amber',
        items: [
          { q: 'Comment sont calculées les notes des établissements ?', a: 'Le niveau (Exemplaire, Satisfaisant, À améliorer, Insuffisant) découle directement de l\'indice d\'équité : 75 et plus, 50 à 74, 25 à 49, moins de 25. Rien n\'est calculé sous 5 témoignages vérifiés. Il n\'y a ni inspection, ni pondération par ancienneté, ni tendance dans le calcul actuel. L\'objectif n\'est pas de punir, mais d\'accompagner l\'amélioration — et de protéger les patient·e·s.' },
          { q: 'Un établissement peut-il améliorer sa note ?', a: 'Oui, c\'est tout l\'objectif. Les établissements peuvent s\'engager dans une démarche d\'amélioration, former leur personnel, et voir leur note évoluer positivement. CareWatch™ n\'est pas un tribunal — c\'est un levier d\'amélioration, en toute confidentialité pour les témoins. Chaque signalement contribue à des soins plus justes pour tout le monde.' },
          { q: 'Que signifie chaque niveau d\'évaluation ?', a: 'Exemplaire : excellence dans tous les critères. Satisfaisant : bon niveau avec points d\'amélioration. À améliorer : actions nécessaires. Insuffisant : actions correctives urgentes requises. Ces évaluations sont toujours basées sur des données agrégées, anonymes et vérifiées — jamais sur un seul témoignage isolé. Votre signalement individuel n\'est jamais identifiable.' },
        ]
      },
      {
        title: 'Évolution de la plateforme',
        icon: TrendingUp,
        color: 'indigo',
        items: [
          { q: 'Pourquoi préciser le service et pas seulement l\'établissement ?', a: 'Un hôpital universitaire comme les HUG ou le CHUV compte des dizaines de services, et la qualité peut varier considérablement d\'un service à l\'autre. Préciser le contexte exact rend votre témoignage plus utile et plus protecteur : les équipes qui font bien leur travail ne sont pas pénalisées par les difficultés d\'un autre service. Votre témoignage reste anonyme quel que soit le niveau de détail.' },
          { q: 'Quelles extensions sont prévues ?', a: 'CareWatch™ évolue par phases. Phase 1 (actuelle) : établissements hospitaliers et cliniques de Suisse romande, avec précision au niveau du service, département, consultation ou unité. Phase 2 : offices AI, bureaux d\'expertise des assurances, institutions sociales et de protection de l\'enfance (SPMi, DGEJ, APEA/KESB), et services de soins à domicile (IMAD, CMS Vaud, etc.). Phase 3 : cabinets et professionnel·le·s de santé pluri-disciplinaires — physiothérapie, ergothérapie, ostéopathie, chiropraxie. L\'objectif est de couvrir l\'ensemble du parcours de soins — avec les mêmes garanties de protection de l\'identité à chaque étape.' },
          { q: 'Pourquoi inclure les maladies rares et le COVID long ?', a: 'Les patient·e·s atteint·e·s de maladies chroniques comme le COVID long, la drépanocytose ou la polyarthrite rhumatoïde rencontrent des difficultés majeures dans un système qui ne reconnaît pas toujours leur pathologie. Documenter ces parcours — en toute sécurité et anonymement — aide à identifier les lacunes et à faire bouger les choses. Votre expérience est précieuse, même si elle semble isolée.' },
          { q: 'Les offices AI et assurances seront-ils inclus ?', a: 'Oui, en Phase 2, ainsi que les institutions sociales et de protection de l\'enfance. Les bureaux d\'expertise AI, les offices AI et les institutions comme le SPMi ou l\'APEA représentent des points de friction majeurs pour les patient·e·s et les familles. L\'intégration de ces acteurs permettra de documenter l\'ensemble du parcours — avec les mêmes garanties de protection de l\'identité et de protection contre les représailles.' },
        ]
      },
    ];

    return (
      <div className="min-h-screen bg-gradient-to-b from-gray-50 to-white">
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          <BackButton />
          
          {/* Hero */}
          <div className="text-center mb-10">
            <h1 className="text-3xl md:text-4xl font-bold text-gray-900 mb-3">Questions fréquentes</h1>
            <p className="text-gray-600 max-w-2xl mx-auto">Tout ce que vous devez savoir sur CareWatch™, les signalements, et l'utilisation des données.</p>
          </div>

          {/* FAQ par catégorie */}
          <div className="space-y-6">
            {faqCategories.map(cat => (
              <Card key={cat.title} className="overflow-hidden">
                <div className={`px-6 py-4 bg-${cat.color}-50 border-b border-${cat.color}-100 flex items-center gap-3`}>
                  <cat.icon className={`w-5 h-5 text-${cat.color}-600`} />
                  <h2 className={`font-semibold text-${cat.color}-900`}>{cat.title}</h2>
                </div>
                <div className="divide-y divide-gray-100">
                  {cat.items.map((faq, i) => {
                    const id = `${cat.title}-${i}`;
                    const isOpen = openFaq === id;
                    return (
                      <button key={i} onClick={() => setOpenFaq(isOpen ? null : id)} className="w-full text-left px-6 py-4 hover:bg-gray-50 transition-colors">
                        <div className="flex items-start justify-between gap-4">
                          <p className="font-semibold text-gray-900">{faq.q}</p>
                          <ChevronDown className={`w-5 h-5 text-gray-400 flex-shrink-0 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                        </div>
                        {isOpen && (
                          <p className="mt-3 text-gray-600 text-sm leading-relaxed">{faq.a}</p>
                        )}
                      </button>
                    );
                  })}
                </div>
              </Card>
            ))}
          </div>

          {/* Contact */}
          <Card className="p-6 mt-8 bg-gradient-to-r from-teal-50 to-emerald-50 border-teal-200">
            <div className="text-center">
              <h3 className="font-semibold text-teal-900 mb-2">Vous n'avez pas trouvé votre réponse ?</h3>
              <p className="text-teal-700 text-sm mb-4">L'équipe CareWatch™ est disponible pour répondre à toute question.</p>
              <Button variant="outline" icon={MessageCircle} onClick={() => window.location.href='mailto:contact@carewat.ch'} className="border-teal-500 text-teal-700 hover:bg-teal-100">
                Nous contacter
              </Button>
            </div>
          </Card>
        </div>
      </div>
    );
  }

  if (view === 'partners-public' || view === 'partners') {
    const partners = [
      { cat: 'Institutions', items: ['HEG-Genève (HES-SO) — Convivens Lab, coordination technique et scientifique', 'Unisanté — Centre universitaire de médecine générale et santé publique, Lausanne', 'HUG — Hôpitaux universitaires de Genève, division des sciences de l\'information médicale (SIMED)'] },
      { cat: 'Membres fondateurs', items: ['Convivens Lab (HES-SO Genève) — Coordination technique & scientifique', 'APSR-GE — Réseau de professionnels de santé racisés', 'Association Suisse de la Drépanocytose — Expertise patient & advocacy', 'KimboCare / Resilia — Navigation santé'] },
      { cat: 'Organisations ressources', items: ['FAANG — Médiation interculturelle', 'Centre LAVI — Accompagnement juridique aux victimes', 'Appartenances — Consultations transculturelles', 'Pluriels — Psychiatrie transculturelle', 'Afro-Cité — Forum de dialogue et mobilisation citoyenne'] },
      { cat: 'Partenaires institutionnels', items: ['BAG/OFSP — Soutien institutionnel', 'OBSAN — Partenariat données', 'Swiss Health Network for Equity — Expertise méthodologique', 'Cantons romands (médecins cantonaux)'] },
    ];
    return (
      <div className="min-h-screen bg-white">
        <div className="max-w-3xl mx-auto p-4 md:p-8">
          <BackButton />
          <h2 className="text-2xl font-bold mb-6">Partenaires & Écosystème</h2>
          <div className="space-y-6">
            {partners.map(p => (
              <Card key={p.cat} className="p-6">
                <h3 className="font-semibold mb-3">{p.cat}</h3>
                <ul className="space-y-2">
                  {p.items.map(item => (
                    <li key={item} className="text-sm text-gray-600 flex items-start gap-2">
                      <Check className="w-4 h-4 text-teal-600 mt-0.5" />{item}
                    </li>
                  ))}
                </ul>
              </Card>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (view === 'opendata-public' || view === 'opendata' || view === 'opendata-spec') return <OpenDataPage />;

  return null;
}
        // ============================================
        // RENDER
        // ============================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(CareWatchRoot));
    </script>
</body>
</html>
