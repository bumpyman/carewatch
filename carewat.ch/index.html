  const antiDiscriminationLaw = [
    { id: 'const', cat: 'Droit constitutionnel', articles: [
      { ref: 'Art. 8 al. 1 Cst.', title: 'Égalité devant la loi', text: 'Tous les êtres humains sont égaux devant la loi.', application: 'S\'applique directement dans les relations avec les institutions publiques (hôpitaux publics, HUG, CHUV, etc.). Ne s\'applique pas directement dans les rapports entre privés.' },
      { ref: 'Art. 8 al. 2 Cst.', title: 'Interdiction de la discrimination', text: 'Nul ne doit subir de discrimination du fait notamment de son origine, de sa race, de son sexe, de son âge, de sa langue, de sa situation sociale, de son mode de vie, de ses convictions religieuses, philosophiques ou politiques ni du fait d\'une déficience corporelle, mentale ou psychique.', application: 'Le terme "notamment" signifie que la liste n\'est pas exhaustive. La couleur de peau, l\'ethnie, le statut migratoire sont couverts. Toutefois, cette disposition ne crée pas en soi un droit subjectif invocable devant les tribunaux sans relais législatif.' },
      { ref: 'Art. 35 al. 3 Cst.', title: 'Obligation des autorités', text: 'Les autorités veillent à ce que les droits fondamentaux soient aussi réalisés dans les relations qui lient les particuliers entre eux.', application: 'Impose une obligation positive à l\'État de protéger contre la discrimination, y compris dans le secteur privé de la santé.' },

    { id: 'penal', cat: 'Droit pénal', articles: [
      { ref: 'Art. 261bis CP', title: 'Discrimination raciale', text: 'Quiconque, publiquement, incite à la haine ou à la discrimination envers une personne ou un groupe de personnes en raison de leur appartenance raciale, ethnique ou religieuse; quiconque propage publiquement une idéologie visant à rabaisser ou dénigrer de manière systématique ces personnes...', application: 'Condition de publicité : les propos doivent avoir été tenus devant des tiers (salle d\'attente, couloir, accueil). Les propos en tête-à-tête sont plus difficiles à poursuivre sous cet article mais peuvent relever de l\'atteinte à la personnalité (art. 28 CC).' },
      { ref: 'Art. 173-177 CP', title: 'Diffamation, calomnie, injure', text: 'Protection de l\'honneur. La diffamation (art. 173) suppose l\'allégation de faits; la calomnie (art. 174) vise les allégations fausses connues comme telles; l\'injure (art. 177) est un jugement de valeur méprisant.', application: 'IMPORTANT pour CareWatch™ : un signalement factuel et véridique n\'est pas diffamatoire. La preuve de la vérité (art. 173 ch. 2 CP) est un moyen de défense. Le signalement via CareWatch™ est anonymisé et ne constitue pas une "publication" au sens pénal.' },
      { ref: 'Art. 181 CP', title: 'Contrainte', text: 'Quiconque, en usant de violence envers une personne ou en la menaçant d\'un dommage sérieux, ou en l\'entravant de quelque autre manière dans sa liberté d\'action, l\'oblige à faire, à ne pas faire ou à laisser faire un acte.', application: 'Applicable si un·e soignant·e vous contraint à accepter un traitement, ou si un·e supérieur·e vous empêche de signaler une discrimination.' },
      { ref: 'Art. 312 CP', title: 'Abus d\'autorité', text: 'Les membres d\'une autorité et les fonctionnaires qui, dans le dessein de se procurer ou de procurer à un tiers un avantage illicite, ou dans le dessein de nuire à autrui, auront abusé des pouvoirs de leur charge, seront punis.', application: 'Applicable aux médecins hospitaliers publics qui abusent de leur pouvoir (PLAFA injustifié, traitement discriminatoire systématique, falsification de dossier).' },

    { id: 'civil', cat: 'Droit civil', articles: [
      { ref: 'Art. 28 CC', title: 'Protection de la personnalité', text: 'Celui qui subit une atteinte illicite à sa personnalité peut agir en justice pour sa protection. L\'atteinte est illicite, à moins qu\'elle ne soit justifiée par le consentement de la victime, par un intérêt prépondérant privé ou public, ou par la loi.', application: 'Voie civile principale contre la discrimination. Permet de demander : la cessation de l\'atteinte, la constatation de son caractère illicite, la réparation du dommage (tort moral inclus). Pas besoin de prouver une infraction pénale.' },
      { ref: 'Art. 28a CC', title: 'Actions possibles', text: 'Le demandeur peut requérir du juge : qu\'il interdise l\'atteinte, si elle est imminente; qu\'il la fasse cesser, si elle dure encore; qu\'il en constate le caractère illicite, si le trouble qu\'elle a créé subsiste.', application: 'Trois types d\'actions cumulables. La constatation du caractère illicite est importante même si l\'atteinte a cessé : elle peut servir de base à une demande de dommages-intérêts.' },
      { ref: 'Art. 49 CO', title: 'Réparation du tort moral', text: 'Celui qui subit une atteinte illicite à sa personnalité a droit à une somme d\'argent à titre de réparation morale, pour autant que la gravité de l\'atteinte le justifie et que l\'auteur ne lui ait pas donné satisfaction autrement.', application: 'Dommages-intérêts pour la souffrance morale causée par la discrimination. Le montant dépend de la gravité et de la durée de l\'atteinte. Les tribunaux suisses sont traditionnellement conservateurs dans les montants.' },

  const recourseTypes = [

  const keyDeadlines = [

  const proofStrategies = [
    { title: 'Journal CareWatch™ horodaté', strength: 'Fort', desc: 'Vos entrées horodatées avec hash unique constituent un faisceau d\'indices. Plus il y a d\'entrées régulières, plus le journal est crédible.', tips: ['Écrivez régulièrement, pas seulement lors des incidents', 'Soyez factuel·le : "Le Dr X m\'a dit Y" plutôt que "Le Dr X est raciste"', 'Notez l\'heure, le lieu, les personnes présentes', 'Exportez régulièrement votre journal'] },
    { title: 'Questionnaire DMS', strength: 'Fort', desc: 'Le questionnaire Discrimination in Medical Settings est un instrument validé scientifiquement. Vos réponses constituent une mesure standardisée, pas une accusation.', tips: ['Répondez honnêtement à chaque question', 'Le DMS mesure une expérience subjective : il n\'y a pas de "mauvaise" réponse', 'Votre score ne peut pas être qualifié de diffamatoire'] },
    { title: 'Témoins', strength: 'Très fort', desc: 'Le témoignage de tiers (proches, autres patient·e·s, professionnel·le·s) est considéré comme une preuve directe par les tribunaux.', tips: ['Notez les noms et coordonnées des témoins potentiels', 'Demandez-leur s\'ils accepteraient de témoigner', 'Les témoignages écrits (attestations) ont une force probante moindre que les témoignages oraux'] },
    { title: 'Enregistrements', strength: 'Variable', desc: 'En Suisse, l\'enregistrement d\'une conversation à laquelle vous participez est légal (art. 179ter CP a contrario). Mais l\'enregistrement secret de tiers est punissable.', tips: ['Vous pouvez enregistrer une conversation à laquelle vous participez', 'N\'enregistrez JAMAIS une conversation entre tiers', 'Informez si possible votre interlocuteur·rice', 'Un enregistrement peut être écarté comme preuve illicite'] },
    { title: 'Documents écrits', strength: 'Fort', desc: 'Courriers, emails, rapports médicaux, factures, notes de sortie. Tout document écrit a une forte valeur probante.', tips: ['Conservez tous les documents médicaux', 'Faites vos demandes par écrit (courrier recommandé)', 'Gardez les accusés de réception', 'Photographiez les documents qu\'on refuse de vous remettre'] },
    { title: 'Statistiques CareWatch™', strength: 'Contextuel', desc: 'Les données agrégées de CareWatch™ montrent des patterns de discrimination dans un établissement. Elles peuvent renforcer votre cas individuel.', tips: ['Les statistiques ne prouvent pas votre cas individuel', 'Elles renforcent la crédibilité de votre récit', 'Utiles pour montrer un comportement systémique'] },

  const diffamationDefense = [
    { title: 'Preuve de la vérité (art. 173 ch. 2 CP)', desc: 'Si vous prouvez la véracité de vos allégations de manière "totale, parfaite, indiscutable, complète et liée aux imputations diffamatoires dans toute leur portée", vous n\'êtes pas punissable.', difficulty: 'Très exigeant — la barre est haute. C\'est pourquoi la documentation préalable est cruciale.' },
    { title: 'Preuve de la bonne foi (art. 173 ch. 3 CP)', desc: 'Si vous prouvez avoir eu des raisons suffisantes de tenir vos allégations pour vraies ET que vous avez agi dans un intérêt légitime, vous n\'êtes pas punissable.', difficulty: 'Plus accessible. Le signalement CareWatch™ (intérêt public) + documentation (raisons suffisantes) = bonne défense.' },

  return (
    <div className="p-4 md:p-6 lg:p-8 max-w-6xl mx-auto overflow-x-hidden">

            <h2 className="text-xl font-bold text-gray-900 mb-1">Guide juridique</h2>

            <p className="text-sm text-indigo-600 mt-2 bg-indigo-100 px-3 py-1 rounded-lg inline-block"><strong>Avertissement :</strong> Ce guide est informatif. Pour une situation concrète, consultez un·e avocat·e.</p>
            <p className="text-sm text-teal-700 mt-1 bg-teal-50 px-3 py-1 rounded-lg inline-block"><Shield className="w-3.5 h-3.5 inline mr-1" /> Consulter ce guide est anonyme — aucune trace n'est conservée.</p>
          </div>

      </div>

      {/* Tabs */}
      <div className="flex flex-wrap gap-2 mb-6">
        {[
          { id: 'droits', label: 'Mes droits', icon: Shield },
          { id: 'cadre', label: 'Cadre légal', icon: BookOpen },
          { id: 'recours', label: 'Voies de recours', icon: Scale },
          { id: 'delais', label: 'Délais', icon: Clock },

      {/* DROITS FONDAMENTAUX */}
      {activeTab === 'droits' && (
        <div className="space-y-3">
          <Card className="p-4 bg-teal-50 border-teal-100">
            <p className="text-sm text-teal-800">Vos droits en tant que {isPro ? 'professionnel·le de santé' : 'patient·e'} sont garantis par le droit fédéral, cantonal et international. Cliquez sur chaque droit pour voir les articles de loi et les conseils pratiques.</p>

          {patientRights.map(right => (
            <Card key={right.id} className="overflow-hidden">
              <button onClick={() => toggle(right.id)} className="w-full p-4 text-left hover:bg-gray-50 transition-colors">
                <div className="flex items-start gap-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center flex-shrink-0">
                    <right.icon className="w-5 h-5 text-indigo-600" />
                  </div>

                    <div className="bg-rose-50 rounded-xl p-3">

                </div>
              )}
            </Card>
          ))}
        </div>

        <div className="space-y-6">

            <div key={cat.id}>

                {cat.articles.map(art => (
                  <Card key={art.ref} className="overflow-hidden">

                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className="px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 text-xs font-mono font-medium">{art.ref}</span>

                          <p className="text-sm text-teal-600 font-medium mb-1">Application concrète</p>
                          <p className="text-sm text-teal-800">{art.application}</p>

          <Card className="p-4 bg-indigo-50 border-indigo-100">
            <p className="text-sm text-indigo-800">

          </Card>

          {recourseTypes.map(r => (
            <Card key={r.id} className="overflow-hidden">
              <button onClick={() => toggle(r.id)} className="w-full p-4 text-left hover:bg-gray-50 transition-colors">
                <div className="flex items-start gap-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center flex-shrink-0">
                    <r.icon className="w-5 h-5 text-indigo-600" />

                    <h3 className="font-medium text-gray-900">{r.title}</h3>
                    <div className="flex flex-wrap gap-2 mt-1">
                      <span className="px-2 py-0.5 rounded bg-gray-100 text-gray-600 text-xs">{r.difficulty}</span>
                      <span className="px-2 py-0.5 rounded bg-gray-100 text-gray-600 text-xs">{r.cost}</span>
                      <span className="px-2 py-0.5 rounded bg-amber-50 text-amber-700 text-xs">{r.delai}</span>
                      <span className="px-2 py-0.5 rounded bg-blue-50 text-blue-700 text-xs">Durée : {r.duration}</span>
                    </div>
                  </div>
                  <ChevronDown className={`w-5 h-5 text-gray-400 flex-shrink-0 transition-transform ${expandedSection === r.id ? 'rotate-180' : ''}`} />
                </div>
              </button>
              {expandedSection === r.id && (
                <div className="px-4 pb-4 border-t space-y-4">
                  {/* Étapes */}
                  <div className="mt-3">
                    <p className="text-sm text-gray-600 font-medium mb-2">Étapes</p>
                    <div className="space-y-2">
                      {r.steps.map((s, i) => (
                        <div key={i} className="flex items-start gap-2">
                          <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-medium flex-shrink-0">{i+1}</span>
                          <p className="text-sm text-gray-700">{s}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                  {/* Avantages / Inconvénients */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="bg-emerald-50 rounded-xl p-3">
                      <p className="text-sm text-emerald-600 font-medium mb-2">Avantages</p>
                      {r.pros.map((p, i) => (
                        <div key={i} className="flex items-start gap-1 mb-1">
                          <Check className="w-3 h-3 text-emerald-500 mt-0.5 flex-shrink-0" />
                          <p className="text-sm text-emerald-800">{p}</p>
                        </div>
                      ))}
                    </div>
                    <div className="bg-rose-50 rounded-xl p-3">
                      <p className="text-sm text-rose-600 font-medium mb-2">Limites</p>
                      {r.cons.map((c, i) => (
                        <div key={i} className="flex items-start gap-1 mb-1">
                          <AlertTriangle className="w-3 h-3 text-rose-500 mt-0.5 flex-shrink-0" />
                          <p className="text-sm text-rose-800">{c}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                  {r.template && (
                    <button onClick={() => { setActiveTab('documents'); setDocType(r.id); }} className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
                      <FileText className="w-4 h-4" /> Générer ce courrier (pré-rempli)
                    </button>
                  )}
                </div>
              )}
            </Card>
          ))}
        </div>
      )}

      {/* DÉLAIS */}
      {activeTab === 'delais' && (
        <div className="space-y-4">
          <Card className="p-4 bg-rose-50 border-rose-100">
            <div className="flex items-start gap-3">
              <Clock className="w-5 h-5 text-rose-600 flex-shrink-0 mt-0.5" />
              <p className="text-sm text-rose-800">
                <strong>Les délais sont impératifs.</strong> Un recours ou une plainte déposé·e hors délai sera irrecevable, sans possibilité de rattrapage. En cas de doute, agissez d'abord, vérifiez ensuite.
              </p>
            </div>
          </Card>

          <div className="space-y-2">
            {keyDeadlines.sort((a, b) => {
              const order = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
              return order[a.urgency] - order[b.urgency];
            }).map((d, i) => (
              <Card key={i} className={`p-4 border ${urgencyColors[d.urgency]}`}>
                <div className="flex items-start gap-4">
                  <div className="text-center flex-shrink-0 min-w-16">
                    <p className="text-xl font-bold">{d.delai}</p>
                    <p className="text-xs capitalize">{d.urgency === 'critical' ? 'Critique' : d.urgency === 'high' ? 'Urgent' : d.urgency === 'medium' ? 'Important' : d.urgency === 'info' ? 'Info' : 'Standard'}</p>
                  </div>
                  <div>
                    <p className="font-semibold text-gray-900">{d.desc}</p>
                    <p className="text-sm text-gray-600 mt-1">{d.detail}</p>
                  </div>
                </div>
              </Card>
            ))}
          </div>

          <Card className="p-4 bg-amber-50 border-amber-100">
            <h3 className="font-medium text-amber-900 mb-2">Comment ne pas rater un délai</h3>
            <div className="space-y-2">
              {[
                'Notez immédiatement la date de tout événement (décision, incident, notification)',
                'Calculez le délai et programmez un rappel 5 jours avant l\'échéance',
                'Privilégiez l\'envoi par courrier recommandé (preuve de date)',
                'En cas de doute sur le point de départ du délai, consultez un·e avocat·e',
                'Utilisez le journal CareWatch™ pour horodater vos démarches',
              ].map((tip, i) => (
                <div key={i} className="flex items-start gap-2">
                  <Check className="w-4 h-4 text-amber-600 mt-0.5 flex-shrink-0" />
                  <p className="text-sm text-amber-800">{tip}</p>
                </div>
              ))}
            </div>
          </Card>
        </div>
      )}

      {/* GÉNÉRER UN COURRIER */}
      {activeTab === 'documents' && (
        <div className="space-y-4">
          <Card className="p-4 bg-indigo-50 border-indigo-100">
            <div className="flex items-start gap-3">
              <FileText className="w-5 h-5 text-indigo-600 flex-shrink-0 mt-0.5" />
              <div>
                <p className="text-sm text-indigo-800">
                  <strong>Générez un courrier juridique pré-rempli</strong> à partir de votre signalement CareWatch™.{lastReport ? ` Votre dernier signalement (${lastReport.code}) a été utilisé pour pré-remplir les documents.` : ' Effectuez d\u2019abord un signalement pour pré-remplir automatiquement les courriers.'}
                </p>
                <p className="text-sm text-indigo-600 mt-1">Les documents générés restent sur votre appareil. Aucune donnée n'est envoyée. Relisez et complétez les champs entre [crochets] avant envoi.</p>
              </div>
            </div>
          </Card>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            {/* Sidebar: canton + coordonnées */}
            <div className="lg:col-span-1 space-y-4">
              {/* Sélection du canton */}
              <Card className="p-4">
                <h3 className="font-medium text-gray-900 mb-2 flex items-center gap-2">
                  <MapPin className="w-4 h-4 text-gray-500" /> Canton
                </h3>
                <p className="text-sm text-gray-500 mb-2">Détermine les adresses des destinataires</p>
                <div className="flex flex-wrap gap-1.5">
                  {Object.entries(DB.cantonNames).map(([code, name]) => (
                    <button key={code} onClick={() => setSelectedCanton(code)} className={`px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors ${selectedCanton === code ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-indigo-50 hover:border-indigo-300'}`}>
                      {name}
                    </button>
                  ))}
                </div>
                {lastReport?.canton && lastReport.canton !== selectedCanton && (
                  <p className="text-sm text-amber-600 mt-2 flex items-center gap-1">
                    <AlertTriangle className="w-3 h-3 flex-shrink-0" />
                    Signalement : {DB.cantonNames[lastReport.canton] || lastReport.canton}. Courrier : {DB.cantonNames[selectedCanton]}.
                  </p>
                )}
              </Card>

              {/* Formulaire coordonnées */}
              <Card className="p-4">
                <h3 className="font-medium text-gray-900 mb-3 flex items-center gap-2">
                  <Users className="w-4 h-4 text-gray-500" /> Coordonnées <span className="text-sm text-gray-500">(facultatif)</span>
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <input value={docUserInfo.prenom} onChange={e => setDocUserInfo({...docUserInfo, prenom: e.target.value})} placeholder="Prénom" className="px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                  <input value={docUserInfo.nom} onChange={e => setDocUserInfo({...docUserInfo, nom: e.target.value})} placeholder="Nom" className="px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                  <input value={docUserInfo.adresse} onChange={e => setDocUserInfo({...docUserInfo, adresse: e.target.value})} placeholder="Adresse" className="px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 sm:col-span-2 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                  <input value={docUserInfo.npa} onChange={e => setDocUserInfo({...docUserInfo, npa: e.target.value})} placeholder="NPA" className="px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                  <input value={docUserInfo.ville} onChange={e => setDocUserInfo({...docUserInfo, ville: e.target.value})} placeholder="Ville" className="px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                  <input value={docUserInfo.tel} onChange={e => setDocUserInfo({...docUserInfo, tel: e.target.value})} placeholder="Téléphone" className="px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                  <input value={docUserInfo.email} onChange={e => setDocUserInfo({...docUserInfo, email: e.target.value})} placeholder="Email" className="px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                </div>
              </Card>
            </div>

            {/* Main: documents */}
            <div className="lg:col-span-2 space-y-3">
            {documentTypes.map(dt => {
              const isOpen = docType === dt.id;
              return (
                <Card key={dt.id} className="overflow-hidden">
                  <button onClick={() => setDocType(isOpen ? null : dt.id)} className="w-full p-4 text-left hover:bg-gray-50 transition-colors">
                    <div className="flex items-start gap-3">
                      <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${dt.id === 'plafa' ? 'bg-rose-50' : dt.id === 'penal' ? 'bg-amber-50' : 'bg-indigo-50'}`}>
                        <dt.icon className={`w-5 h-5 ${dt.id === 'plafa' ? 'text-rose-600' : dt.id === 'penal' ? 'text-amber-600' : 'text-indigo-600'}`} />
                      </div>
                      <div className="flex-1">
                        <h3 className="font-medium text-gray-900">{dt.label}</h3>
                        <p className="text-sm text-gray-600 mt-0.5">{dt.desc}</p>
                      </div>
                      <ChevronDown className={`w-5 h-5 text-gray-400 flex-shrink-0 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </div>
                  </button>
                  {isOpen && (
                    <div className="px-4 pb-4 border-t">
                      <div className="mt-3 mb-3">
                        <div className="flex items-center gap-2 mb-2">
                          <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${lastReport ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-500'}`}>
                            {lastReport ? `Pré-rempli avec ${lastReport.code}` : 'Modèle vierge'}
                          </span>
                          <span className="text-sm text-gray-500">Canton : {DB.cantonNames?.[selectedCanton] || 'Genève'}</span>
                        </div>
                      </div>
                      <pre className="bg-gray-50 rounded-xl p-4 text-sm text-gray-700 whitespace-pre-wrap font-mono max-h-80 overflow-y-auto border border-gray-200 mb-3">{generateDocument(dt.id)}</pre>
                      <div className="flex gap-2">
                        <button onClick={() => { navigator.clipboard?.writeText(generateDocument(dt.id)); }} className="flex-1 py-2 px-3 rounded-lg bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700 transition-colors flex items-center justify-center gap-1.5">
                          <ClipboardList className="w-3.5 h-3.5" /> Copier
                        </button>
                        <button onClick={() => { const blob = new Blob([generateDocument(dt.id)], {type: 'text/plain;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'CareWatch™_' + dt.id + '_' + new Date().toISOString().slice(0,10) + '.txt'; a.click(); }} className="flex-1 py-2 px-3 rounded-lg bg-white text-indigo-700 text-xs font-medium border border-indigo-300 hover:bg-indigo-50 transition-colors flex items-center justify-center gap-1.5">
                          <Download className="w-3.5 h-3.5" /> Télécharger (.txt)
                        </button>
                      </div>
                      <p className="text-sm text-gray-500 mt-2 flex items-start gap-1">
                        <AlertTriangle className="w-3 h-3 flex-shrink-0 mt-0.5" />
                        Ce modèle ne constitue pas un conseil juridique. Relisez attentivement, complétez les champs entre [crochets], et consultez un·e avocat·e ou un·e délégué·e CareWatch™ en cas de doute.
                      </p>
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
          </div>
        </div>
      )}

      {/* PREUVES & DÉFENSE */}
      {activeTab === 'preuves' && (
        <div className="space-y-6">
          {/* Stratégies de preuve */}
          <div>
            <h3 className="font-semibold text-gray-900 mb-3">Constituer votre dossier</h3>
            <Card className="p-4 bg-teal-50 border-teal-100 mb-3">
              <p className="text-sm text-teal-800">La discrimination est difficile à prouver. L'enjeu est de constituer un <strong>faisceau d'indices concordants</strong> — un ensemble d'éléments qui, pris individuellement, ne prouvent rien, mais qui ensemble rendent la discrimination plausible.</p>
            </Card>
            <div className="space-y-3">
              {proofStrategies.map(ps => (
                <Card key={ps.title} className="overflow-hidden">
                  <button onClick={() => toggle('proof-' + ps.title)} className="w-full p-4 text-left hover:bg-gray-50">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <h4 className="font-medium">{ps.title}</h4>
                          <span className={`px-2 py-0.5 rounded text-xs ${ps.strength === 'Très fort' ? 'bg-emerald-100 text-emerald-700' : ps.strength === 'Fort' ? 'bg-teal-100 text-teal-700' : ps.strength === 'Variable' ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-600'}`}>{ps.strength}</span>
                        </div>
                        <p className="text-sm text-gray-600">{ps.desc.slice(0, 100)}...</p>
                      </div>
                      <ChevronDown className={`w-5 h-5 text-gray-400 flex-shrink-0 transition-transform ${expandedSection === 'proof-' + ps.title ? 'rotate-180' : ''}`} />
                    </div>
                  </button>
                  {expandedSection === 'proof-' + ps.title && (
                    <div className="px-4 pb-4 border-t">
                      <p className="text-sm text-gray-700 mt-3 mb-3">{ps.desc}</p>
                      <div className="bg-gray-50 rounded-xl p-3">
                        <p className="text-sm text-gray-600 font-medium mb-2">Conseils pratiques</p>
                        {ps.tips.map((t, i) => (
                          <div key={i} className="flex items-start gap-2 mb-1">
                            <Check className="w-3 h-3 text-teal-500 mt-0.5 flex-shrink-0" />
                            <p className="text-sm text-gray-700">{t}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </Card>
              ))}
            </div>
          </div>

          {/* Protection contre la diffamation */}
          <div>
            <h3 className="font-semibold text-gray-900 mb-3 flex items-center gap-2">
              <ShieldCheck className="w-5 h-5 text-indigo-500" />
              Se protéger contre une accusation de diffamation
            </h3>
            <Card className="p-4 bg-rose-50 border-rose-100 mb-3">
              <p className="text-sm text-rose-800">
                <strong>Le risque :</strong> la personne mise en cause peut porter plainte en diffamation (art. 173 CP). La jurisprudence exige une preuve de la vérité « totale, parfaite, indiscutable, complète et liée aux imputations dans toute leur portée ». C'est une barre très haute. Voici comment CareWatch™ vous protège.
              </p>
            </Card>
            <div className="space-y-3">
              {diffamationDefense.map((d, i) => (
                <Card key={i} className="p-4">
                  <h4 className="font-medium text-gray-900 mb-1">{d.title}</h4>
                  <p className="text-sm text-gray-700 mb-2">{d.desc}</p>
                  <div className={`px-3 py-2 rounded-lg text-xs ${d.difficulty.includes('Très exigeant') ? 'bg-rose-50 text-rose-700' : d.difficulty.includes('Plus accessible') || d.difficulty.includes('Solide') || d.difficulty.includes('Protection') ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                    <strong>Niveau de protection :</strong> {d.difficulty}
                  </div>
                </Card>
              ))}
            </div>

            <Card className="p-4 bg-amber-50 border-amber-100 mt-3">
              <h4 className="font-medium text-amber-900 mb-2">Règles d'or pour se protéger</h4>
              <div className="space-y-2">
                {[
                  'Toujours décrire des FAITS, jamais des qualificatifs ("il m\'a dit X" ≠ "il est raciste")',
                  'Utiliser le conditionnel ou la forme subjective ("j\'ai ressenti", "il m\'a semblé")',
                  'Ne jamais nommer publiquement un·e professionnel·le (le signalement CareWatch™ est anonymisé)',
                  'Conserver toutes les preuves de ce que vous avancez',
                  'Agir dans un intérêt légitime (amélioration du système, pas vengeance)',
                  'En cas de plainte reconventionnelle, NE RIEN DÉCLARER sans avocat·e',
                ].map((rule, i) => (
                  <div key={i} className="flex items-start gap-2">
                    <Shield className="w-4 h-4 text-amber-600 mt-0.5 flex-shrink-0" />
                    <p className="text-sm text-amber-800">{rule}</p>
                  </div>
                ))}
              </div>
            </Card>
          </div>

          {/* Abus de pouvoir */}
          <div>
            <h3 className="font-semibold text-gray-900 mb-3 flex items-center gap-2">
              <AlertTriangle className="w-5 h-5 text-rose-500" />
              Face à un abus de pouvoir médical
            </h3>
            <Card className="p-4 border-rose-200">
              <p className="text-sm text-gray-700 mb-3">Un·e médecin qui invente ou exagère un diagnostic pour justifier un PLAFA, une hospitalisation forcée, ou pour discréditer un·e patient·e commet potentiellement plusieurs infractions :</p>
              <div className="space-y-2 mb-3">
                {[
                  { art: 'Art. 312 CP', desc: 'Abus d\'autorité — si médecin dans un hôpital public' },
                  { art: 'Art. 251 CP', desc: 'Faux dans les titres — falsification du dossier médical' },
                  { art: 'Art. 318 CP', desc: 'Faux certificat médical — si le médecin établit un faux rapport' },
                  { art: 'Art. 183 CP', desc: 'Séquestration — privation de liberté injustifiée' },
                  { art: 'Art. 28 CC', desc: 'Atteinte à la personnalité — voie civile' },
                  { art: 'Art. 305 CP', desc: 'Entrave à la justice — si manipulation des preuves ou du processus judiciaire' },
                ].map(item => (
                  <div key={item.art} className="flex items-start gap-3 bg-gray-50 rounded-lg p-2">
                    <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-700 text-xs font-mono flex-shrink-0">{item.art}</span>
                    <p className="text-sm text-gray-700">{item.desc}</p>
                  </div>
                ))}
              </div>
              <div className="bg-indigo-50 rounded-xl p-3">
                <p className="text-sm text-indigo-800"><strong>Action immédiate :</strong> Documentez tout dans votre journal CareWatch™. Demandez une copie du dossier médical (art. 25 LPD). Contactez un·e avocat·e et le Centre LAVI. Utilisez le module PLAFA si un placement est craint.</p>
              </div>
            </Card>
          </div>
        </div>
      )}

      {/* CONTACTS CANTONAUX */}
      {activeTab === 'contacts' && (
        <div className="space-y-4">
          <div className="flex items-center gap-3 mb-4">
            <Select value={selectedCanton} onChange={setSelectedCanton} options={Object.keys(cantonalContacts).map(c => ({ value: c, label: DB.cantonNames[c] }))} placeholder="Canton" className="min-w-[12rem] flex-shrink-0" />
          </div>

          {cantonalContacts[selectedCanton] && (
            <div className="space-y-3">
              {[
                { key: 'lavi', label: 'Centre LAVI', icon: Heart, color: 'rose', priority: true, desc: 'Aide gratuite aux victimes d\'infractions. Premier réflexe recommandé.' },
                { key: 'medecin', label: 'Médecin cantonal', icon: Stethoscope, color: 'amber', desc: 'Autorité de surveillance des professionnel·le·s de santé.' },
                { key: 'tpae', label: 'Tribunal de protection / APEA', icon: Scale, color: 'indigo', desc: 'Recours PLAFA et mesures de protection.' },
                { key: 'aidejuridique', label: 'Aide juridique', icon: Shield, color: 'teal', desc: 'Assistance juridique gratuite pour les personnes à faible revenu.' },
                { key: 'barreau', label: 'Ordre des avocats', icon: Briefcase, color: 'gray', desc: 'Permanence juridique et recherche d\'avocat·e.' },
                { key: 'ombudsman', label: 'Médiation / Ombudsman', icon: Users, color: 'emerald', desc: 'Résolution amiable des conflits.' },
                { key: 'police', label: 'Police (plainte pénale)', icon: Shield, color: 'blue', desc: 'Dépôt de plainte pénale.' },
              ].map(item => {
                const contact = cantonalContacts[selectedCanton][item.key];
                if (!contact) return null;
                return (
                  <Card key={item.key} className={`p-4 ${item.priority ? 'border-2 border-rose-200 bg-rose-50' : ''}`}>
                    <div className="flex items-start gap-3">
                      <div className={`w-10 h-10 rounded-xl bg-${item.color}-100 flex items-center justify-center flex-shrink-0`}>
                        <item.icon className={`w-5 h-5 text-${item.color}-600`} />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                          <h4 className="font-medium text-gray-900">{item.label}</h4>
                          {item.priority && <span className="px-2 py-0.5 rounded bg-rose-200 text-rose-700 text-xs">Prioritaire</span>}
                        </div>
                        <p className="text-sm font-medium text-gray-700">{contact.name}</p>
                        {contact.org && <p className="text-sm text-gray-600">{contact.org}</p>}
                        <p className="text-sm text-gray-700 mt-1">{item.desc}</p>
                        {contact.address && <p className="text-sm text-gray-700 mt-1 break-words">{contact.address}</p>}
                        <div className="flex flex-wrap items-center gap-3 mt-2">
                          {contact.phone && <a href={`tel:${contact.phone.replace(/\s/g, '')}`} className={`text-${item.color}-600 font-medium text-sm`}>{contact.phone}</a>}
                          {contact.url && <a href={contact.url} target="_blank" rel="noopener noreferrer" className="text-gray-500 text-xs flex items-center gap-1">Site web <ExternalLink className="w-3 h-3" /></a>}
                        </div>
                      </div>
                    </div>
                  </Card>
                );
              })}

              {/* Contacts nationaux */}
              <h3 className="font-medium text-gray-700 mt-6 mb-3">Contacts nationaux</h3>
              {[

    { id: 8, date: '25 nov 2025', title: 'SLHS : Recommandations pour un monitoring qualité en Suisse', summary: 'Le Swiss Learning Health System publie un rapport mandaté par la Commission fédérale pour la qualité, proposant des modèles de tableaux de bord et de reporting public pour le système de santé suisse.', source: 'SLHS', type: 'research', url: 'https://www.slhs.ch/en/latest-news/posts/quality-monitoring-and-public-reporting-in-the-swiss-healthcare-system-recommendations-released/' },

    { title: 'The Learning Healthcare Project', org: 'Newcastle University', url: 'https://learninghealthcareproject.org/', desc: 'Rapports et études de cas internationaux sur les systèmes de santé apprenants' },
  ];

  const typeColors = { announcement: 'bg-teal-100 text-teal-700', research: 'bg-indigo-100 text-indigo-700', policy: 'bg-amber-100 text-amber-700', training: 'bg-emerald-100 text-emerald-700' };
  const typeLabels = { announcement: 'Annonce', research: 'Recherche', policy: 'Politique', training: 'Formation' };

  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto">

      <p className="text-gray-600 mb-1">Veille sur la qualité et l'équité des soins en Suisse</p>

      {activeTab === 'news' && (
        <div className="space-y-4">

            <Card className="p-4">

              <p className="text-sm text-gray-600 mb-3">Titres relevés sur les sites de l’OFSP, de l’Obsan, de la Revue Médicale Suisse, d’Unisanté, de la HETSL, de la Commission fédérale contre le racisme et de swimsa. Mise à jour toutes les six heures, sans sélection éditoriale.</p>

              {veille.entrees.length === 0 && <p className="text-sm text-gray-500">Aucune entrée pour l’instant.</p>}
              <div className="divide-y">
                {(moderateur ? veille.entrees : veille.visibles).slice(0, veilleTout ? 200 : 12).map(e => {
                  const masque = veille.masques.includes(e.lien);
                  return (
                    <div key={e.lien} className={`py-3 ${masque ? 'opacity-60' : ''}`}>
                      <p className="text-xs text-gray-500 mb-0.5">{cwDateCourte(e.date)}{e.source ? ` · ${e.source}` : ''}{masque ? ' · masqué' : ''}</p>
                      <a href={e.lien} target="_blank" rel="noopener noreferrer" className="font-medium text-gray-900 hover:text-teal-700">{e.titre}</a>
                      {e.resume && <p className="text-sm text-gray-600 mt-1">{e.resume}</p>}
                      {moderateur && <button onClick={() => basculer(e.lien, !masque)} className="text-xs text-teal-700 underline mt-1">{masque ? 'Réafficher' : 'Masquer'}</button>}

                })}
              </div>
              {(moderateur ? veille.entrees : veille.visibles).length > 12 && (
                <button onClick={() => setVeilleTout(v => !v)} className="text-sm text-teal-700 underline mt-3">{veilleTout ? 'Réduire' : 'Afficher tout'}</button>
              )}
            </Card>
          )}
          {news.map(n => (
            <Card key={n.id} className="p-4">
              <div className="flex items-start justify-between mb-2">
                <span className={`px-2 py-1 rounded text-xs ${typeColors[n.type]}`}>{typeLabels[n.type]}</span>
                <span className="text-sm text-gray-700">{n.date}</span>
              </div>
              <h3 className="font-medium mb-1">{n.title}</h3>
              <p className="text-sm text-gray-600 mb-2">{n.summary}</p>
              <div className="flex items-center justify-between">
                <span className="text-sm text-gray-700">Source : {n.source}</span>
                {n.url && <a href={n.url} target="_blank" rel="noopener noreferrer" className="text-teal-600 text-sm flex items-center gap-1">Lire plus <ExternalLink className="w-3 h-3" /></a>}
              </div>
            </Card>
          ))}
        </div>
      )}

      {activeTab === 'resources' && (
        <div className="space-y-4">
          {resources.map(r => (
            <Card key={r.title} className="p-4">
              <div className="flex items-start gap-4">
                <div className="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center flex-shrink-0">
                  <BookOpen className="w-5 h-5 text-indigo-600" />
                </div>
                <div className="flex-1">
                  <h3 className="font-medium">{r.title}</h3>
                  <p className="text-sm text-gray-600">{r.org}</p>
                  <p className="text-sm text-gray-600 mt-1">{r.desc}</p>
                </div>
                <a href={r.url} target="_blank" rel="noopener noreferrer" className="text-teal-600">
                  <ExternalLink className="w-5 h-5" />
                </a>
              </div>
            </Card>
          ))}
        </div>
      )}

      {activeTab === 'publications' && (
        <div className="space-y-4">
          <Card className="p-6 bg-indigo-50 border-indigo-100">
            <h3 className="font-medium text-indigo-900 mb-2">Publications CareWatch™</h3>
            <p className="text-sm text-indigo-700 mb-4">Rapports et analyses de l'observatoire</p>
            <div className="space-y-3">
              {[
                { title: 'Rapport annuel 2024 - Équité des soins en Suisse romande', date: 'Janvier 2025' },
                { title: 'Analyse des signalements Q4 2024', date: 'Décembre 2024' },
                { title: 'Focus : Urgences et discriminations', date: 'Novembre 2024' },
              ].map(p => (
                <div key={p.title} className="flex items-center justify-between bg-white rounded-lg p-3">
                  <div>
                    <p className="font-medium text-sm">{p.title}</p>
                    <p className="text-sm text-gray-600">{p.date}</p>
                  </div>
                  <Button size="sm" variant="outline" icon={FileText}>PDF</Button>
                </div>
              ))}
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

              <Button variant="secondary" onClick={() => setSelectedSupporter(null)} className="flex-1">Fermer</Button>
              <Button className="flex-1" icon={Calendar} disabled>Prendre rendez-vous (bientôt)</Button>
            </div>
          </div>

    </div>

// Admin views
// Construit, à partir des témoignages réels, la même structure que la configuration de démonstration
const construirePeriodeReelle = (recits, period, DB) => {
  const jours = { week: 7, month: 30, quarter: 90, year: 365 }[period] || 30;
  const libelle = { week: 'cette semaine', month: 'ce mois', quarter: 'ce trimestre', year: 'cette année' }[period];
  const maintenant = Date.now(), debut = maintenant - jours * 86400000, debutPrec = debut - jours * 86400000;
  const date = (r) => new Date(r.cree_le || 0).getTime();
  const dans = recits.filter(r => date(r) >= debut);
  const avant = recits.filter(r => date(r) >= debutPrec && date(r) < debut);
  const estVerifie = (r) => r.statut === 'verifie' || r.statut === 'publie';
  const nb = dans.length, nbAvant = avant.length;
  const variation = nbAvant === 0 ? (nb > 0 ? '+100%' : '0%') : ((nb - nbAvant) / nbAvant * 100 >= 0 ? '+' : '') + Math.round((nb - nbAvant) / nbAvant * 100) + '%';
  // découpage en tranches de temps
  const tranches = period === 'week' ? 7 : period === 'month' ? 4 : period === 'quarter' ? 3 : 12;
  const chart = [];
  for (let i = 0; i < tranches; i++) {
    const a = debut + i * (jours * 86400000 / tranches), b = debut + (i + 1) * (jours * 86400000 / tranches);
    const d = new Date(a);
    const label = period === 'week' ? ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'][d.getDay()] : period === 'month' ? 'S' + (i + 1) : d.toLocaleDateString('fr-CH', { month: 'short' });
    const t = dans.filter(r => date(r) >= a && date(r) < b);
    chart.push({ label, signalements: t.length, verifies: t.filter(estVerifie).length });
  }
  const compter = (cle, n) => {
    const m = {}; dans.forEach(r => { const k = r[cle] || 'Non précisé'; m[k] = (m[k] || 0) + 1; });
    const liste = Object.entries(m).sort((x, y) => y[1] - x[1]);
    const top = liste.slice(0, n), reste = liste.slice(n).reduce((a, x) => a + x[1], 0);
    if (reste > 0) top.push(['Autres', reste]);
    return top;
  };
  const total = Math.max(dans.length, 1);
  return {
    label: libelle, reports: dans.filter(r => r.type !== 'positif').length, verified: dans.filter(r => r.type !== 'positif' && estVerifie(r)).length, contested: dans.filter(r => r.statut === 'rejete').length,
    trend: variation, trendColor: variation.startsWith('-') ? 'text-rose-600 bg-rose-50' : 'text-emerald-600 bg-emerald-50',
    chart,
    incidents: compter('type_incident', 5).map(([type, count]) => ({ type, count, pct: Math.round(count / total * 100) })),
    services: compter('service', 5).filter(([k]) => k !== 'Autres').map(([service, count]) => ({ service, count, trend: 'stable' })),
    activite: recits.slice().sort((x, y) => new Date(y.modifie_le || y.cree_le) - new Date(x.modifie_le || x.cree_le)).slice(0, 6).map(r => {
      const dt = new Date(r.modifie_le || r.cree_le), h = Math.round((maintenant - dt.getTime()) / 3600000);
      const time = h < 1 ? 'À l’instant' : h < 48 ? 'Il y a ' + h + 'h' : 'Il y a ' + Math.round(h / 24) + ' j';
      const action = r.statut === 'verifie' ? 'Témoignage vérifié' : r.statut === 'publie' ? 'Fiche publiée' : r.statut === 'rejete' ? 'Témoignage rejeté' : r.statut === 'retire' ? 'Retiré par la personne' : (r.type === 'positif' ? 'Nouveau retour positif' : 'Nouveau signalement');
      const type = r.statut === 'verifie' || r.statut === 'publie' ? 'verified' : r.statut === 'rejete' || r.statut === 'retire' ? 'contested' : 'new';
      return { time, action, detail: (r.etablissement_nom || 'Établissement non précisé') + (r.service ? ' - ' + r.service : ''), type, numero: r.numero };
    }),
  };
};

function AdminDashboard() {
  const { stats, DB, reports, user } = useApp();
  const [period, setPeriod] = useState('month');
  const reel = !!(user && user.reel);
  const [recitsReels, setRecitsReels] = useState(null);
  useEffect(() => {
    if (!reel) return;
    (async () => {
      const { data, error } = await window.cwDb.rpc('admin_lister_recits', { p_statut: null, p_limite: 1000 });
      if (!error) setRecitsReels(Array.isArray(data) ? data : []);
    })();
  }, [reel]);
  
  const alertInstitutions = DB.institutions.filter(i => i.rating === 'inadequate' || i.rating === 'requires_improvement');
  const allReports = DB.institutions.reduce((a, i) => a + i.reports, 0);
  const allVerified = DB.institutions.reduce((a, i) => a + i.verified, 0);
  const allContested = DB.institutions.reduce((a, i) => a + i.contested, 0);

  // Données par période
  const periodConfig = {
    week: {

        </Card>

        {/* Services les plus concernés */}

          <h3 className="font-medium mb-4 flex items-center gap-2">

          )}
        </Card>
        
        {/* Par canton */}
        <Card className="p-4">
          <h3 className="font-medium mb-4 flex items-center gap-2">

            Signalements reçus par canton
          </h3>
          <div className="space-y-2">
            {DB.cantons.map(c => {
              const cantInst = DB.institutions.filter(i => i.canton === c);
              const cantReports = cantInst.reduce((a, i) => a + i.reports, 0);
              const pct = Math.min(100, Math.round(cantReports / Math.max(reel ? totalReports : allReports, 1) * 100));
              return (
                <div key={c}>
                  <div className="flex items-center justify-between mb-1">
                    <div>
                      <span className="text-sm font-medium">{DB.cantonNames[c]}</span>
                      <span className="text-sm text-gray-500 ml-2">({cantInst.length} établ.)</span>
                    </div>
                    <span className="font-medium text-teal-600">{cantReports}</span>
                  </div>
                  <div className="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-teal-500 rounded-full" style={{ width: `${pct}%` }} />
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      </div>

      {/* Répartition par note */}
      <Card className="p-4">
        <h3 className="font-medium mb-4">Établissements par niveau</h3>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
          {Object.entries(DB.ratings).map(([key, r]) => {
            const count = DB.institutions.filter(i => i.rating === key).length;

                <p className="text-sm text-gray-600">{r.label}</p>
                <p className="text-sm text-gray-600">{pct}%</p>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

function AdminOpenData() {
  const { DB } = useApp();
  
  const downloadDataset = (type) => {
    let data, filename;
    if (type === 'full') {
      data = {
        metadata: { source: 'CareWatch™ Admin Export', date: new Date().toISOString(), version: '1.0' },
        institutions: DB.institutions,
        services: DB.services,
        cantons: DB.cantons.map(c => ({ code: c, name: DB.cantonNames[c] })),
        ratings: DB.ratings
      };
      filename = 'carewatch_export_complet.json';
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="p-4 md:p-8">
      <h2 className="text-xl font-semibold mb-2">Gestion Open Data & API</h2>
      <p className="text-gray-600 mb-6">Export et gestion des données publiques</p>

      <div className="grid md:grid-cols-2 gap-6">
        <Card className="p-6">
          <h3 className="font-medium mb-4">Export complet</h3>
          <p className="text-sm text-gray-600 mb-4">Téléchargez l'ensemble des données de l'observatoire pour archivage ou analyse.</p>
          <Button onClick={() => downloadDataset('full')} icon={FileText}>Exporter tout (JSON)</Button>
        </Card>

        <Card className="p-6">
          <h3 className="font-medium mb-4">Statistiques API</h3>
          <div className="space-y-2 text-sm">
            <div className="flex justify-between"><span className="text-gray-500">Requêtes ce mois</span><span className="font-medium">1,247</span></div>
            <div className="flex justify-between"><span className="text-gray-500">Utilisateurs API</span><span className="font-medium">23</span></div>
            <div className="flex justify-between"><span className="text-gray-500">Téléchargements datasets</span><span className="font-medium">89</span></div>
          </div>
        </Card>
      </div>
    </div>
  );
}

function AdminReports() {
  const { reports, setReports, DB, showDemo } = useApp();
  const [statusFilter, setStatusFilter] = useState('');
  const [selectedReport, setSelectedReport] = useState(null);

  // Données de démonstration pour l'admin (simulant des signalements d'autres utilisateurs)
  const demoReports = [
    { id: 'd1', code: 'CW7K9M2P', date: '28 jan 2026', institution: 'ge-hug-cluse', service: 'Urgences adultes', incidentType: 'Propos discriminatoires', status: 'En modération', canton: 'GE', description: 'Remarques déplacées de la part du personnel d\'accueil.' },
    { id: 'd2', code: 'CW3N8L5Q', date: '27 jan 2026', institution: 'vd-riviera', service: 'Accueil / Réception / Admission', incidentType: 'Temps d\'attente excessif', status: 'Vérifié', canton: 'VD', description: 'Attente de 4h sans explication alors que d\'autres patients passaient avant.' },
    { id: 'd3', code: 'CW9P2K7R', date: '26 jan 2026', institution: 'vd-chuv', service: 'Médecine interne', incidentType: 'Non-écoute ou minimisation des symptômes', status: 'Contesté', canton: 'VD', description: 'Le médecin n\'a pas pris mes symptômes au sérieux.' },
    { id: 'd4', code: 'CW5M1N8S', date: '25 jan 2026', institution: 'vs-sion', service: 'Chirurgie générale', incidentType: 'Attitude condescendante', status: 'Vérifié', canton: 'VS', description: 'Ton condescendant et remarques sur mes origines.' },
    { id: 'd5', code: 'CW2L6P3T', date: '24 jan 2026', institution: 'ge-hug-belle', service: 'Psychiatrie adulte', incidentType: 'Stéréotypes ou préjugés', status: 'En modération', canton: 'GE', description: 'Préjugés sur mon état mental liés à ma culture.' },
  ];

  const allReports = [...(showDemo ? demoReports : []), ...reports];
  const filteredReports = statusFilter ? allReports.filter(r => r.status === statusFilter) : allReports;

  const getInstitutionName = (id) => {
    const inst = DB.institutions.find(i => i.id === id);
    return inst ? inst.name : id;
  };

  const handleStatusChange = (reportId, newStatus) => {
    // Pour les rapports de démo, on ne peut pas les modifier
    if (reportId.toString().startsWith('d')) return;
    setReports(reports.map(r => r.id === reportId ? { ...r, status: newStatus } : r));
  };

  return (
    <div className="p-4 md:p-8">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-xl font-semibold">Signalements</h2>
        <Select value={statusFilter} onChange={setStatusFilter} options={[{ value: 'En modération', label: 'En modération' }, { value: 'Vérifié', label: 'Vérifié' }, { value: 'Contesté', label: 'Contesté' }]} placeholder="Tous les statuts" className="min-w-[12rem] flex-shrink-0" />
      </div>
      
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
        <Stat icon={ClipboardList} value={allReports.length} label="Signalements reçus" color="teal" />
        <Stat icon={Clock} value={allReports.filter(r => r.status === 'En modération').length} label="En attente de modération" color="amber" />
        <Stat icon={CheckCircle} value={allReports.filter(r => r.status === 'Vérifié').length} label="Publiés après modération" color="emerald" />
        <Stat icon={AlertTriangle} value={allReports.filter(r => r.status === 'Contesté').length} label="Contestés par l'établissement" color="rose" />
      </div>

      <Card className="overflow-hidden">
        <div className="overflow-x-auto">
          <table className="cw-tableau w-full">
            <thead className="bg-gray-50">
              <tr>
                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500">Code</th>
                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500">Date</th>
                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500">Établissement</th>
                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500">Type</th>
                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500">Statut</th>
                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500">Actions</th>
              </tr>
            </thead>
            <tbody className="divide-y">
              {filteredReports.length === 0 ? (
                <tr><td colSpan={6} className="px-4 py-8 text-center text-gray-500">Aucun signalement</td></tr>
              ) : filteredReports.map(r => (
                <tr key={r.id} className="hover:bg-gray-50">
                  <td data-label="Code" className="px-4 py-3 font-mono text-sm text-teal-600">{r.code}</td>
                  <td data-label="Date" className="px-4 py-3 text-sm">{r.date}</td>
                  <td data-label="Établissement" className="px-4 py-3 text-sm">{getInstitutionName(r.institution)}</td>
                  <td data-label="Type" className="px-4 py-3 text-sm">{r.incidentType}</td>
                  <td data-label="Statut" className="px-4 py-3">
                    <span className={`px-2 py-1 rounded text-xs ${r.status === 'Vérifié' ? 'bg-emerald-100 text-emerald-700' : r.status === 'Contesté' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>{r.status}</span>
                  </td>
                  <td data-label="Actions" className="px-4 py-3">
                    <div className="flex gap-1">
                      <button onClick={() => setSelectedReport(r)} className="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded"><Eye className="w-4 h-4" /></button>
                      {r.status === 'En modération' && (
                        <>
                          <button onClick={() => handleStatusChange(r.id, 'Vérifié')} className="p-1.5 text-gray-400 hover:text-emerald-600 hover:bg-emerald-50 rounded"><Check className="w-4 h-4" /></button>
                          <button onClick={() => handleStatusChange(r.id, 'Rejeté')} className="p-1.5 text-gray-400 hover:text-rose-600 hover:bg-rose-50 rounded"><X className="w-4 h-4" /></button>
                        </>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Modal détail */}
      <Modal isOpen={!!selectedReport} onClose={() => setSelectedReport(null)} title="Détail du signalement" size="lg">
        {selectedReport && (
          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <span className="font-mono text-teal-600 text-lg">{selectedReport.code}</span>
              <span className={`px-3 py-1 rounded-full text-sm ${selectedReport.status === 'Vérifié' ? 'bg-emerald-100 text-emerald-700' : selectedReport.status === 'Contesté' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>{selectedReport.status}</span>
            </div>
            <div className="grid grid-cols-2 gap-4">
              <div className="bg-gray-50 rounded-xl p-3">
                <p className="text-sm text-gray-600">Type d'incident</p>
                <p className="font-medium">{selectedReport.incidentType}</p>
              </div>
              <div className="bg-gray-50 rounded-xl p-3">
                <p className="text-sm text-gray-600">Date</p>
                <p className="font-medium">{selectedReport.date}</p>
              </div>
              <div className="bg-gray-50 rounded-xl p-3">
                <p className="text-sm text-gray-600">Établissement</p>
                <p className="font-medium">{getInstitutionName(selectedReport.institution)}</p>
              </div>
              <div className="bg-gray-50 rounded-xl p-3">
                <p className="text-sm text-gray-600">Service</p>
                <p className="font-medium">{selectedReport.service}</p>
              </div>
            </div>
            {selectedReport.description && (
              <div className="bg-gray-50 rounded-xl p-4">
                <p className="text-sm text-gray-600 mb-1">Description</p>
                <p className="text-gray-700">{selectedReport.description}</p>
              </div>
            )}
            {selectedReport.grounds && selectedReport.grounds.length > 0 && (
              <div className="bg-gray-50 rounded-xl p-4">
                <p className="text-sm text-gray-600 mb-2">Motifs perçus{selectedReport.grounds.length >= 2 ? ' (croisés)' : ''}</p>
                <div className="flex flex-wrap gap-1.5">
                  {selectedReport.grounds.map(gId => (
                    <span key={gId} className="inline-flex items-center px-2.5 py-1 bg-teal-100 text-teal-800 rounded-full text-xs font-medium">{gId}</span>
                  ))}
                </div>
              </div>
            )}
            <Button variant="secondary" onClick={() => setSelectedReport(null)} className="w-full">Fermer</Button>
          </div>
        )}
      </Modal>
    </div>
  );
}

              </tr>

        </table>
        </div>
      </Card>
    </div>
  );
}

// Pages statiques
function AboutPage() {
  const { setView } = useApp();
  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto">
      <Button variant="ghost" onClick={() => setView('landing')} icon={ChevronLeft} className="mb-4">Retour</Button>
      <h2 className="text-2xl font-bold mb-3">À propos de CareWatch™</h2>
      <p className="text-sm text-gray-500 mb-5 flex items-center gap-1.5"><Lock className="w-3.5 h-3.5 text-teal-600" /> Indépendant, anonyme, gratuit. CareWatch™ n'est affilié à aucun établissement de santé ni assureur.</p>

      <div className="space-y-6">

        {/* Qui sommes-nous — en premier */}
        <Card className="p-6">
          <h3 className="text-lg font-semibold mb-4 flex items-center gap-2"><Users className="w-5 h-5 text-indigo-600" /> Qui sommes-nous</h3>
          <p className="text-gray-600 mb-4">CareWatch™ est l'Observatoire Participatif de la Qualité des Soins en Suisse romande, porté par un consortium d'organisations engagées pour l'équité dans le système de santé.</p>
          <p className="text-gray-600 mb-4">La plateforme couvre l'ensemble de la Suisse romande. Les ressources détaillées (contacts, guides juridiques cantonaux, accès aux soins spécialisés) sont actuellement disponibles pour les <strong>cantons de Genève et Vaud</strong>, et seront étendues progressivement aux autres cantons.</p>
          <div className="space-y-3">
            {[
              { name: 'Convivens Lab', org: 'HES-SO / HEG-Genève', desc: 'Coordination technique et scientifique', color: 'teal' },
              { name: 'Unisanté', org: 'Centre universitaire de médecine générale et santé publique, Lausanne', desc: 'Partenaire institutionnel', color: 'indigo' },
              { name: 'HUG', org: 'Hôpitaux universitaires de Genève', desc: 'Partenaire institutionnel', color: 'amber' },
              { name: 'APSR-GE', desc: 'Réseau de professionnel·le·s de santé racisé·e·s, pair-aidance', color: 'indigo' },
              { name: 'Association Suisse de la Drépanocytose', org: 'Suisse Drépano', desc: 'Expertise patient·e et advocacy pour les maladies rares', color: 'amber' },
              { name: 'KimboCare / Resilia', desc: 'Navigation santé — aide les patient·e·s à s\'orienter dans le système suisse', color: 'teal' },
            ].map(m => (
              <div key={m.name} className="flex items-start gap-3 p-3 rounded-lg bg-gray-50">
                <div className={`w-8 h-8 rounded-lg bg-${m.color}-100 flex items-center justify-center flex-shrink-0 mt-0.5`}>
                  <Building className={`w-4 h-4 text-${m.color}-700`} />
                </div>
                <div>
                  <p className="font-semibold text-gray-900">{m.name} {m.org && <span className="font-normal text-gray-500">({m.org})</span>}</p>
                  <p className="text-sm text-gray-600">{m.desc}</p>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-4 pt-3 border-t border-gray-200">
            <button onClick={() => setView('partners')} className="text-sm text-teal-600 hover:text-teal-700 font-medium flex items-center gap-1">
              Voir tous les partenaires et organisations ressources <ChevronRight className="w-4 h-4" />
            </button>
          </div>
        </Card>

        <Card className="p-6 bg-gray-50">
          <p className="text-gray-700 font-medium italic text-center text-lg">« Documenter. Valoriser. Améliorer. Contribuons à des soins plus justes. »</p>
        </Card>

        {/* Notre mission */}
        <Card className="p-6 bg-teal-50 border-teal-200">
          <h3 className="text-lg font-semibold mb-4 text-teal-900 flex items-center gap-2"><ShieldCheck className="w-5 h-5" /> Notre mission</h3>
          <p className="text-3xl font-extrabold text-teal-800 mb-4 leading-tight">
            Rendre visible l'invisible.
          </p>
          <p className="text-gray-900 text-xl leading-relaxed mb-5">
            En permettant à chaque personne de partager son expérience de soins et de témoigner — pour améliorer concrètement les soins. Contribuons à des soins plus justes.
          </p>
          <div className="p-4 rounded-xl bg-white/80 border border-teal-200 mb-5">
            <p className="text-lg text-teal-800 font-medium leading-relaxed">
              CareWatch™ recueille ces expériences pour les transformer en indicateurs publics d'amélioration — en particulier pour les personnes avec un parcours migratoire, sans-papiers ou en situation de précarité.
            </p>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            {[
              { verb: 'Documenter', desc: 'Recueillir les expériences de soins, positives et négatives, de manière anonyme et structurée.' },
              { verb: 'Valoriser', desc: 'Identifier et reconnaître les établissements et les équipes qui offrent des soins équitables.' },
              { verb: 'Améliorer', desc: 'Produire des indicateurs publics qui permettent aux établissements de progresser et aux autorités d\'agir.' },
            ].map(m => (
              <div key={m.verb} className="p-4 bg-white/70 rounded-xl">
                <p className="text-teal-700 font-bold text-lg mb-1">{m.verb}</p>
                <p className="text-sm text-gray-600">{m.desc}</p>
              </div>
            ))}
          </div>
        </Card>

        {/* Le constat */}
        <Card className="p-6">
          <h3 className="text-lg font-semibold mb-3">Le constat</h3>
          <p className="text-gray-600 mb-3">Comme le souligne l'OBSAN (Observatoire suisse de la santé) : « Il manque des données qui documentent l'équité dans la qualité des soins en Suisse. »</p>
          <p className="text-gray-600 mb-3">Chaque année, des milliers de personnes vivent des inégalités dans l'accès ou la qualité des soins. Ces expériences restent largement non documentées. Il n'existe aucun dispositif centralisé pour les recueillir. CareWatch™ crée cette mémoire collective.</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
            {[
              { label: 'Participatif', desc: 'Les usager·ère·s et professionnel·le·s documentent les réalités du terrain' },
              { label: 'Rigoureux', desc: 'Modération, vérification, droit de réponse' },
              { label: 'Transparent', desc: 'Données ouvertes, méthodologie publique' },
              { label: 'Constructif', desc: 'L\'objectif est d\'aider les établissements à progresser vers l\'excellence' },
            ].map(p => (
              <div key={p.label} className="flex items-start gap-2 p-3 rounded-lg bg-gray-50">
                <Check className="w-4 h-4 text-teal-500 mt-0.5 flex-shrink-0" />
                <div>
                  <p className="font-semibold text-gray-900">{p.label}</p>
                  <p className="text-sm text-gray-600">{p.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </Card>

        {/* Que deviennent les données */}
        <Card className="p-6 bg-indigo-50 border-indigo-200">
          <h3 className="text-lg font-semibold mb-4 text-indigo-900 flex items-center gap-2"><BarChart3 className="w-5 h-5" /> Que deviennent les données ?</h3>
          <p className="text-gray-700 mb-4">Chaque signalement anonyme contribue à quatre usages concrets :</p>
          <div className="space-y-4">
            {[
              { icon: Eye, color: 'teal', title: 'Créer une mémoire collective des expériences de soins', desc: 'Chaque signalement est anonymisé, horodaté et rattaché à un établissement. Les expériences isolées deviennent des données structurées.' },
              { icon: BarChart3, color: 'indigo', title: 'Produire des indicateurs d\'équité publics', desc: 'Les données agrégées permettent de calculer des scores par établissement, par canton, par type de discrimination. En open data, accessibles à toutes et tous.' },
              { icon: TrendingUp, color: 'amber', title: 'Outiller le plaidoyer', desc: 'Les associations partenaires s\'appuient sur des chiffres concrets pour dialoguer avec les politiques et les institutions.' },
              { icon: Building, color: 'teal', title: 'Accompagner les établissements', desc: 'Les établissements accèdent à leurs données, peuvent répondre à un signalement sous 14 jours, et montrent les améliorations mises en place. L\'objectif : que les scores progressent.' },
            ].map((item, i) => (
