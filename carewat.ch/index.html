function TableauDeBord({ recits, stats, dateFr, ouvrir }) {
  const { DB } = useApp();
  if (!recits) return <Card className="p-4 mb-4"><p className="text-sm text-gray-500">Chargement du tableau de bord…</p></Card>;
  const n = (f) => recits.filter(f).length;
  const aRelire = recits.filter(r => !['verifie', 'publie', 'rejete', 'retire'].includes(r.statut));
  const parCanton = {}; recits.filter(r => r.statut !== 'retire' && r.statut !== 'rejete').forEach(r => { const c = r.canton || '—'; parCanton[c] = (parCanton[c] || 0) + 1; });
  const parEtab = {}; recits.filter(r => r.statut !== 'retire' && r.statut !== 'rejete').forEach(r => { const c = r.etablissement_nom || '—'; parEtab[c] = (parEtab[c] || 0) + 1; });
  const topEtab = Object.entries(parEtab).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const semaine = Date.now() - 7 * 86400000;
  const tuile = (l, v, cls) => <div className={`text-center p-4 rounded-xl border ${cls}`}><p className="text-2xl font-extrabold">{v}</p><p className="text-xs text-gray-600">{l}</p></div>;
  return (
    <>
      <Card className="p-4 mb-4">
        <h2 className="font-semibold mb-3">Vue d’ensemble</h2>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
          {tuile('À relire', aRelire.length, aRelire.length ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-gray-50 border-gray-200 text-gray-700')}
          {tuile('Vérifiés', n(r => r.statut === 'verifie' || r.statut === 'publie'), 'bg-emerald-50 border-emerald-200 text-emerald-800')}
          {tuile('Reçus cette semaine', n(r => r.cree_le && new Date(r.cree_le).getTime() > semaine), 'bg-teal-50 border-teal-100 text-teal-800')}
          {tuile('Rejetés · retirés', n(r => r.statut === 'rejete') + ' · ' + n(r => r.statut === 'retire'), 'bg-gray-50 border-gray-200 text-gray-700')}
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
          <div>
            <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Par canton</p>
            {Object.entries(parCanton).sort((a, b) => b[1] - a[1]).map(([c, v]) => <p key={c} className="flex justify-between border-b border-gray-100 py-1"><span>{DB.cantonNames[c] || c}</span><span className="font-medium">{v}</span></p>)}
            {Object.keys(parCanton).length === 0 && <p className="text-gray-500">Aucun témoignage.</p>}
          </div>
          <div>
            <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Établissements les plus cités</p>
            {topEtab.map(([e, v]) => <p key={e} className="flex justify-between border-b border-gray-100 py-1 gap-2"><span className="truncate">{e}</span><span className="font-medium flex-shrink-0">{v}</span></p>)}
            {topEtab.length === 0 && <p className="text-gray-500">Aucun témoignage.</p>}
          </div>
        </div>
        {stats && <p className="text-xs text-gray-500 mt-3">Chiffres publics affichés sur le site : {stats.recus} reçus · {stats.verifies} vérifiés · {stats.positifs} retours positifs · {stats.etablissements} établissements concernés.</p>}
      </Card>
      <Card className="p-4 mb-4">
        <h2 className="font-semibold mb-3">Derniers témoignages reçus</h2>
        {recits.length === 0 ? <p className="text-sm text-gray-500">Aucun témoignage pour l’instant.</p> : (
          <div className="space-y-1">
            {recits.slice(0, 8).map(r => (
              <button key={r.numero} onClick={() => ouvrir(r.numero)} className="w-full flex items-center justify-between gap-2 text-left text-sm p-2 rounded-lg hover:bg-gray-50 border-b border-gray-100">
                <span className="font-mono text-teal-700">{r.numero}</span>
                <span className="flex-1 truncate text-gray-700">{r.type === 'positif' ? 'Expérience positive' : (r.type_incident || 'Signalement')} · {r.etablissement_nom || '—'}</span>
                <span className="text-xs text-gray-500 flex-shrink-0">{dateFr(r.cree_le)}</span>
                <span className={`px-2 py-0.5 rounded-full text-xs font-medium flex-shrink-0 ${(STATUTS_MODERATION[r.statut] || { cls: 'bg-gray-100 text-gray-600' }).cls}`}>{(STATUTS_MODERATION[r.statut] || { label: r.statut }).label}</span>
              </button>
            ))}
          </div>
        )}
      </Card>
    </>
  );
}

function AdminReferentiels({ signaler }) {
  const [table, setTable] = useState('etablissements');
  const [donnees, setDonnees] = useState(null);
  const [edition, setEdition] = useState(null); // objet en cours d'édition, ou null
  const [filtre, setFiltre] = useState('');
  const [busy, setBusy] = useState(false);
  const def = REF_TABLES[table];

  const charger = async () => {
    setBusy(true);
    const { data, error } = await window.cwDb.rpc('admin_ref_lire');
    setBusy(false);
    if (error) { signaler('Référentiels indisponibles : ' + (error.message || '')); return; }
    setDonnees(data);
  };
  useEffect(() => { charger(); }, []);

  const nouveau = () => { const o = {}; def.champs.forEach(c => { if (c.type === 'bool') o[c.k] = c.defaut !== false; if (c.type === 'liste') o[c.k] = []; }); setEdition({ __neuf: true, ...o }); };
  const enregistrer = async () => {
    const manque = def.champs.filter(c => c.requis && (edition[c.k] == null || edition[c.k] === '' || (Array.isArray(edition[c.k]) && edition[c.k].length === 0)));
    if (manque.length) { signaler('Champs requis : ' + manque.map(c => c.l.split(' (')[0]).join(', ')); return; }
    setBusy(true);
    const p = { ...edition }; delete p.__neuf;
    const { data, error } = await window.cwDb.rpc('admin_ref_ecrire', { p_table: table, p_op: 'enregistrer', p });
    setBusy(false);
    if (error || !data || !data.ok) { signaler('Enregistrement refusé : ' + ((error && error.message) || '')); return; }
    signaler('Enregistré.'); setEdition(null); charger();
  };
  const supprimer = async (ligne) => {
    if (!window.confirm('Supprimer définitivement cette ligne ? Pour un établissement, les services propres associés disparaissent aussi.')) return;
    setBusy(true);
    const { data, error } = await window.cwDb.rpc('admin_ref_ecrire', { p_table: table, p_op: 'supprimer', p: { id: String(ligne[def.cle]) } });
    setBusy(false);
    if (error || !data || !data.ok) { signaler('Suppression refusée : ' + ((error && error.message) || '')); return; }
    signaler('Supprimé.'); charger();
  };
  const afficher = (v) => Array.isArray(v) ? v.length + ' élément' + (v.length > 1 ? 's' : '') : typeof v === 'boolean' ? (v ? 'oui' : 'non') : (v == null ? '—' : String(v));
  const lignes = ((donnees && donnees[table]) || []).filter(l => !filtre || JSON.stringify(l).toLowerCase().includes(filtre.toLowerCase()));

  return (
    <Card className="p-4 mb-4">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h2 className="font-semibold">Référentiels</h2>
        <Button size="sm" variant="secondary" onClick={charger} disabled={busy}>Actualiser</Button>
      </div>
      <div className="flex flex-wrap gap-1.5 mb-3">
        {Object.entries(REF_TABLES).map(([k, d]) => (
          <button key={k} onClick={() => { setTable(k); setEdition(null); setFiltre(''); }} className={`px-2.5 py-1 rounded-full text-xs font-medium ${table === k ? 'bg-teal-600 text-white' : 'bg-gray-100 text-gray-700'}`}>{d.titre}{donnees && donnees[k] ? ' · ' + donnees[k].length : ''}</button>
        ))}
      </div>
      <p className="text-xs text-gray-500 mb-3">Chaque modification est visible sur le site au prochain chargement de page. Les lignes masquées (« Visible » désactivé) restent en base.</p>

      {edition ? (
        <div className="border border-teal-200 rounded-xl p-4 bg-teal-50 space-y-3">
          <p className="font-medium text-sm">{edition.__neuf ? 'Nouvelle ligne' : 'Modifier'} · {def.titre}</p>
          {def.champs.map(c => {
            const v = edition[c.k];
            if (c.immuable && !edition.__neuf) return <p key={c.k} className="text-sm text-gray-600">{c.l.split(' (')[0]} : <span className="font-mono">{v}</span></p>;
            if (c.type === 'bool') return <CwSwitch key={c.k} id={'ref-' + c.k} checked={!!v} onChange={x => setEdition({ ...edition, [c.k]: x })} titre={c.l} />;
            if (c.type === 'select') return <Select key={c.k} label={c.l} value={v || ''} onChange={x => setEdition({ ...edition, [c.k]: x })} options={c.options} placeholder="Choisir…" required={c.requis} />;
            if (c.type === 'liste') return <TextArea key={c.k} label={c.l} value={Array.isArray(v) ? v.join('\n') : (v || '')} onChange={x => setEdition({ ...edition, [c.k]: x.split('\n').map(t => t.trim()).filter(Boolean) })} rows={5} required={c.requis} />;
            if (c.type === 'textarea') return <TextArea key={c.k} label={c.l} value={v || ''} onChange={x => setEdition({ ...edition, [c.k]: x })} rows={3} />;
            return <Input key={c.k} label={c.l} type={c.type === 'number' ? 'number' : 'text'} value={v == null ? '' : String(v)} onChange={x => setEdition({ ...edition, [c.k]: c.type === 'number' ? (x === '' ? null : Number(x)) : x })} required={c.requis} />;
          })}
          <div className="flex gap-2">
            <Button onClick={enregistrer} disabled={busy} icon={Check}>Enregistrer</Button>
            <Button variant="secondary" onClick={() => setEdition(null)}>Annuler</Button>
          </div>
        </div>
      ) : (
        <>
          <div className="flex flex-wrap items-center gap-2 mb-2">
            <Input value={filtre} onChange={setFiltre} placeholder="Filtrer…" className="flex-1" />
            <Button size="sm" onClick={nouveau} icon={Plus}>Nouvelle ligne</Button>
          </div>
          {!donnees ? <p className="text-sm text-gray-500">Chargement…</p> : (
            <div className="overflow-x-auto" style={{ maxHeight: '60vh', overflowY: 'auto' }}>
              <table className="cw-tableau w-full text-sm">
                <thead><tr className="text-left text-xs text-gray-500 border-b">{def.colonnes.map(c => <th key={c} className="py-1 pr-3">{c}</th>)}<th></th></tr></thead>
                <tbody>
                  {lignes.map(l => (
                    <tr key={l[def.cle]} className="border-b border-gray-100">
                      {def.colonnes.map(c => <td key={c} data-label={c} className="py-1 pr-3 text-gray-800">{afficher(l[c])}</td>)}
                      <td className="py-1 whitespace-nowrap text-right">
                        <button onClick={() => setEdition({ ...l })} className="text-teal-700 underline text-xs" style={{ marginRight: 8 }}>Modifier</button>
                        <button onClick={() => supprimer(l)} className="text-rose-600 underline text-xs">Supprimer</button>
                      </td>
                    </tr>
                  ))}
                  {lignes.length === 0 && <tr><td colSpan={def.colonnes.length + 1} className="py-3 text-gray-500">Aucune ligne.</td></tr>}
                </tbody>
              </table>
            </div>
          )}
        </>
      )}
    </Card>
  );
}

function AdminAcces({ signaler, dateFr }) {
  const [acces, setAcces] = useState(null);
  const [busy, setBusy] = useState(false);
  const [nvInv, setNvInv] = useState({ attribue_a: '', email: '' });
  const [nvMod, setNvMod] = useState({ email: '', nom: '', role: 'moderateur' });
  const [dernierCode, setDernierCode] = useState('');
  const [dernierAcces, setDernierAcces] = useState(null);
  const [demandes, setDemandes] = useState(null);

  const charger = async () => {
    setBusy(true);
    const { data, error } = await window.cwDb.rpc('admin_acces_lire');
    setBusy(false);
    if (error) { signaler('Accès indisponibles : ' + (error.message || '')); return; }
    setAcces(data);
    try { const r = await window.cwDb.rpc('admin_demandes_lire'); if (!r.error) setDemandes(Array.isArray(r.data) ? r.data : []); } catch (e) {}
  };
  useEffect(() => { charger(); }, []);
  const traiterDemande = async (d, decision) => {
    if (decision === 'refuser' && !window.confirm('Refuser la demande de ' + d.email + ' ?')) return;
    setBusy(true);
    const { data, error } = await window.cwDb.rpc('admin_demande_traiter', { p_id: d.id, p_decision: decision });
    setBusy(false);
    if (error || !data || !data.ok) { signaler('Refusé : ' + ((error && error.message) || (data && data.erreur) || '')); return; }
    if (decision === 'approuver') {
      let envoye = false;
      try {
        const rep = await fetch(CW_NOTIFIER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ _mode: 'invitation', email: data.email, nom: data.nom || '', code: data.code }) });
        envoye = rep.ok;
      } catch (e) {}
      setDernierCode(String(data.code || '').toUpperCase());
      signaler(envoye ? 'Code ' + String(data.code).toUpperCase() + ' envoyé à ' + data.email + '.' : 'Code ' + String(data.code).toUpperCase() + ' créé, mais le courriel n’est pas parti : transmettez-le vous-même à ' + data.email + '.');
    } else signaler('Demande refusée.');
    charger();
  };
  const ecrire = async (op, p, msgOk) => {
    setBusy(true);
    const { data, error } = await window.cwDb.rpc('admin_acces_ecrire', { p_op: op, p });
    setBusy(false);
    if (error || !data || !data.ok) { signaler('Refusé : ' + ((error && error.message) || '')); return null; }
    if (msgOk) signaler(msgOk);
    charger();
    return data;
  };

  const enAttente = (demandes || []).filter(d => d.statut === 'en_attente');
  const traitees = (demandes || []).filter(d => d.statut !== 'en_attente').slice(0, 10);
  return (
    <>
      <Card className="p-4 mb-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-semibold">Demandes d’invitation{enAttente.length ? ` (${enAttente.length} en attente)` : ''}</h2>
        </div>
        {demandes === null && <p className="text-sm text-gray-500">Chargement…</p>}
        {demandes !== null && enAttente.length === 0 && <p className="text-sm text-gray-500 mb-2">Aucune demande en attente.</p>}
        <div className="space-y-2">
          {enAttente.map(d => (
            <div key={d.id} className="border rounded-xl p-3 bg-amber-50 border-amber-100">
              <p className="text-sm"><span className="font-semibold">{d.nom || d.email}</span>{d.nom ? <span className="text-gray-600"> · {d.email}</span> : null}{d.organisation ? <span className="text-gray-600"> · {d.organisation}</span> : null}</p>
              <p className="text-xs text-gray-500 mb-1">{dateFr(d.cree_le)}</p>
              {d.message && <p className="text-sm text-gray-700 mb-2">{d.message}</p>}
              <div className="flex gap-2">
                <Button size="sm" onClick={() => traiterDemande(d, 'approuver')} disabled={busy}>Approuver et envoyer le code</Button>
                <Button size="sm" variant="secondary" onClick={() => traiterDemande(d, 'refuser')} disabled={busy}>Refuser</Button>
              </div>
            </div>
          ))}
        </div>
        {traitees.length > 0 && (
          <div className="mt-3">
            <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Dernières décisions</p>
            <div className="text-sm divide-y">
              {traitees.map(d => (
                <div key={d.id} className="py-1.5 flex flex-wrap gap-2 text-gray-700">
                  <span>{d.nom || d.email}</span>
                  <span className={d.statut === 'approuvee' ? 'text-emerald-700' : 'text-rose-700'}>{d.statut === 'approuvee' ? 'approuvée' : 'refusée'}</span>
                  {d.code && <span className="font-mono">{String(d.code).toUpperCase()}</span>}
                  <span className="text-gray-500">{d.traite_le ? dateFr(d.traite_le) : ''}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </Card>
      <Card className="p-4 mb-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-semibold">Codes d’invitation</h2>
          <Button size="sm" variant="secondary" onClick={charger} disabled={busy}>Actualiser</Button>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-2">
          <Input label="Attribué à" value={nvInv.attribue_a} onChange={v => setNvInv({ ...nvInv, attribue_a: v })} placeholder="Prénom Nom ou organisation" />
          <Input label="E-mail (facultatif)" value={nvInv.email} onChange={v => setNvInv({ ...nvInv, email: v })} placeholder="prenom@exemple.ch" />
          <div className="flex items-end"><Button onClick={async () => { const r = await ecrire('invitation_creer', nvInv); if (r) { setDernierCode(r.code.toUpperCase()); setNvInv({ attribue_a: '', email: '' }); } }} disabled={busy || !nvInv.attribue_a} className="w-full" icon={Plus}>Créer un code</Button></div>
        </div>
        {dernierCode && <p className="text-sm text-teal-800 mb-3">Nouveau code : <span className="font-mono font-bold">{dernierCode}</span> — à transmettre avec l’adresse du site.</p>}
        {acces && (
          <div className="overflow-x-auto" style={{ maxHeight: '40vh', overflowY: 'auto' }}>
            <table className="cw-tableau w-full text-sm">
              <thead><tr className="text-left text-xs text-gray-500 border-b"><th className="py-1 pr-3">Code</th><th className="py-1 pr-3">Attribué à</th><th className="py-1 pr-3">E-mail</th><th className="py-1 pr-3">Date</th><th className="py-1 pr-3">Accord signé</th><th className="py-1 pr-3">Actif</th></tr></thead>
              <tbody>{acces.invitations.map(i => (
                <tr key={i.code} className="border-b border-gray-100">
                  <td data-label="Code" className="py-1 pr-3 font-mono">{i.code.toUpperCase()}</td><td data-label="Attribué à" className="py-1 pr-3">{i.attribue_a || '—'}</td><td data-label="E-mail" className="py-1 pr-3">{i.email || '—'}</td>
                  <td data-label="Date" className="py-1 pr-3">{i.attribue_le || '—'}</td><td data-label="Accord signé" className="py-1 pr-3">{i.nda_signe_le ? dateFr(i.nda_signe_le) : 'non'}</td>
                  <td data-label="Actif" className="py-1 pr-3"><button onClick={() => ecrire('invitation_actif', { code: i.code, actif: !i.actif }, i.actif ? 'Code désactivé.' : 'Code réactivé.')} className={`text-xs underline ${i.actif ? 'text-emerald-700' : 'text-rose-600'}`}>{i.actif ? 'actif · désactiver' : 'inactif · réactiver'}</button></td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        )}
      </Card>

      <Card className="p-4 mb-4">
        <h2 className="font-semibold mb-1">Comptes de modération</h2>
        <p className="text-xs text-gray-500 mb-3">Autorisez une adresse : un code d’accès à usage unique vous est remis pour la personne. Avec son e-mail et ce code, elle reçoit un lien de connexion, son compte est créé et inscrit automatiquement, puis elle choisit son mot de passe et active le second facteur.</p>
        <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 mb-3">
          <Input label="E-mail" value={nvMod.email} onChange={v => setNvMod({ ...nvMod, email: v })} placeholder="prenom@exemple.ch" />
          <Input label="Nom" value={nvMod.nom} onChange={v => setNvMod({ ...nvMod, nom: v })} placeholder="Prénom Nom" />
          <Select label="Rôle" value={nvMod.role} onChange={v => setNvMod({ ...nvMod, role: v })} options={[{ value: 'moderateur', label: 'Modérateur·rice' }, { value: 'admin', label: 'Administrateur·rice' }]} />
          <div className="flex items-end"><Button onClick={async () => {
            setBusy(true);
            const { data: r, error } = await window.cwDb.rpc('admin_autoriser_moderateur', { p_email: nvMod.email, p_nom: nvMod.nom, p_role: nvMod.role });
            setBusy(false);
            if (error || !r || !r.ok) { signaler('Refusé : ' + ((error && error.message) || '')); return; }
            if (r.etat === 'inscrit') { signaler('Compte existant : inscrit immédiatement.'); setDernierAcces(null); }
            else {
              let envoye = false;
              try {
                const rep = await fetch(CW_NOTIFIER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                  body: JSON.stringify({ _mode: 'acces', email: nvMod.email.trim(), nom: nvMod.nom.trim(), code: r.code, role: nvMod.role }) });
                const j = await rep.json(); envoye = !!(j && j.success === 'true');
              } catch (e) { envoye = false; }
              setDernierAcces({ email: nvMod.email, code: r.code, envoye });
            }
            setNvMod({ email: '', nom: '', role: 'moderateur' }); charger();
          }} disabled={busy || !nvMod.email || !nvMod.nom} className="w-full" icon={Plus}>Autoriser</Button></div>
        </div>
        {dernierAcces && (
          <div className="p-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-900 mb-3">
            <p><strong>{dernierAcces.envoye ? 'Code d’accès envoyé par e-mail à ' + dernierAcces.email : 'Le courriel n’a pas pu partir : transmettez ce code à ' + dernierAcces.email}</strong> · <span className="font-mono text-lg">{dernierAcces.code}</span></p>
            <p className="text-xs mt-1">Valable 14 jours, usage unique. La personne saisit son e-mail et ce code dans la fenêtre Administration, puis choisit son mot de passe.</p>
          </div>
        )}
        {acces && (
          <>
            <div className="overflow-x-auto">
            <table className="cw-tableau w-full text-sm mb-3">
              <thead><tr className="text-left text-xs text-gray-500 border-b"><th className="py-1 pr-3">Nom</th><th className="py-1 pr-3">E-mail</th><th className="py-1 pr-3">Rôle</th><th className="py-1 pr-3">Dernière connexion</th><th></th></tr></thead>
              <tbody>{acces.moderateurs.map(m => (
                <tr key={m.user_id} className="border-b border-gray-100">
                  <td data-label="Nom" className="py-1 pr-3">{m.nom || '—'}</td><td data-label="E-mail" className="py-1 pr-3">{m.email}</td>
                  <td data-label="Rôle" className="py-1 pr-3"><select value={m.role} onChange={e => ecrire('role', { user_id: m.user_id, role: e.target.value }, 'Rôle modifié.')} className="border rounded px-1 py-0.5 text-xs"><option value="moderateur">modérateur·rice</option><option value="admin">admin</option></select></td>
                  <td data-label="Dernière connexion" className="py-1 pr-3">{m.derniere_connexion ? dateFr(m.derniere_connexion) : 'jamais'}</td>
                  <td className="py-1 text-right"><button onClick={() => { if (window.confirm('Retirer ' + (m.nom || m.email) + ' ? Ses droits et son compte de connexion sont supprimés.')) ecrire('retirer_moderateur', { user_id: m.user_id }, 'Compte retiré.'); }} className="text-rose-600 underline text-xs">Retirer</button></td>
                </tr>
              ))}</tbody>
            </table>
            </div>
            {Array.isArray(acces.orphelins) && acces.orphelins.length > 0 && (
              <div className="text-sm mb-3">
                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Comptes de connexion sans droits</p>
                <p className="text-xs text-gray-500 mb-1">Comptes Supabase qui ne sont plus, ou pas encore, modérateur·rice·s. À supprimer s’ils ne correspondent à personne.</p>
                {acces.orphelins.map(o => (
                  <p key={o.user_id} className="flex items-center justify-between py-1 border-b border-gray-100"><span>{o.email} · créé le {dateFr(o.cree_le)}</span><button onClick={() => { if (window.confirm('Supprimer le compte ' + o.email + ' ?')) ecrire('supprimer_compte_orphelin', { user_id: o.user_id }, 'Compte supprimé.'); }} className="text-rose-600 underline text-xs">Supprimer</button></p>
                ))}
              </div>
            )}
            {acces.autorises.length > 0 && (
              <div className="text-sm">
                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">En attente de première connexion</p>
                {acces.autorises.map(a => (
                  <p key={a.email} className="flex items-center justify-between py-1 border-b border-gray-100"><span>{a.nom || '—'} · {a.email} · {a.role}</span><button onClick={() => ecrire('retirer_autorisation', { email: a.email }, 'Autorisation retirée.')} className="text-rose-600 underline text-xs">Retirer</button></p>
                ))}
              </div>
            )}
          </>
        )}
      </Card>
    </>
  );
}

function ModerationPage({ integre }) {
  const { setView, rafraichirStats, realStats, DB, setUser, setUserType, emailModeration, otpDemande, setOtpDemande, setLoginType, setShowLogin } = useApp();
  const auth = window.cwDb.auth;
  const [etape, setEtape] = useState('chargement'); // chargement | connexion | mfa-inscription | mfa-code | pret
  const [email, setEmail] = useState(emailModeration || '');
  const [mdp, setMdp] = useState('');
  const [code, setCode] = useState('');
  const [facteur, setFacteur] = useState(null);
  const [qr, setQr] = useState(null);
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const [liste, setListe] = useState([]);
  const [filtre, setFiltre] = useState('soumis');
  const [fiche, setFiche] = useState(null);
  const [note, setNote] = useState('');
  const [utilisateur, setUtilisateur] = useState(null);
  const [profil, setProfil] = useState(null);
  const [mdp1, setMdp1] = useState('');
  const [mdp2, setMdp2] = useState('');
  const [compteOuvert, setCompteOuvert] = useState(false);
  const [ndaListe, setNdaListe] = useState(null);
  const [onglet, setOnglet] = useState('tableau'); // tableau | moderation | referentiels | acces
  useEffect(() => {
    if (etape === 'pret' && !integre && profil) {
      setUser({ reel: true, role: profil.role || 'moderateur', email: (utilisateur && utilisateur.email) || profil.email || '', name: profil.nom || (utilisateur && utilisateur.email) || 'Modération' });
      setUserType('admin');
      setView('dashboard');
    }
  }, [etape, profil]);
  const [tousRecits, setTousRecits] = useState(null);
  const chargerTout = async () => {
    const { data, error } = await window.cwDb.rpc('admin_lister_recits', { p_statut: null, p_limite: 1000 });
    if (!error) setTousRecits(Array.isArray(data) ? data : []);
  };
  useEffect(() => { if (etape === 'pret') chargerTout(); }, [etape]);
  const estAdmin = !!(profil && profil.role === 'admin');
  const [codeAcces, setCodeAcces] = useState('');
  const [modePremiere, setModePremiere] = useState(false);
  const [etatEmail, setEtatEmail] = useState(null); // compte | autorise | inconnu
  const [otpAttendu, setOtpAttendu] = useState(otpDemande || null); // 'email' (première connexion) | 'recovery' (mot de passe oublié) | null
  useEffect(() => { if (otpDemande) setOtpDemande(null); }, []);
  useEffect(() => {
    if (etape === 'connexion' && !otpAttendu && !integre) { setLoginType('admin'); setShowLogin(true); setView('landing'); }
  }, [etape, otpAttendu]);
  const [otpCode, setOtpCode] = useState('');
  const validerOtp = async () => {
    setBusy(true); setMsg('');
    const { error } = await auth.verifyOtp({ email: email.trim(), token: otpCode.trim(), type: otpAttendu });
    setBusy(false);
    if (error) { erreur(error, 'Code incorrect ou expiré. Demandez-en un nouveau.'); return; }
    if (otpAttendu === 'recovery') setRecuperation(true);
    setOtpAttendu(null); setOtpCode('');
    await verifierNiveau();
  };
  const [recuperation, setRecuperation] = useState(() => /type=recovery/.test(window.location.hash || ''));
  // Dès qu'une adresse plausible est saisie, la base dit s'il s'agit d'une première connexion
  useEffect(() => {
    const e = email.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { setEtatEmail(null); return; }
    const t = setTimeout(async () => {
      try {
        const { data } = await window.cwDb.rpc('moderateur_etat', { p_email: e });
        const etat = (data && data.etat) || 'inconnu';
        setEtatEmail(etat);
        setModePremiere(etat === 'autorise');
      } catch (ex) { setEtatEmail(null); }
    }, 500);
    return () => clearTimeout(t);
  }, [email]);
  const lienPremiereConnexion = async () => {
    if (!email.trim() || !codeAcces.trim()) { setMsg('Indiquez votre e-mail et le code d’accès remis par l’équipe.'); return; }
    setBusy(true); setMsg('');
    const { data: v, error: e0 } = await window.cwDb.rpc('moderateur_verifier_code', { p_email: email.trim(), p_code: codeAcces.trim() });
    if (e0 || !v || !v.ok) {
      setBusy(false);
      const r = v && v.raison;
      setMsg(r === 'expire' ? 'Ce code d’accès a expiré : demandez-en un nouveau à l’équipe.' : (e0 && /Trop de demandes/i.test(e0.message || '')) ? 'Trop de tentatives, réessayez dans une heure.' : 'E-mail ou code d’accès incorrect.');
      return;
    }
    const { error } = await auth.signInWithOtp({ email: email.trim(), options: { emailRedirectTo: window.location.origin + '/?m=moderation', shouldCreateUser: true } });
    setBusy(false);
    if (error) { erreur(error, 'Envoi impossible.'); return; }
    setOtpAttendu('email'); setOtpCode('');
    setMsg('Un e-mail vient de partir vers ' + email.trim() + '. Saisissez ci-dessous le code à 6 chiffres qu’il contient. Le lien du même e-mail fonctionne aussi, une seule fois.');
  };
  const chargerNda = async () => {
    const { data, error } = await window.cwDb.rpc('admin_lister_nda');
    if (error) { setMsg('Liste des accords indisponible.'); return; }
    setNdaListe(Array.isArray(data) ? data : []);
  };

  const traduire = (m) =>
    /Invalid login/i.test(m) ? 'E-mail ou mot de passe incorrect.' :
    /Accès refusé|permission denied/i.test(m) ? 'Ce compte n’est pas autorisé pour la modération, ou le second facteur n’est pas validé.' :
    /Invalid TOTP|invalid code|expired/i.test(m) ? 'Code à 6 chiffres incorrect ou expiré.' :
    /Email not confirmed/i.test(m) ? 'Compte non confirmé : cochez « Auto Confirm User » dans Supabase.' : m;
  const erreur = (e, defaut) => setMsg(e && e.message ? traduire(e.message) : defaut);

  const verifierNiveau = async () => {
    const { data: s } = await auth.getSession();
    if (!s || !s.session) { setUtilisateur(null); setEtape('connexion'); return; }
    setUtilisateur(s.session.user);
    const { data: aal } = await auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal && aal.currentLevel === 'aal2') {
      // Profil : un mot de passe jamais changé par la personne doit l'être avant tout accès
      const { data: p } = await window.cwDb.rpc('moderateur_mon_profil');
      setProfil(p || null);
      setEtape((p && !p.mdp_change_le) || recuperation ? 'mdp' : 'pret');
      return;
    }
    const { data: f } = await auth.mfa.listFactors();
    const totp = f && f.totp && f.totp.find(x => x.status === 'verified');
    if (totp) { setFacteur(totp); setEtape('mfa-code'); return; }
    // Premier accès : création du second facteur
    const { data: enr, error } = await auth.mfa.enroll({ factorType: 'totp', issuer: 'CareWatch', friendlyName: 'CareWatch modération' });
    if (error) { erreur(error, 'Impossible de préparer le second facteur.'); setEtape('connexion'); return; }
    setFacteur({ id: enr.id });
    setQr(enr.totp);
    setEtape('mfa-inscription');
  };
  useEffect(() => {
    const h = window.location.hash || '';
    if (/error_code=otp_expired|error=access_denied/.test(h)) {
      setMsg('Ce lien a expiré ou a déjà été utilisé, souvent parce que votre messagerie l’a ouvert avant vous pour le vérifier. Saisissez votre e-mail et recommencez : le code à 6 chiffres reçu par e-mail suffit, sans cliquer sur le lien.');
      try { history.replaceState(null, '', window.location.pathname + '?m=moderation'); } catch (e) {}
    }
    verifierNiveau().catch(() => setEtape('connexion'));
  }, []);

  const connecter = async () => {
    setBusy(true); setMsg('');
    const { error } = await auth.signInWithPassword({ email: email.trim(), password: mdp });
    setBusy(false);
    if (error) { erreur(error, 'Connexion impossible.'); return; }
    setMdp('');
    await verifierNiveau();
  };
  const validerCode = async () => {
    if (!facteur) return;
    setBusy(true); setMsg('');
    const { data: ch, error: e1 } = await auth.mfa.challenge({ factorId: facteur.id });
    if (e1) { setBusy(false); erreur(e1, 'Vérification impossible.'); return; }
    const { error: e2 } = await auth.mfa.verify({ factorId: facteur.id, challengeId: ch.id, code: code.trim() });
    setBusy(false);
    if (e2) { erreur(e2, 'Code incorrect.'); return; }
    setCode(''); setQr(null);
    await verifierNiveau();
  };
  const changerMdp = async () => {
    if (mdp1.length < 12) { setMsg('Le mot de passe doit compter au moins 12 caractères.'); return; }
    if (mdp1 !== mdp2) { setMsg('Les deux saisies ne correspondent pas.'); return; }
    setBusy(true); setMsg('');
    const { error } = await auth.updateUser({ password: mdp1 });
    if (error) { setBusy(false); erreur(error, 'Changement impossible.'); return; }
    await window.cwDb.rpc('moderateur_marquer_mdp_change');
    setBusy(false); setMdp1(''); setMdp2(''); setCompteOuvert(false);
    setProfil(p => ({ ...(p || {}), mdp_change_le: new Date().toISOString() }));
    setRecuperation(false);
    try { if (/type=recovery/.test(window.location.hash || '')) history.replaceState(null, '', window.location.pathname + '#moderation'); } catch (e) {}
    setMsg('Mot de passe changé.');
    setEtape('pret');
  };
  const reconfigurerMfa = async () => {
    if (!window.confirm('Reconfigurer le second facteur ? L’entrée actuelle de votre application d’authentification cessera de fonctionner et un nouveau code QR sera affiché.')) return;
    setBusy(true); setMsg('');
    const { data: f } = await auth.mfa.listFactors();
    for (const x of ((f && f.totp) || [])) { await auth.mfa.unenroll({ factorId: x.id }); }
    const { data: enr, error } = await auth.mfa.enroll({ factorType: 'totp', issuer: 'CareWatch', friendlyName: 'CareWatch modération' });
    setBusy(false);
    if (error) { erreur(error, 'Reconfiguration impossible.'); return; }
    setFacteur({ id: enr.id }); setQr(enr.totp); setEtape('mfa-inscription');
  };
  const mdpOublie = async () => {
    if (!email.trim()) { setMsg('Indiquez d’abord votre e-mail.'); return; }
    setBusy(true); setMsg('');
    const { error } = await auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin + '/?m=moderation' });
    setBusy(false);
    if (error) { erreur(error, 'Envoi impossible.'); return; }
    setOtpAttendu('recovery'); setOtpCode('');
    setMsg('Si ce compte existe, un e-mail vient de partir. Saisissez ci-dessous le code à 6 chiffres qu’il contient ; vous choisirez ensuite un nouveau mot de passe.');
  };
  const deconnecter = async () => {
    await auth.signOut();
    setListe([]); setFiche(null); setUtilisateur(null); setEtape('connexion');
  };

  const charger = async () => {
    setBusy(true); setMsg('');
    const { data, error } = await window.cwDb.rpc('admin_lister_recits', { p_statut: filtre || null, p_limite: 300 });
    setBusy(false);
    if (error) { erreur(error, 'Chargement impossible.'); return; }
    setListe(Array.isArray(data) ? data : []);
  };
  useEffect(() => { if (etape === 'pret') charger(); }, [etape, filtre]);

  const ouvrir = async (numero) => {
    setMsg('');
    const { data, error } = await window.cwDb.rpc('admin_lire_recit', { p_numero: numero });
    if (error) { erreur(error, 'Lecture impossible.'); return; }
    setFiche(data);
    setNote((data && data.note_moderation) || '');
  };
  const changer = async (statut) => {
    if (!fiche) return;
    if (statut === 'rejete' && !window.confirm('Rejeter ce témoignage ? Il ne sera plus compté dans les chiffres publics mais restera consultable ici.')) return;
    setBusy(true); setMsg('');
    const { data, error } = await window.cwDb.rpc('admin_changer_statut', { p_numero: fiche.numero, p_statut: statut, p_note: note || null });
    setBusy(false);
    if (error || !data || !data.ok) {
      setMsg(data && data.raison === 'fiche_non_autorisee'
        ? 'La personne n’a pas autorisé la publication de la fiche résumée : « Vérifié » est le statut maximal.'
        : 'Changement impossible pour l’instant.');
      return;
    }
    setMsg('Statut mis à jour : ' + ((STATUTS_MODERATION[statut] || {}).label || statut));
    await ouvrir(fiche.numero);
    await charger();
    chargerTout();
    if (rafraichirStats) rafraichirStats();
  };

  const dateFr = (d) => d ? new Date(d).toLocaleString('fr-CH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const dateJournal = (j) => { const k = Object.keys(j).find(k => !['action', 'numero', 'id'].includes(k) && j[k] && !isNaN(Date.parse(j[k]))); return k ? dateFr(j[k]) : ''; };
  const Badge = ({ s }) => { const m = STATUTS_MODERATION[s] || { label: s, cls: 'bg-gray-100 text-gray-600' }; return <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${m.cls}`}>{m.label}</span>; };
  const Oui = ({ v }) => v ? <Check className="w-3.5 h-3.5 text-emerald-600" /> : <X className="w-3.5 h-3.5 text-gray-400" />;

  const cadre = (contenu, large) => integre ? (
    <div className="p-4 md:p-8 max-w-5xl mx-auto">
      {msg && <div className="mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-800">{msg}</div>}
      {etape !== 'pret' && <p className="text-sm text-gray-600 mb-3">Votre session doit être confirmée pour cette section.</p>}
      {contenu}
    </div>
  ) : (
    <div className="min-h-screen bg-gray-50">
      <div className={`${large ? 'max-w-5xl' : 'max-w-md'} mx-auto p-4 md:p-8`}>
        <div className="flex items-center justify-between mb-6">
          <button onClick={() => setView('landing')} className="flex items-center gap-1 text-sm text-teal-700"><ChevronLeft className="w-4 h-4" /> Annuler</button>
          {utilisateur && (
            <div className="flex items-center gap-3 text-sm text-gray-600">
              <span>{utilisateur.email}</span>
              <button onClick={deconnecter} className="underline">Se déconnecter</button>
            </div>
          )}
        </div>
        <h1 className="text-2xl font-bold text-gray-900 mb-1 flex items-center gap-2"><Lock className="w-6 h-6 text-teal-600" /> Connexion à l’administration</h1>
        <p className="text-sm text-gray-600 mb-6">{etape === 'mfa-inscription' ? 'Activation du second facteur' : etape === 'mfa-code' ? 'Code de votre application d’authentification' : etape === 'mdp' ? 'Choix du mot de passe' : otpAttendu ? 'Code reçu par e-mail' : 'Vérification de la session'}</p>
        {msg && <div className="mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-800">{msg}</div>}
        {contenu}
      </div>
    </div>
  );

  if (etape === 'chargement') return cadre(<p className="text-sm text-gray-500">Vérification de la session…</p>);

  if (etape === 'connexion' && otpAttendu) return cadre(
    <Card className="p-5 space-y-4">
      <p className="text-sm text-gray-700"><strong>Code envoyé à {email.trim()}.</strong> Il est valable quelques minutes.</p>
      <Input label="Code à 6 chiffres reçu par e-mail" value={otpCode} onChange={v => setOtpCode(v.replace(/\D/g, '').slice(0, 6))} placeholder="123456" />
      <Button onClick={validerOtp} disabled={busy || otpCode.length < 6} className="w-full">Valider</Button>
      <button onClick={() => { setOtpAttendu(null); setOtpCode(''); setMsg(''); setLoginType('admin'); setShowLogin(true); setView('landing'); }} className="text-sm text-teal-700 underline w-full text-center">Revenir à la connexion</button>
    </Card>
  );

  if (etape === 'connexion') return cadre(<p className="text-sm text-gray-500">Redirection vers la connexion…</p>);

  if (etape === 'mfa-inscription') return cadre(
    <Card className="p-5 space-y-4">
      <p className="text-sm text-gray-700"><strong>Premier accès : activez le second facteur.</strong> Scannez ce code avec une application d’authentification (Aegis, FreeOTP, Google Authenticator, Microsoft Authenticator…), puis saisissez le code à 6 chiffres qu’elle affiche.</p>
      {qr && qr.qr_code && <img src={qr.qr_code} alt="Code QR à scanner" className="mx-auto bg-white p-2 rounded-xl border" style={{ width: 192, height: 192 }} />}
      {qr && qr.secret && <p className="text-xs text-gray-500 text-center">Saisie manuelle : <span className="font-mono">{qr.secret}</span></p>}
      <Input label="Code à 6 chiffres" value={code} onChange={setCode} placeholder="123456" />
      <Button onClick={validerCode} disabled={busy || code.trim().length < 6} className="w-full">Activer et se connecter</Button>
    </Card>
  );

  if (etape === 'mfa-code') return cadre(
    <Card className="p-5 space-y-4">
      <p className="text-sm text-gray-700"><strong>Étape 2 sur 2.</strong> Saisissez le code à 6 chiffres de votre application d’authentification.</p>
      <Input label="Code à 6 chiffres" value={code} onChange={setCode} placeholder="123456" />
      <Button onClick={validerCode} disabled={busy || code.trim().length < 6} className="w-full">Vérifier</Button>
    </Card>
  );

  const formulaireMdp = (titre, texte) => (
    <Card className="p-5 space-y-4">
      <p className="text-sm text-gray-700"><strong>{titre}</strong> {texte}</p>
      <Input label="Nouveau mot de passe (12 caractères au moins)" type="password" value={mdp1} onChange={setMdp1} placeholder="••••••••••••" />
      <Input label="Confirmer le nouveau mot de passe" type="password" value={mdp2} onChange={setMdp2} placeholder="••••••••••••" />
      <Button onClick={changerMdp} disabled={busy || mdp1.length < 12 || !mdp2} className="w-full">Enregistrer le nouveau mot de passe</Button>
    </Card>
  );
  if (etape === 'mdp') return cadre(recuperation ? formulaireMdp('Nouveau mot de passe.', 'Vous arrivez par le lien de réinitialisation : choisissez votre nouveau mot de passe.') : formulaireMdp('Première connexion.', 'Choisissez le mot de passe que vous seul·e connaîtrez.'));

  const carteCompte = (
    <Card className="p-4 mb-4">
      <div className="flex items-center justify-between">
        <p className="text-sm text-gray-700"><strong>Mon compte</strong>{profil && profil.nom ? ' · ' + profil.nom : ''} · mot de passe changé {profil && profil.mdp_change_le ? 'le ' + dateFr(profil.mdp_change_le) : 'jamais'}</p>
        <button onClick={() => setCompteOuvert(!compteOuvert)} className="text-sm text-teal-700 underline">{compteOuvert ? 'Fermer' : 'Gérer'}</button>
      </div>
      {compteOuvert && (
        <div className="mt-4 space-y-4">
          {formulaireMdp('Changer mon mot de passe.', 'Vous resterez connecté·e.')}
          <Button variant="secondary" onClick={reconfigurerMfa} disabled={busy} className="w-full">Reconfigurer le second facteur (nouveau code QR)</Button>
        </div>
      )}
    </Card>
  );

  const carteNda = (
    <Card className="p-4 mb-4">
      <div className="flex items-center justify-between">
        <p className="text-sm text-gray-700"><strong>Accords de confidentialité signés</strong>{ndaListe ? ' · ' + ndaListe.length : ''}</p>
        <button onClick={() => ndaListe ? setNdaListe(null) : chargerNda()} className="text-sm text-teal-700 underline">{ndaListe ? 'Masquer' : 'Afficher'}</button>
      </div>
      {ndaListe && (
        ndaListe.length === 0 ? <p className="text-sm text-gray-500 mt-3">Aucune signature enregistrée.</p> : (
          <div className="overflow-x-auto mt-3">
            <table className="cw-tableau w-full text-sm">
              <thead><tr className="text-left text-xs text-gray-500 border-b"><th className="py-1 pr-3">Signé le</th><th className="py-1 pr-3">Nom</th><th className="py-1 pr-3">Organisation</th><th className="py-1 pr-3">E-mail</th><th className="py-1 pr-3">Code</th><th className="py-1 pr-3">Version</th></tr></thead>
              <tbody>{ndaListe.map((n, i) => (
                <tr key={i} className="border-b border-gray-100"><td data-label="Signé le" className="py-1 pr-3">{dateFr(n.signe_le)}</td><td data-label="Nom" className="py-1 pr-3">{n.nom}</td><td data-label="Organisation" className="py-1 pr-3">{n.organisation || '—'}</td><td data-label="E-mail" className="py-1 pr-3">{n.email}</td><td data-label="Code" className="py-1 pr-3 font-mono">{n.code}{n.attribue_a ? ' · ' + n.attribue_a : ''}</td><td data-label="Version" className="py-1 pr-3">{n.version}</td></tr>
              ))}</tbody>
            </table>
          </div>
        )
      )}
    </Card>
  );

  const infos = !fiche ? [] : [
    ['Type', fiche.type === 'positif' ? 'Expérience positive' : 'Signalement'],
    ['Reçu le', dateFr(fiche.cree_le)],
    ['Canton', fiche.canton],
    ['Établissement', fiche.etablissement_nom],
    ['Service', fiche.service],
    ['Type d’incident', fiche.type_incident],
    ['Période', fiche.type_periode || fiche.date_incident],
    ['Rôle', fiche.role],
    ['Tranche d’âge', fiche.tranche_age],
    ['Cohérence NPA', fiche.npa_coherent],
    ['Score ressenti', fiche.dms_score != null ? fiche.dms_score + ' / ' + fiche.dms_max : null],
    ['Dernière modification', fiche.modifie_le ? dateFr(fiche.modifie_le) : null],
  ].filter(([, v]) => v);
  const autorisations = !fiche ? [] : [
    ['Fiche publique autorisée', fiche.publier_fiche],
    ['Recherche, sensibilisation, formation', fiche.usage_recherche],
    ['Lecture du texte complet hors modération', fiche.lecture_texte_complet],
    ['Recontact par e-mail accepté', fiche.accepte_recontact_email],
    ['Résultats par e-mail', fiche.recevoir_resultats],
    ['Échange avec l’équipe', fiche.recontact_echange],
    ['Participation à une étude', fiche.recontact_etude],
    ['A cherché de l’aide', fiche.a_cherche_aide],
    ['Souhaite en parler', fiche.souhaite_en_parler],
  ];

  const panneauModeration = (
    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-semibold">File de modération</h2>
          <Button size="sm" variant="secondary" onClick={charger} disabled={busy}>Actualiser</Button>
        </div>
        <div className="flex flex-wrap gap-1.5 mb-3">
          {[['soumis', 'À relire'], ['verifie', 'Vérifiés'], ['publie', 'Publiés'], ['rejete', 'Rejetés'], ['retire', 'Retirés'], ['', 'Tous']].map(([v, l]) => (
            <button key={v} onClick={() => setFiltre(v)} className={`px-2.5 py-1 rounded-full text-xs font-medium ${filtre === v ? 'bg-teal-600 text-white' : 'bg-gray-100 text-gray-700'}`}>{l}</button>
          ))}
        </div>
        {liste.length === 0 ? <p className="text-sm text-gray-500">Aucun témoignage dans cette catégorie.</p> : (
          <div className="space-y-2" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
            {liste.map(r => (
              <button key={r.numero} onClick={() => ouvrir(r.numero)} className={`w-full text-left p-3 rounded-xl border ${fiche && fiche.numero === r.numero ? 'border-teal-400 bg-teal-50' : 'border-gray-200 bg-white hover:bg-gray-50'}`}>
                <div className="flex items-center justify-between gap-2">
                  <span className="font-mono text-sm text-teal-700">{r.numero}</span>
                  <Badge s={r.statut} />
                </div>
                <p className="text-sm text-gray-800 mt-1">{r.type === 'positif' ? 'Expérience positive' : (r.type_incident || 'Signalement')}</p>
                <p className="text-xs text-gray-500">{r.etablissement_nom || 'Établissement non précisé'}{r.service ? ' · ' + r.service : ''} · {dateFr(r.cree_le)}</p>
              </button>
            ))}
          </div>
        )}
      </Card>
      <Card className="p-4">
        {!fiche ? <p className="text-sm text-gray-500">Sélectionnez un témoignage pour le lire.</p> : (
          <div className="space-y-4">
            <div className="flex items-center justify-between gap-2">
              <span className="font-mono text-lg text-teal-700">{fiche.numero}</span>
              <span className="flex items-center gap-2"><Badge s={fiche.statut} /><button onClick={() => { setFiche(null); setNote(''); }} className="p-1 rounded-lg hover:bg-gray-100 text-gray-500" title="Fermer la fiche" aria-label="Fermer la fiche"><X className="w-5 h-5" /></button></span>
            </div>
            <div className="grid grid-cols-2 gap-2 text-sm">
              {infos.map(([k, v]) => (
                <div key={k} className="bg-gray-50 rounded-lg p-2"><p className="text-xs text-gray-500">{k}</p><p className="text-gray-800">{String(v)}</p></div>
              ))}
            </div>
            {Array.isArray(fiche.motifs_percus) && fiche.motifs_percus.length > 0 && (
              <div><p className="text-xs text-gray-500 mb-1">Motifs perçus</p><div className="flex flex-wrap gap-1.5">{fiche.motifs_percus.map((m, i) => <span key={i} className="px-2 py-0.5 rounded-full text-xs bg-teal-100 text-teal-800">{String(m)}</span>)}</div></div>
            )}
            {Array.isArray(fiche.categories_positives) && fiche.categories_positives.length > 0 && (
              <div><p className="text-xs text-gray-500 mb-1">Catégories</p><div className="flex flex-wrap gap-1.5">{fiche.categories_positives.map((m, i) => <span key={i} className="px-2 py-0.5 rounded-full text-xs bg-emerald-100 text-emerald-800">{String(m)}</span>)}</div></div>
            )}
            <div className="bg-gray-50 rounded-xl p-3"><p className="text-xs text-gray-500 mb-1">Récit</p><p className="text-sm text-gray-800" style={{ whiteSpace: 'pre-wrap' }}>{fiche.description || '(effacé)'}</p></div>
            {fiche.impact && <div className="bg-gray-50 rounded-xl p-3"><p className="text-xs text-gray-500 mb-1">Impact</p><p className="text-sm text-gray-800" style={{ whiteSpace: 'pre-wrap' }}>{fiche.impact}</p></div>}
            <div className="text-xs text-gray-600 space-y-1">
              {autorisations.map(([k, v]) => <p key={k} className="flex items-center gap-1.5"><Oui v={v} /> {k}</p>)}
            </div>
            <TextArea label="Note de modération (interne, jamais publiée)" value={note} onChange={setNote} rows={3} maxLength={2000} />
            {fiche.statut !== 'retire' && (
              <div className="flex flex-wrap gap-2">
                <Button onClick={() => changer('verifie')} disabled={busy} icon={Check}>Marquer vérifié</Button>
                <Button onClick={() => changer('publie')} disabled={busy || !fiche.publier_fiche} variant="secondary">Publier la fiche</Button>
                <Button onClick={() => changer('soumis')} disabled={busy} variant="secondary">Remettre à relire</Button>
                <Button onClick={() => changer('rejete')} disabled={busy} variant="danger" icon={X}>Rejeter</Button>
              </div>
            )}
            {Array.isArray(fiche.journal) && fiche.journal.length > 0 && (
              <div><p className="text-xs text-gray-500 mb-1">Journal</p><ul className="text-xs text-gray-600 space-y-0.5">{fiche.journal.map((j, i) => <li key={i}>{dateJournal(j)} · {j.action}</li>)}</ul></div>
            )}
          </div>
        )}
      </Card>
    </div>
  );

  if (integre === 'compte') return cadre(<>{carteCompte}{estAdmin && carteNda}</>, true);
  if (integre === 'tableau') return cadre(<TableauDeBord recits={tousRecits} stats={realStats} dateFr={dateFr} ouvrir={(n) => { setView('admin-reports'); }} />, true);
  if (integre === 'referentiels') return cadre(estAdmin ? <AdminReferentiels signaler={setMsg} /> : <p className="text-sm text-gray-600">Réservé aux administrateur·rice·s.</p>, true);
  if (integre === 'acces') return cadre(estAdmin ? <><AdminAcces signaler={setMsg} dateFr={dateFr} />{carteNda}</> : <p className="text-sm text-gray-600">Réservé aux administrateur·rice·s.</p>, true);
  if (integre === 'moderation') return cadre(panneauModeration, true);
  if (integre) return cadre(<p className="text-sm text-gray-600">Section inconnue.</p>, true);

  return cadre(
    <>
    {carteCompte}
    <div className="flex flex-wrap gap-1.5 mb-4">
      {[['tableau', 'Tableau de bord'], ['moderation', 'Modération'], ...(estAdmin ? [['referentiels', 'Référentiels'], ['acces', 'Accès et comptes']] : [])].map(([v, l]) => (
        <button key={v} onClick={() => setOnglet(v)} className={`px-3 py-1.5 rounded-full text-sm font-medium ${onglet === v ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-700'}`}>{l}{v === 'moderation' && tousRecits ? ` · ${tousRecits.filter(r => !['verifie', 'publie', 'rejete', 'retire'].includes(r.statut)).length} à relire` : ''}</button>
      ))}
    </div>
    {onglet === 'tableau' && <TableauDeBord recits={tousRecits} stats={realStats} dateFr={dateFr} ouvrir={(n) => { setOnglet('moderation'); setFiltre(''); ouvrir(n); }} />}
    {estAdmin && onglet === 'referentiels' && <AdminReferentiels signaler={setMsg} />}
    {estAdmin && onglet === 'acces' && <><AdminAcces signaler={setMsg} dateFr={dateFr} />{carteNda}</>}
    {onglet === 'moderation' && (<>
    {!estAdmin && carteNda}
    {panneauModeration}
    </>)}
    </>,
    true
  );
}

const CW_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1amdmeGxlcGZlb25wam9ybHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTE2NjAsImV4cCI6MjEwMzg4NzY2MH0.koYVDo8tKlzmxzzW6bJJjlEdVwcd3hSTtJ-IQ0JL1JY';

const cwCsv = (lignes, colonnes) => {
  const esc = (v) => { const t = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v)); return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  return [colonnes.join(';'), ...lignes.map(l => colonnes.map(c => esc(l[c])).join(';'))].join('\r\n');
};
const cwTelecharger = (nom, contenu, type) => {
  const blob = new Blob(['﻿' + contenu], { type: type || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
};

function OpenDataPage({ integre }) {
  const { setView, DB, realStats } = useApp();
  const [fiches, setFiches] = useState(null);
  const [erreur, setErreur] = useState('');
  useEffect(() => {
    (async () => {
      try {
        const { data, error } = await window.cwDb.from('recits_publics').select('*').order('numero', { ascending: false }).limit(1000);
        if (error) throw error;
        setFiches(data || []);
      } catch (e) { setErreur('Les fiches publiques ne peuvent pas être chargées pour l’instant.'); setFiches([]); }
    })();
  }, []);

  const jour = new Date().toISOString().slice(0, 10);
  const pe = (realStats && realStats.par_etablissement) || {};
  const etabl = DB.institutions.map(i => {
    const c = pe[i.id] || {};
    return { id: i.id, nom: i.fullName, type: i.type, ville: i.city, canton: i.canton, signalements: c.signalements || 0, positifs: c.positifs || 0, verifies: c.verifies || 0, indice_equite: c.indice == null ? '' : c.indice, niveau: c.niveau ? (DB.ratings[c.niveau] || {}).label || c.niveau : '' };
  });
  const colFiches = ['numero', 'type', 'annee', 'tranche_age', 'canton', 'etablissement_nom', 'service', 'type_incident', 'categories_positives', 'dms_score', 'dms_max'];
  const colEtabl = ['id', 'nom', 'type', 'ville', 'canton', 'signalements', 'positifs', 'verifies', 'indice_equite', 'niveau'];
  const Bloc = ({ titre, children }) => <Card className="p-6 mb-6">{titre && <h2 className="text-xl font-bold text-gray-900 mb-3">{titre}</h2>}{children}</Card>;
  const Code = ({ children }) => <pre className="bg-gray-900 text-white text-xs rounded-xl p-3 overflow-x-auto" style={{ whiteSpace: 'pre' }}>{children}</pre>;

  return (
    <div className="min-h-screen bg-gradient-to-b from-gray-50 to-white">
      <div className="max-w-4xl mx-auto p-4 md:p-8">
        {!integre && <button onClick={() => setView('landing')} className="flex items-center gap-1 text-sm text-teal-700 mb-6"><ChevronLeft className="w-4 h-4" /> Retour à l'accueil</button>}
        {!integre ? (
          <div className="text-center mb-8">
            <div className="flex justify-center mb-4"><Logo size="xl" /></div>
            <h1 className="text-3xl font-bold text-gray-900 mb-2">Données ouvertes</h1>
            <p className="text-gray-600">Tout ce qui est publié ici sort directement de la base de l’observatoire, en lecture seule, sous licence CC BY-NC-SA 4.0. Aucun récit individuel, jamais.</p>
          </div>
        ) : (
          <p className="text-sm text-gray-600 mb-6">Ce que le public voit et télécharge, tel que la base le publie. Les fiches n’apparaissent qu’avec le consentement de la personne et après la décision « Publier ».</p>
        )}

        <Bloc titre="1. Compteurs publics">
          {!realStats ? <p className="text-sm text-gray-500">Chargement…</p> : (
            <>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                {[['Témoignages reçus', realStats.recus], ['Témoignages vérifiés', realStats.verifies], ['Retours positifs', realStats.positifs], ['Établissements concernés', realStats.etablissements]].map(([l, v]) => (
                  <div key={l} className="text-center p-4 rounded-xl bg-teal-50 border border-teal-100"><p className="text-2xl font-extrabold text-teal-700">{v}</p><p className="text-xs text-gray-600">{l}</p></div>
                ))}
              </div>
              <p className="text-sm text-gray-600">Les témoignages retirés par leur auteur·e et ceux rejetés par la modération ne sont pas comptés. La répartition par canton n’est publiée qu’à partir de 5 témoignages par canton : {Object.keys(realStats.par_canton || {}).length === 0 ? 'aucun canton n’atteint encore ce seuil.' : Object.entries(realStats.par_canton).map(([c, n]) => `${c} ${n}`).join(' · ')}</p>
            </>
          )}
        </Bloc>

        <Bloc titre="2. Établissements : comptes et indice d’équité">
          <p className="text-sm text-gray-600 mb-3">{DB.institutions.length} établissements référencés en Suisse romande. L’indice (0 à 100) n’est calculé qu’à partir de 5 témoignages vérifiés, selon la formule publiée sur la page Méthodologie.</p>
          <div className="overflow-x-auto mb-3">
            <table className="cw-tableau w-full text-sm">
              <thead><tr className="text-left text-xs text-gray-500 border-b"><th className="py-2 pr-3">Établissement</th><th className="py-2 pr-3">Canton</th><th className="py-2 pr-3">Signalements</th><th className="py-2 pr-3">Positifs</th><th className="py-2 pr-3">Vérifiés</th><th className="py-2 pr-3">Indice</th></tr></thead>
              <tbody>
                {etabl.filter(e => e.signalements + e.positifs > 0).map(e => (
                  <tr key={e.id} className="border-b border-gray-100"><td data-label="Établissement" className="py-2 pr-3 text-gray-800">{e.nom}</td><td data-label="Canton" className="py-2 pr-3">{e.canton}</td><td data-label="Signalements" className="py-2 pr-3">{e.signalements}</td><td data-label="Positifs" className="py-2 pr-3">{e.positifs}</td><td data-label="Vérifiés" className="py-2 pr-3">{e.verifies}</td><td data-label="Indice" className="py-2 pr-3">{e.indice_equite === '' ? '—' : `${e.indice_equite} · ${e.niveau}`}</td></tr>
                ))}
                {etabl.filter(e => e.signalements + e.positifs > 0).length === 0 && <tr><td colSpan="6" className="py-3 text-gray-500">Aucun témoignage reçu pour l’instant.</td></tr>}
              </tbody>
            </table>
          </div>
          <Button variant="outline" icon={FileText} onClick={() => cwTelecharger(`carewatch_etablissements_${jour}.csv`, cwCsv(etabl, colEtabl))}>Télécharger le CSV ({etabl.length} lignes)</Button>
        </Bloc>

        <Bloc titre="3. Fiches résumées des témoignages publiés">
          <p className="text-sm text-gray-600 mb-3">Une fiche n’apparaît ici que si la personne a coché « Publier la fiche résumée » et si la modération a validé puis publié le témoignage. Elle ne contient ni récit, ni date précise : numéro, type, année, tranche d’âge, canton, établissement, service, type d’incident ou catégories, score de ressenti.</p>
          {erreur && <p className="text-sm text-amber-700 mb-3">{erreur}</p>}
          {fiches === null ? <p className="text-sm text-gray-500">Chargement…</p> : fiches.length === 0 ? (
            <p className="text-sm text-gray-500 mb-3">Aucune fiche publiée pour l’instant.</p>
          ) : (
            <div className="overflow-x-auto mb-3">
              <table className="cw-tableau w-full text-sm">
                <thead><tr className="text-left text-xs text-gray-500 border-b"><th className="py-2 pr-3">Numéro</th><th className="py-2 pr-3">Type</th><th className="py-2 pr-3">Année</th><th className="py-2 pr-3">Canton</th><th className="py-2 pr-3">Établissement</th><th className="py-2 pr-3">Service</th><th className="py-2 pr-3">Objet</th><th className="py-2 pr-3">Score</th></tr></thead>
                <tbody>
                  {fiches.slice(0, 200).map(r => (
                    <tr key={r.numero} className="border-b border-gray-100"><td data-label="Numéro" className="py-2 pr-3 font-mono text-teal-700">{r.numero}</td><td data-label="Type" className="py-2 pr-3">{r.type === 'positif' ? 'Positif' : 'Signalement'}</td><td data-label="Année" className="py-2 pr-3">{r.annee}</td><td data-label="Canton" className="py-2 pr-3">{r.canton}</td><td data-label="Établissement" className="py-2 pr-3">{r.etablissement_nom}</td><td data-label="Service" className="py-2 pr-3">{r.service}</td><td data-label="Objet" className="py-2 pr-3">{r.type === 'positif' ? (Array.isArray(r.categories_positives) ? r.categories_positives.join(', ') : '') : r.type_incident}</td><td data-label="Score" className="py-2 pr-3">{r.dms_score != null ? `${r.dms_score}/${r.dms_max}` : '—'}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <Button variant="outline" icon={FileText} disabled={!fiches || fiches.length === 0} onClick={() => cwTelecharger(`carewatch_fiches_publiques_${jour}.csv`, cwCsv(fiches || [], colFiches))}>Télécharger le CSV ({fiches ? fiches.length : 0} fiches)</Button>
        </Bloc>

        <Bloc titre="4. Accès direct pour les chercheur·euse·s et développeur·euse·s">
          <p className="text-sm text-gray-600 mb-3">Les mêmes données sont lisibles par programme, sans compte. La clé ci-dessous est publique et ne donne accès qu’à ces deux jeux de données ; elle ne permet ni de lire un récit, ni d’écrire.</p>
          <p className="text-xs font-semibold text-gray-500 uppercase mb-1">Compteurs publics et comptes par établissement (JSON)</p>
          <Code>{`curl -X POST "${CW_SUPABASE_URL}/rest/v1/rpc/stats_publiques" \\
  -H "apikey: ${CW_ANON_KEY}" \\
  -H "Content-Type: application/json" -d "{}"`}</Code>
          <p className="text-xs font-semibold text-gray-500 uppercase mb-1 mt-3">Fiches résumées publiées (JSON, filtrable)</p>
          <Code>{`curl "${CW_SUPABASE_URL}/rest/v1/recits_publics?select=*&canton=eq.GE" \\
  -H "apikey: ${CW_ANON_KEY}"`}</Code>
          <p className="text-xs text-gray-500 mt-3">Syntaxe des filtres : PostgREST (eq., in., order=, limit=). Les téléchargements CSV de cette page sont produits à partir de ces mêmes appels.</p>
        </Bloc>

        <Bloc titre="5. Licence et bonnes pratiques">
          <p className="text-sm text-gray-600 mb-2"><strong>Licence Creative Commons BY-NC-SA 4.0</strong> : réutilisation autorisée avec attribution « CareWatch™, carewat.ch », sans usage commercial, et partage aux mêmes conditions.</p>
          <p className="text-sm text-gray-600">Ne cherchez pas à réidentifier des personnes à partir de ces données ; c’est contraire à la licence, à la loi sur la protection des données et à l’esprit de l’observatoire. Les seuils de publication (5 témoignages) existent pour cela.</p>
        </Bloc>
      </div>
    </div>
  );
}

            <p className="text-gray-700 text-lg leading-relaxed mb-4">CareWatch™ est une initiative portée par un consortium de partenaires académiques, associatifs et communautaires, unis par la conviction que l'équité des soins est un droit fondamental.</p>

          </Card>

          {/* Mission */}
          <Card className="p-6 md:p-8 mb-6 bg-teal-50 border-teal-200">
            <h2 className="text-xl font-bold text-teal-900 mb-3">Notre mission</h2>
            <p className="text-3xl font-extrabold text-teal-800 mb-4 leading-tight">Rendre visible l'invisible.</p>
            <p className="text-xl text-gray-800 leading-relaxed mb-4">En permettant à chaque personne de partager son expérience de soins et de témoigner — pour améliorer concrètement les soins. Contribuons à des soins plus justes.</p>

          </Card>

            <p className="text-amber-800">Les études existantes montrent des disparités significatives dans l'expérience de soins selon l'origine, la couleur de peau, ou le statut socio-économique des patient·e·s. Pourtant, aucun système ne permet de documenter ces iniquités de manière systématique et participative.</p>
