                  <item.icon className={`w-4 h-4 text-${item.color}-700`} />
                </div>
                <div>
                  <h4 className="font-medium text-gray-900">{i + 1}. {item.title}</h4>
                  <p className="text-sm text-gray-600">{item.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </Card>

        {/* Nos inspirations */}
        <Card className="p-6">
          <h3 className="text-lg font-semibold mb-4 flex items-center gap-2"><TrendingUp className="w-5 h-5 text-indigo-600" /> Nos inspirations</h3>
          <div className="space-y-4">
            <div className="p-4 bg-indigo-50 rounded-xl">
              <p className="font-bold text-indigo-900 mb-2">Magnet Recognition (États-Unis)</p>
              <p className="text-gray-700 leading-relaxed">Un hôpital « Magnet » est un établissement reconnu pour l'excellence de ses pratiques infirmières et la qualité de son environnement de travail. Le programme, créé par l'American Nurses Credentialing Center (ANCC), évalue les établissements sur la base d'indicateurs mesurables : satisfaction des patient·e·s, conditions de travail du personnel, résultats cliniques. Les hôpitaux certifiés Magnet affichent de meilleurs résultats en termes de sécurité des soins et de rétention du personnel. CareWatch™ s'inspire de cette logique de transparence et de certification par la preuve.</p>
              <a href="https://www.nursingworld.org/organizational-programs/magnet/about-magnet/" target="_blank" rel="noopener noreferrer" className="text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-1 mt-2 text-sm">Programme Magnet (ANCC) <ExternalLink className="w-3.5 h-3.5" /></a>
            </div>
            <div className="p-4 bg-teal-50 rounded-xl">
              <p className="font-bold text-teal-900 mb-2">Learning Health Systems (Suisse)</p>
              <p className="text-gray-700 leading-relaxed">Le concept de « système de santé apprenant » repose sur un cycle continu : les données issues de la pratique clinique sont analysées, transformées en connaissances, puis réinjectées dans les soins pour les améliorer. CareWatch™ applique cette logique aux expériences des patient·e·s : chaque témoignage alimente des indicateurs qui permettent aux établissements de s'améliorer en continu.</p>
              <a href="https://www.slhs.ch/en/" target="_blank" rel="noopener noreferrer" className="text-teal-600 hover:text-teal-700 font-medium flex items-center gap-1 mt-2 text-sm">Swiss Learning Health System (SLHS) <ExternalLink className="w-3.5 h-3.5" /></a>
            </div>
            <div className="p-4 bg-amber-50 rounded-xl">
              <p className="font-bold text-amber-900 mb-2">Microsystèmes cliniques (Suède)</p>
              <p className="text-gray-700 leading-relaxed">En Suède, l'amélioration de la qualité des soins repose sur les microsystèmes cliniques : de petites équipes au sein des services qui mesurent leurs propres résultats, identifient les problèmes et mettent en œuvre des changements à leur échelle. CareWatch™ fournit à ces équipes les données dont elles ont besoin — au niveau du service, pas seulement de l'établissement.</p>
              <a href="https://www.microsystemfestival.com/" target="_blank" rel="noopener noreferrer" className="text-amber-600 hover:text-amber-700 font-medium flex items-center gap-1 mt-2 text-sm">Qulturum — Microsystem Festival (Jönköping) <ExternalLink className="w-3.5 h-3.5" /></a>
            </div>
            <div className="p-4 bg-rose-50 rounded-xl">
              <p className="font-bold text-rose-900 mb-2">Care Quality Commission — CQC (Royaume-Uni)</p>
              <p className="text-gray-700 leading-relaxed">La CQC est l'organisme indépendant qui inspecte et évalue tous les services de santé en Angleterre selon cinq critères : sûrs, efficaces, bienveillants, adaptés et bien gouvernés. Les rapports sont publics. CareWatch™ s'inspire de cette transparence radicale.</p>
              <a href="https://www.cqc.org.uk/" target="_blank" rel="noopener noreferrer" className="text-rose-600 hover:text-rose-700 font-medium flex items-center gap-1 mt-2 text-sm">Care Quality Commission (CQC) <ExternalLink className="w-3.5 h-3.5" /></a>
            </div>
            <div className="p-4 bg-emerald-50 rounded-xl">
              <p className="font-bold text-emerald-900 mb-2">Représentant·e·s des usager·ère·s (France)</p>
              <p className="text-gray-700 leading-relaxed">En France, des représentant·e·s des usager·ère·s indépendant·e·s siègent dans les instances hospitalières et rapportent à la Haute Autorité de Santé (HAS) pour la certification des établissements. CareWatch™ transpose cette logique au contexte suisse.</p>
              <a href="https://www.has-sante.fr/jcms/c_431816/fr/representation-des-usagers" target="_blank" rel="noopener noreferrer" className="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-1 mt-2 text-sm">HAS — Représentation des usagers <ExternalLink className="w-3.5 h-3.5" /></a>
            </div>
          </div>
          <p className="text-gray-600 mt-4 text-sm">Notre approche combine ces modèles : <strong>Mesurer</strong> (indicateurs d'équité) → <strong>Transformer</strong> (accompagnement) → <strong>Certifier</strong> (label d'excellence).</p>
        </Card>

        {/* Évolution */}
        <Card className="p-6">
          <h3 className="text-lg font-semibold mb-4 flex items-center gap-2"><TrendingUp className="w-5 h-5 text-indigo-600" /> Évolution de la plateforme</h3>
          <div className="space-y-4">
            {[
              { n: 1, title: 'Établissements hospitaliers — Suisse romande', status: 'En cours', color: 'teal', desc: 'Hôpitaux et cliniques, avec précision au niveau du service, département, consultation ou unité. Signalements, évaluations, accès aux soins spécialisés.' },
              { n: 2, title: 'AI, assurances, institutions sociales et soins à domicile', color: 'amber', desc: 'Offices AI, bureaux d\'expertise des assurances, institutions sociales et de protection de l\'enfance (SPMi, DGEJ, APEA/KESB), et services de soins à domicile (IMAD, CMS).' },
              { n: 3, title: 'Cabinets et professionnel·le·s de santé', color: 'indigo', desc: 'Physiothérapie, ergothérapie, ostéopathie, chiropraxie et autres professionnel·le·s de santé. L\'objectif est de couvrir l\'ensemble du parcours de soins pluri-professionnel — avec les mêmes garanties d\'anonymat et de protection à chaque phase.' },
            ].map(p => (
              <div key={p.n} className="flex gap-3">
                <div className={`w-8 h-8 rounded-lg bg-${p.color}-100 flex items-center justify-center flex-shrink-0 mt-0.5`}>
                  <span className={`text-sm font-bold text-${p.color}-700`}>{p.n}</span>
                </div>
                <div>
                  <h4 className="font-medium text-gray-900">{p.title} {p.status && <span className="text-xs font-semibold text-teal-700 bg-teal-100 px-2 py-0.5 rounded ml-2">{p.status}</span>}</h4>
                  <p className="text-sm text-gray-700">{p.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </Card>

        {/* Protection des données */}
        <Card className="p-6">
          <h3 className="text-lg font-semibold mb-3 flex items-center gap-2"><Shield className="w-5 h-5 text-teal-600" /> Protection des données</h3>
          <p className="text-gray-700 mb-3">Les signalements sont faits <strong>sans compte ni nom</strong>, et aucune adresse IP n'est conservée avec eux. Le code postal est vérifié localement dans le navigateur puis <strong>immédiatement effacé — jamais transmis ni stocké</strong>. L'établissement ne reçoit jamais les signalements individuels. Seuls des indicateurs agrégés sont rendus publics.</p>
          <div className="space-y-2">
            {[
              'Site hébergé chez Infomaniak à Genève · Base des signalements chez Supabase, à Zurich (Suisse, centre de données AWS eu-central-2)',
              'Traitement conforme à la nLPD, détaillé dans la politique de confidentialité (pied de page)',
              'Numéro et code personnel : vous pouvez retirer votre signalement ou modifier vos autorisations à tout moment',
              'Licence données : CC BY-NC-SA 4.0',
            ].map((item, i) => (
              <div key={i} className="flex items-center gap-2">
                <Check className="w-4 h-4 text-teal-500 flex-shrink-0" />
                <p className="text-sm text-gray-600">{item}</p>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}
function MethodologyPage() {
  const { setView, DB } = useApp();
  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto">
      <Button variant="ghost" onClick={() => setView('landing')} icon={ChevronLeft} className="mb-4">Retour</Button>
      <h2 className="text-2xl font-bold mb-3">Méthodologie</h2>
      <p className="text-sm text-gray-500 mb-5 flex items-center gap-1.5"><Shield className="w-3.5 h-3.5 text-teal-600" /> Transparence totale : notre méthodologie est publique et reproductible. Aucune donnée individuelle n'est utilisée sans anonymisation.</p>
      <div className="space-y-6">
        <Card className="p-6">
          <h3 className="font-semibold mb-3">1. Questionnaire DMS</h3>
          <p className="text-gray-600">Le questionnaire DMS (Discrimination in Medical Settings) mesure 7 dimensions de l'expérience de discrimination dans les soins.</p>
        </Card>
        <Card className="p-6">
          <h3 className="font-semibold mb-3">2. Indice d’équité par établissement</h3>
          <p className="text-gray-600 mb-2">Calculé automatiquement, uniquement à partir des témoignages <strong>vérifiés</strong> par la modération, et seulement à partir de <strong>5 témoignages vérifiés</strong> pour un établissement. En dessous, l’établissement affiche « Pas encore d’évaluation ».</p>
          <p className="text-gray-600 mb-2"><strong>Indice (0 à 100) = 70 × (1 − ressenti moyen de discrimination) + 30 × part des retours positifs.</strong> Le ressenti est la moyenne des réponses au questionnaire DMS (0 = jamais, 1 = toujours) sur les signalements vérifiés ; la part des retours positifs est le nombre d’expériences positives vérifiées divisé par le nombre total de témoignages vérifiés.</p>
          <p className="text-gray-600">Niveaux : 75 et plus, Exemplaire · 50 à 74, Satisfaisant · 25 à 49, À améliorer · moins de 25, Insuffisant. La formule est appliquée dans la base de données elle-même, la même pour le site et les données ouvertes. Il n’existe pas d’autre pondération, ni d’inspection, ni de « score de fiabilité ».</p>
        </Card>
        <Card className="p-6">
          <h3 className="font-semibold mb-3">3. Les 4 niveaux</h3>
          <div className="space-y-2 mt-3">
            {Object.entries(DB.ratings).filter(([k]) => k !== 'no_data').map(([k, r]) => (
              <div key={k} className="flex items-center gap-3">
                <RatingBadge rating={k} />
                <span className="text-sm text-gray-700">{r.desc}</span>
              </div>
            ))}
          </div>
        </Card>
        <Card className="p-6">
          <h3 className="font-semibold mb-3">4. Protection anti-abus</h3>
          <ul className="list-disc pl-6 text-gray-600 space-y-1 text-sm">
            <li>Vérification du code postal</li>
            <li>Modération sous 48h</li>
            <li>Droit de contestation (14 jours)</li>
            <li>Indice d’équité par établissement (dès 5 témoignages vérifiés)</li>
          </ul>
        </Card>
        <Card className="p-6 bg-blue-50 border-blue-200">
          <h3 className="font-semibold mb-3 text-blue-900">5. Cartographie de l'accès aux soins</h3>
          <p className="text-blue-800 text-sm mb-3">Au-delà de l'équité de traitement, CareWatch™ documente l'équité d'accès selon quatre axes :</p>
          <ul className="list-disc pl-6 text-blue-700 space-y-1 text-sm">
            <li><strong>Équipements spécialisés</strong> — Disponibilité de plateaux techniques avancés (accès vasculaire écho-guidé, aphérèse, imagerie haute résolution)</li>
            <li><strong>Maladies rares et négligées</strong> — Consultations spécialisées pour les maladies du sang (drépanocytose, thalassémie), maladies du tissu conjonctif (Ehlers-Danlos, Marfan), troubles neurodéveloppementaux (TSA, TDAH, troubles dys), maladies auto-immunes (lupus, polyarthrite rhumatoïde), conditions chroniques négligées (COVID long, endométriose, fibromyalgie, syndrome de fatigue chronique), référencées via ERN EuroBloodNet, ORPHANET et kosek</li>
            <li><strong>Programmes populations vulnérables</strong> — Soins dédiés aux personnes migrantes, sans-papiers, en situation de précarité, ou ayant des besoins spécifiques</li>
            <li><strong>Interprétariat et médiation</strong> — Services d'interprétariat communautaire (Appartenances, Interpret) et médiation interculturelle intégrée</li>
          </ul>
          <p className="text-sm text-blue-600 mt-3 italic">Sources : sites institutionnels, ERN EuroBloodNet, ORPHANET Suisse, partenaires CareWatch™. Données vérifiées trimestriellement.</p>
        </Card>
      </div>
    </div>
  );
}

function FAQPage() {
  const { setView } = useApp();
  const faqs = [
    { q: 'Que faites-vous avec les données recueillies ?', a: 'Chaque témoignage — positif ou négatif — alimente quatre usages : recueillir et structurer les expériences du terrain, produire des indicateurs d\'équité publics librement accessibles, outiller le plaidoyer des associations partenaires, et offrir aux établissements un miroir pour s\'améliorer. Seules des données agrégées sont publiées — jamais des témoignages individuels. L\'établissement ne voit jamais votre signalement : les détails trop spécifiques sont automatiquement généralisés avant publication.' },
    { q: 'Peut-on aussi signaler une bonne expérience ?', a: 'Oui, absolument ! Les retours positifs permettent de valoriser les équipes qui font bien les choses, et contribuent à leur score d\'équité. Utilisez le bouton « Partager une bonne expérience » depuis votre espace. Comme pour les signalements négatifs, l\'anonymat est total et aucune donnée personnelle n\'est collectée.' },
    { q: 'Mes données sont-elles anonymes ?', a: 'CareWatch™ applique une anonymisation structurelle renforcée. CareWatch™ ne demande ni nom, ni prénom, ni compte ; aucun cookie, aucun identifiant d\'appareil, et aucune adresse IP n\'est conservée avec votre témoignage (une empreinte non réversible sert uniquement à limiter les abus pendant 24 heures). Il n\'y a pas de création de compte nominatif — l\'accès se fait par code d\'invitation anonyme. Votre code postal est vérifié localement dans votre navigateur puis immédiatement effacé — seul le résultat de cohérence est transmis, jamais le code postal lui-même. L\'établissement ne reçoit jamais les signalements individuels : il ne voit que des indicateurs agrégés. De plus, si votre témoignage décrit une situation trop spécifique (petit service, date précise), les détails sont automatiquement généralisés avant publication pour qu\'il ne puisse pas être relié à une seule personne (voir question suivante).' },
    { q: 'Comment empêchez-vous qu\'on me reconnaisse à travers mon témoignage ?', a: 'Même sans votre nom, une combinaison de détails précis (date, petit service, motif rare) pourrait théoriquement permettre de deviner qui a témoigné. Pour éviter cela, avant toute publication, l\'équipe de modération généralise les détails trop précis (une vérification automatique de k-anonymat, au moins 5 personnes par combinaison, est en préparation) : certains détails sont généralisés — par exemple, « 3 février » devient « février 2026 », ou « Unité 4B de médecine interne » devient « Médecine interne ». Votre témoignage complet est conservé pour l\'analyse statistique, mais les données rendues publiques sont toujours généralisées. Cela réduit considérablement le risque qu\'on puisse vous identifier — même si aucun système au monde ne peut garantir un anonymat absolu à 100%.' },
    { q: 'Comment sont stockées les données ?', a: 'Le site est hébergé chez Infomaniak à Genève (certifié ISO 27001). Les signalements sont enregistrés dans une base de données Supabase, à Zurich (Suisse, centre de données AWS eu-central-2), chiffrée au repos par l\'hébergeur. La base contient : votre récit et son impact, le canton, l\'établissement et le service, le type d\'incident, les motifs perçus, le score de ressenti, le résultat de cohérence géographique, vos choix de suivi, ainsi que le numéro du signalement et l\'empreinte (hachage) de votre code personnel. Ni votre adresse e-mail ni votre adresse IP n\'y sont conservées ; une empreinte non réversible de l\'IP sert uniquement à limiter les abus, 24 heures au plus. La notification à l\'équipe part depuis l\'hébergement suisse du site. Les données agrégées sont publiées en open data (licence CC BY-NC-SA 4.0). Le détail figure dans la politique de confidentialité, conforme à la nLPD.' },
    { q: 'Quels mécanismes de sécurité sont en place ?', a: 'Chiffrement : toutes les communications sont chiffrées en transit (HTTPS) et la base de données est chiffrée au repos par l\'hébergeur. Sans compte ni nom : aucun identifiant personnel n\'est demandé, l\'anonymat est une propriété de la conception et non un post-traitement. Code personnel haché : votre code n\'est jamais stocké en clair, seule son empreinte l\'est, et il est indispensable pour lire, modifier ou retirer un signalement. Accès cloisonné : la base n\'est pas accessible directement depuis le navigateur, seules des fonctions contrôlées le sont, et seule l\'équipe de modération, tenue au secret par contrat, lit les récits. Journal : chaque opération (envoi, modification, retrait) est journalisée avec le numéro du signalement, sans information sur la personne. Vérification locale : le code postal est traité uniquement dans votre navigateur et n\'est jamais envoyé. Protection contre les abus : limites de fréquence côté base. Le détail figure dans la politique de confidentialité.' },
          { q: 'Je suis professionnel·le — risque de représailles ?', a: 'Non. Aucun nom, aucun identifiant n\'est demandé, et aucune adresse IP n\'est conservée avec votre témoignage. Les détails trop spécifiques de votre témoignage sont automatiquement généralisés avant publication. Le CO art. 328 et 336 protègent les lanceurs d\'alerte : un licenciement faisant suite à un signalement de bonne foi est juridiquement abusif.' },
    { q: 'Comment fonctionne la vérification ?', a: 'Le code postal est vérifié localement dans votre navigateur pour s\'assurer de la cohérence géographique avec l\'établissement signalé. Il n\'est jamais transmis ni stocké — seul le résultat (cohérent ou incohérent) est envoyé. Un signalement géographiquement incohérent sera flaggé pour vérification manuelle.' },
    { q: 'Combien de temps prend la modération ?', a: 'Chaque signalement est examiné sous 48h par notre équipe indépendante. L\'établissement dispose ensuite de 14 jours pour apporter son point de vue avant toute publication des données agrégées.' },
    { q: 'L\'établissement peut-il contester ?', a: 'Oui, chaque établissement dispose de 14 jours pour contester un signalement avec des éléments factuels. L\'objectif est constructif : accompagner l\'amélioration, pas punir. La contestation se fait sur la base de données strictement anonymisées — l\'établissement ne sait jamais qui a témoigné et ne peut pas vous identifier.' },
    { q: 'Comment un établissement est-il évalué ?', a: 'Par un indice d\'équité de 0 à 100, calculé automatiquement à partir des seuls témoignages vérifiés par la modération, et seulement dès 5 témoignages vérifiés : 70 % pour le ressenti moyen de discrimination (questionnaire DMS, inversé) et 30 % pour la part de retours positifs. Il n\'y a pas de « score de fiabilité » ni de pondération cachée : la formule est publique, sur la page Méthodologie.' },
    { q: 'Qui peut accéder aux données ?', a: 'Les données agrégées sont en open data (licence CC BY-NC-SA 4.0) : chercheurs, journalistes, associations, citoyens. Les signalements individuels restent strictement anonymes et ne sont jamais publiés tels quels.' },
    { q: 'Je suis professionnel·le de santé — est-ce que je risque des représailles ?', a: 'Non. Aucun nom, aucun identifiant n\'est demandé, et aucune adresse IP n\'est conservée avec votre témoignage. Les détails trop spécifiques sont automatiquement généralisés avant publication, et votre employeur ne voit que des indicateurs globaux. De plus, le droit suisse protège les lanceurs et lanceuses d\'alerte : le CO art. 328 impose à l\'employeur de protéger votre personnalité, et le CO art. 336 qualifie d\'abusif tout licenciement faisant suite à un signalement de bonne foi. CareWatch™ vous fournit les bases légales et peut vous orienter vers un·e délégué·e pour vous accompagner.' },
    { q: "Qu'est-ce que le module « Accès aux soins » ?", a: "En plus de documenter comment les patient·e·s sont traité·e·s, CareWatch™ cartographie l'accès aux soins spécialisés : équipements (pose de voie veineuse écho-guidée, aphérèse...), consultations maladies rares (drépanocytose, thalassémie...), programmes pour populations vulnérables (migrants, sans-papiers...) et services d'interprétariat. L'objectif : savoir non seulement si on est bien traité, mais aussi si les soins dont on a besoin existent là où on vit." },
    { q: 'D\'où proviennent les données d\'accès aux soins ?', a: 'Les informations proviennent des sites institutionnels des établissements, des réseaux européens de référence (ERN EuroBloodNet), d\'ORPHANET Suisse et de nos partenaires. Elles sont vérifiées régulièrement et mises à jour par notre équipe indépendante. Consulter ces données ne laisse aucune trace — votre navigation est anonyme.' },
    { q: 'Pourquoi inclure les maladies rares et négligées ?', a: 'Parce que l\'accès aux soins spécialisés est un enjeu majeur d\'équité. Cela concerne les maladies du sang comme la drépanocytose, mais aussi les syndromes d\'Ehlers-Danlos (délai diagnostique de 10-15 ans), l\'endométriose (7-10 ans), le COVID long (feuille de route de l\'Office fédéral de la santé publique en cours, peu de consultations dédiées), la polyarthrite rhumatoïde (souvent 3+ consultations avant diagnostic), le trouble du déficit de l\'attention (TDAH) adulte (sous-diagnostiqué chez les femmes), les troubles du spectre de l\'autisme (listes d\'attente de 12-24 mois), ou le syndrome de fatigue chronique (quasi aucun spécialiste en Suisse). Rendre cette information visible est un premier pas vers l\'équité. Toutes ces consultations sont accessibles anonymement via CareWatch™.' },
    { q: 'Quelles extensions sont prévues pour la plateforme ?', a: 'CareWatch™ évolue par phases. Phase 1 (actuelle) : établissements hospitaliers et cliniques de Suisse romande, avec précision au niveau du service, département, consultation ou unité. Phase 2 : offices AI, bureaux d\'expertise des assurances, institutions sociales et de protection de l\'enfance (SPMi, DGEJ, APEA/KESB), et services de soins à domicile (IMAD, CMS Vaud, etc.). Phase 3 : cabinets et professionnel·le·s de santé pluri-disciplinaires (physiothérapie, ergothérapie, ostéopathie, chiropraxie). L\'objectif est de couvrir l\'ensemble du parcours de soins, pas seulement l\'hôpital — avec les mêmes garanties de protection de l\'identité à chaque étape.' },
    { q: 'Les hôpitaux n\'ont-ils pas déjà un système de signalement ?', a: 'Si, et c\'est important de le savoir. Chaque hôpital suisse dispose d\'un système interne (CIRS — Critical Incident Reporting System). Mais ces systèmes ont des limites structurelles bien documentées : au Royaume-Uni, le scandale de Mid Staffordshire (2005-2009) a montré que les signalements internes ne fonctionnent pas quand la culture institutionnelle décourage la parole — des centaines de décès évitables n\'avaient jamais été remontés. De plus, les systèmes internes ne couvrent pas les discriminations perçues. Personne ne remplit un formulaire CIRS pour signaler qu\'on l\'a fait attendre plus longtemps à cause de son accent. CareWatch™ est complémentaire : externe, indépendant, anonymisé (détails généralisés), centré sur l\'équité — ce que les dispositifs internes ne peuvent pas mesurer.' },
  ];

  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto">
      <Button variant="ghost" onClick={() => setView('landing')} icon={ChevronLeft} className="mb-4">Retour</Button>
      <h2 className="text-2xl font-bold mb-6">Questions fréquentes</h2>
      <div className="space-y-4">
        {faqs.map((f, i) => (
          <Card key={i} className="p-5">
            <h3 className="font-semibold text-lg mb-2">{f.q}</h3>
            <p className="text-gray-600 leading-relaxed">{f.a}</p>
          </Card>
        ))}
      </div>
      <Card className="p-6 bg-teal-50 border-teal-200 mt-6">
        <h3 className="font-semibold text-teal-900 mb-2">Une question non traitée ici ?</h3>
        <p className="text-teal-700 mb-4">L'équipe CareWatch™ est disponible pour répondre à toute question.</p>
        <a href="mailto:contact@carewat.ch" className="inline-flex items-center gap-2 px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl transition-colors">
          <Mail className="w-4 h-4" /> Contacter l'équipe
        </a>
      </Card>
    </div>
  );
}

              {p.items.map((item, i) => (
                <li key={i} className="flex items-start gap-2 text-gray-600">
                  <Check className="w-4 h-4 text-teal-600 mt-1 flex-shrink-0" />
                  {item}
                </li>
              ))}
            </ul>
          </Card>
        ))}
      </div>
    </div>
  );
}

  services_etablissement: { titre: 'Services propres à un établissement', cle: 'id', colonnes: ['etablissement_id', 'ordre', 'categorie', 'items'], champs: [

    { k: 'categorie', l: 'Catégorie', type: 'text', requis: true }, { k: 'items', l: 'Services, un par ligne', type: 'liste', requis: true },

  organisations: { titre: 'Organisations et urgences', cle: 'id', colonnes: ['type', 'nom', 'telephone', 'ville', 'actif'], champs: [

    { k: 'description', l: 'Description', type: 'textarea' }, { k: 'url', l: 'Site web', type: 'text' }, { k: 'ville', l: 'Ville', type: 'text' }, { k: 'actif', l: 'Visible', type: 'bool', defaut: true },
  ]},
  ressources_cantonales: { titre: 'Ressources cantonales', cle: 'id', colonnes: ['canton', 'type', 'nom', 'telephone', 'actif'], champs: [
    { k: 'canton', l: 'Canton', type: 'select', options: ['GE', 'VD', 'VS', 'FR', 'NE', 'JU', 'BE'], requis: true },
    { k: 'type', l: 'Type', type: 'select', options: ['mediation', 'plainte', 'lavi'], requis: true }, { k: 'ordre', l: 'Ordre', type: 'number' },
    { k: 'nom', l: 'Nom', type: 'text', requis: true }, { k: 'telephone', l: 'Téléphone', type: 'text' }, { k: 'url', l: 'Site web', type: 'text' },
    { k: 'email', l: 'E-mail', type: 'text' }, { k: 'adresse', l: 'Adresse', type: 'text' }, { k: 'description', l: 'Description', type: 'textarea' }, { k: 'actif', l: 'Visible', type: 'bool', defaut: true },

    { k: 'resume', l: 'Résumé', type: 'textarea' }, { k: 'source', l: 'Source', type: 'text' }, { k: 'type', l: 'Type (annonce, etude, evenement…)', type: 'text' },
