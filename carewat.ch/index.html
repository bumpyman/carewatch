function LoginModal() {
  const { showLogin, setShowLogin, loginType, setLoginType, setUserType, setUser, setView, setGererPrefill, setEmailModeration, setOtpDemande } = useApp();
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [numeroAcces, setNumeroAcces] = useState('');
  const [retrouverOuvert, setRetrouverOuvert] = useState(false);
  const [codeAcces, setCodeAcces] = useState('');
  const [busyAcces, setBusyAcces] = useState(false);
  useEffect(() => { setError(''); setPassword(''); }, [showLogin, loginType]);
  const [etatEmail, setEtatEmail] = useState(null); // compte | autorise | inconnu
  const [codeAccesAdmin, setCodeAccesAdmin] = useState('');
  const [busyAdmin, setBusyAdmin] = useState(false);
  useEffect(() => {
    const e = email.trim().toLowerCase();
    if (loginType !== 'admin' || e === 'admin@carewat.ch' || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { setEtatEmail(null); return; }
    const t = setTimeout(async () => {
      try { const { data } = await window.cwDb.rpc('moderateur_etat', { p_email: e }); setEtatEmail((data && data.etat) || 'inconnu'); } catch (ex) { setEtatEmail(null); }
    }, 500);
    return () => clearTimeout(t);
  }, [email, loginType]);

  if (!showLogin) return null;

  const retrouverSignalement = async () => {
    const numero = numeroAcces.trim().toUpperCase(), code = codeAcces.trim().toUpperCase();
    if (!numero || !code) { setError('Indiquez le numéro du signalement et votre code personnel.'); return; }
    setBusyAcces(true); setError('');
    let recit = null;
    try {
      const { data, error } = await window.cwDb.rpc('lire_recit', { p_numero: numero, p_code: code });
      if (!error && data) recit = data;
    } catch (e) {}
    setBusyAcces(false);
    if (!recit) { setError('Vérifiez le numéro et le code personnel, puis réessayez.'); return; }
    // L'espace affiché découle du rôle enregistré avec le signalement
    const espace = recit.role === 'professionnel' ? 'professional' : (loginType === 'professional' ? 'professional' : 'patient');
    setGererPrefill({ numero, code, recit });
    setUserType(espace);
    setShowLogin(false);
    setView('my-reports');
  };

  const handleAdminLogin = () => {
    if (email === 'admin@carewat.ch' && password === 'admin1234') {
      setUser({ email, name: 'Admin CareWatch™', role: 'admin' });
      setUserType('admin');
      setShowLogin(false);
      setView('dashboard');
      return;
    }
    setError('Identifiants incorrects');
  };

  const estDemo = email.trim().toLowerCase() === 'admin@carewat.ch';
  const versEtapeSuivante = (otp) => {
    setEmailModeration(email.trim());
    setOtpDemande(otp || null);
    setShowLogin(false);
    setView('moderation');
  };
  // Connexion réelle : mot de passe, ou code d'accès pour une première connexion
  const connexionReelle = async () => {
    setError(''); setBusyAdmin(true);
    try {
      if (etatEmail === 'autorise') {
        const { data: v, error: e0 } = await window.cwDb.rpc('moderateur_verifier_code', { p_email: email.trim(), p_code: codeAccesAdmin.trim() });
        if (e0 || !v || !v.ok) { setError((v && v.raison === 'expire') ? 'Ce code d’accès a expiré, demandez-en un nouveau.' : 'E-mail ou code d’accès incorrect.'); return; }
        const { error: e1 } = await window.cwDb.auth.signInWithOtp({ email: email.trim(), options: { emailRedirectTo: window.location.origin + '/?m=moderation', shouldCreateUser: true } });
        if (e1) { setError('Envoi du code impossible : ' + (e1.message || '')); return; }
        versEtapeSuivante('email');
        return;
      }
      const { error: e2 } = await window.cwDb.auth.signInWithPassword({ email: email.trim(), password });
      if (e2) { setError(/Invalid login/i.test(e2.message || '') ? 'E-mail ou mot de passe incorrect.' : (e2.message || 'Connexion impossible.')); return; }
      setPassword('');
      versEtapeSuivante(null);
    } finally { setBusyAdmin(false); }
  };
  const motDePasseOublie = async () => {
    if (!email.trim()) { setError('Indiquez d’abord votre e-mail.'); return; }
    setError(''); setBusyAdmin(true);
    const { error: e } = await window.cwDb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin + '/?m=moderation' });
    setBusyAdmin(false);
    if (e) { setError('Envoi impossible : ' + (e.message || '')); return; }
    versEtapeSuivante('recovery');
  };
  const validerAdmin = () => { if (estDemo) handleAdminLogin(); else connexionReelle(); };
  const handleAnonymous = () => {
    setUserType(loginType);
    setShowLogin(false);
    setView(loginType === 'patient' ? 'patient-home' : 'professional-home');
  };

  const handleForgotPassword = () => {
    setError('La fonctionnalité de récupération de mot de passe sera disponible au lancement officiel. Contactez contact@carewat.ch pour toute question.');
  };

  const colors = { patient: 'teal', professional: 'amber', admin: 'rose', retrouver: 'teal' };

  const champsRetrouver = (
    <>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
        <Input label="Numéro" value={numeroAcces} onChange={v => setNumeroAcces(v.toUpperCase())} placeholder="CW-2026-00012" />
        <Input label="Code personnel" type="password" value={codeAcces} onChange={v => setCodeAcces(v.toUpperCase())} placeholder="ABCD234EFG" />
      </div>
      <Button variant="outline" onClick={retrouverSignalement} disabled={busyAcces} className="w-full" icon={Search}>{busyAcces ? 'Vérification…' : 'Retrouver mon signalement'}</Button>
    </>
  );
  const c = colors[loginType];

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={() => setShowLogin(false)}>
      <div className="bg-white rounded-2xl max-w-md w-full p-6" onClick={e => e.stopPropagation()}>
        <div className="flex justify-between items-center mb-6">
          <div className="flex items-center gap-3">
            <Logo size="sm" />
            <h2 className="text-xl font-semibold">
              {loginType === 'admin' ? 'Administration' : loginType === 'retrouver' ? 'Retrouver mon signalement' : 'Accéder à CareWatch™'}
            </h2>
          </div>
          <button onClick={() => setShowLogin(false)} className="text-gray-400 hover:text-gray-600"><X className="w-5 h-5" /></button>
        </div>
        
        <p className="text-sm text-gray-600 mb-4">
          {loginType === 'patient' ? 'Espace Patient·e / Proche / Témoin' : loginType === 'professional' ? 'Espace Professionnel·le de santé' : loginType === 'retrouver' ? 'Vous pourrez consulter l’état du signalement, modifier votre texte ou vos autorisations, ou le retirer.' : 'Administration CareWatch™'}
        </p>

        {error && <div className="mb-4 p-3 rounded-lg bg-rose-50 text-rose-700 text-sm">{error}</div>}

        {/* Patient / Professional — anonymous only */}
        {loginType === 'retrouver' && (
          <div className="space-y-4">
            {champsRetrouver}
          </div>
        )}

        {loginType !== 'admin' && loginType !== 'retrouver' && (
          <div className="space-y-3">
            <Button onClick={handleAnonymous} className={`w-full bg-${c}-600 hover:bg-${c}-700`} icon={ArrowRight}>
              {loginType === 'patient' ? "Accéder à l'espace patient" : "Accéder à l'espace professionnel"}
            </Button>
            <p className="text-sm text-gray-600 text-center flex items-center justify-center gap-1.5"><ShieldCheck className={`w-4 h-4 text-${c}-600 flex-shrink-0`} /> Sans compte ni nom. Rien ne permet de savoir qui vous êtes.</p>
            <button onClick={() => setRetrouverOuvert(!retrouverOuvert)} className="text-sm text-teal-700 underline w-full text-center">
              {retrouverOuvert ? 'Masquer' : 'J’ai déjà un numéro de signalement'}
            </button>
            {retrouverOuvert && (
              <div className="bg-gray-50 rounded-xl p-4 border border-gray-200">
                <p className="text-sm text-gray-600 mb-3">Numéro et code personnel reçus à la fin de votre signalement.</p>
                {champsRetrouver}
              </div>
            )}
          </div>
        )}

        {/* Admin — login required */}
        {loginType === 'admin' && (
          <div className="space-y-4" onKeyDown={e => { if (e.key === 'Enter') validerAdmin(); }}>
            <Input label="E-mail" type="email" value={email} onChange={setEmail} placeholder="prenom@carewat.ch" />
            {etatEmail === 'autorise' ? (
              <>
                <div className="p-3 rounded-xl bg-teal-50 border border-teal-100 text-sm text-teal-900"><strong>Première connexion.</strong> Saisissez le code d’accès reçu par e-mail ; vous choisirez ensuite votre mot de passe.</div>
                <Input label="Code d’accès" value={codeAccesAdmin} onChange={v => setCodeAccesAdmin(v.toUpperCase())} placeholder="8 caractères" />
              </>
            ) : (
              <Input label="Mot de passe" type="password" value={password} onChange={setPassword} placeholder="••••••••" />
            )}
            <Button onClick={validerAdmin} disabled={busyAdmin || !email.trim() || (etatEmail === 'autorise' ? !codeAccesAdmin.trim() : !password)} className="w-full" icon={Lock}>{busyAdmin ? 'Connexion…' : 'Se connecter'}</Button>
            {estDemo && <p className="text-xs text-gray-500 text-center">Ce compte ouvre l’interface de démonstration, avec des données fictives.</p>}
            {!estDemo && etatEmail !== 'autorise' && <button onClick={motDePasseOublie} disabled={busyAdmin} className="text-sm text-teal-700 underline w-full text-right">Mot de passe oublié ?</button>}

            <p className="text-sm text-gray-600 text-center">Accès réservé aux administrateurs. Contactez <a href="mailto:contact@carewat.ch" className="text-gray-600 underline">contact@carewat.ch</a> pour obtenir vos identifiants.</p>
          </div>
        )}
      </div>
    </div>
  );
}

function InstitutionModal({ institution: inst, onClose }) {
  const { DB, setView, setUserType, setSelectedInstitution } = useApp();
  if (!inst || !inst.rating) { onClose(); return null; }
  const r = DB.ratings[inst.rating] || { label: '?', color: 'gray', stars: 0, desc: '' };

  const handleReport = () => {
    onClose();
    setUserType('patient');
    setView('new-report');
  };

  const handlePositive = () => {
    onClose();
    setUserType('patient');
    setView('positive-report');
  };

  return (
    <Modal isOpen={true} onClose={onClose} title={inst.fullName} size="lg">
      <div className="space-y-6">
        {/* Header info */}
        <div>
          <p className="text-gray-600 mb-4">{inst.type} • {inst.city} ({DB.cantonNames[inst.canton]})</p>
          <div className="flex flex-wrap items-center gap-3 p-4 rounded-xl bg-gray-50">
            <RatingBadge rating={inst.rating} size="md" />
            <Stars rating={inst.rating} />
            <span className="text-sm text-gray-500 ml-auto">
              {inst.trend === 'up' ? '↑ En amélioration' : inst.trend === 'down' ? '↓ En baisse' : '→ Stable'}
            </span>
          </div>
        </div>

        {/* Stats */}
        <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
          <div className="text-center p-3 rounded-xl bg-teal-50">
            <p className="text-lg font-bold text-teal-700">{inst.reports}</p>
            <p className="text-sm text-teal-600">Signalements</p>
          </div>
          <div className="text-center p-3 rounded-xl bg-emerald-50">
            <p className="text-lg font-bold text-emerald-700">{inst.positiveReports || 0}</p>
            <p className="text-sm text-emerald-600">Retours positifs</p>
          </div>
          <div className="text-center p-3 rounded-xl bg-blue-50">
            <p className="text-lg font-bold text-blue-700">{inst.verified}</p>
            <p className="text-sm text-blue-600">Vérifiés</p>
          </div>
          <div className="text-center p-3 rounded-xl bg-amber-50">
            <p className="text-lg font-bold text-amber-700">{inst.contested}</p>
            <p className="text-sm text-amber-600">Contestés</p>
          </div>
          <div className="text-center p-3 rounded-xl bg-indigo-50">
            <p className="text-lg font-bold text-indigo-700">{inst.reliability}%</p>
            <p className="text-sm text-indigo-600">Fiabilité</p>
          </div>
        </div>

        {/* Positive ratio indicator */}
        {(inst.positiveReports > 0) && (
          <div className="bg-emerald-50 rounded-xl p-4">
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-medium text-emerald-900">Ratio d'expériences positives</span>
              <span className="text-sm font-bold text-emerald-700">{Math.round((inst.positiveReports / (inst.reports + inst.positiveReports)) * 100)}%</span>
            </div>
            <div className="h-2 bg-emerald-200 rounded-full overflow-hidden">
              <div className="h-full bg-emerald-500 rounded-full" style={{width: `${Math.round((inst.positiveReports / (inst.reports + inst.positiveReports)) * 100)}%`}} />
            </div>
          </div>
        )}

        {/* Dernière inspection */}
        {inst.lastInspection && (
          <div className="bg-indigo-50 rounded-xl p-4">
            <div className="flex items-center gap-3">
              <ClipboardList className="w-6 h-6 text-indigo-600" />
              <div>
                <p className="font-medium text-indigo-900">Dernière Inspection CEC</p>
                <p className="text-sm text-indigo-700 mb-1">{inst.lastInspection}</p>
                <p className="text-sm text-indigo-600">Care Equity Commission — Commission d'Équité des Soins</p>
              </div>
            </div>
          </div>
        )}

        {/* Accès aux soins */}
        {(() => {
          const access = DB.accessByInstitution[inst.id];
          if (!access) return null;
          const catalog = DB.accessCatalog;
          const hasAnything = (access.equipment || []).length > 0 || (access.rareDiseases || []).length > 0 || (access.vulnerablePrograms || []).length > 0 || (access.interpretation || []).length > 0;
          if (!hasAnything) return null;
          return (
            <div className="bg-blue-50 rounded-xl p-4 space-y-3">
              <h4 className="font-semibold text-blue-900 flex items-center gap-2">
                <Stethoscope className="w-5 h-5 text-blue-600" />
                Accès aux soins spécialisés
              </h4>
              {(access.equipment||[]).length > 0 && (
                <div>
                  <p className="text-xs font-medium text-blue-800 mb-1.5">Équipements spécialisés</p>
                  <div className="flex flex-wrap gap-1.5">
                    {(access.equipment||[]).map(id => {
                      const item = catalog.equipment.find(e => e.id === id);
                      return item ? <span key={id} className="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-lg">{item.name}</span> : null;
                    })}
                  </div>
                </div>
              )}
              {(access.rareDiseases||[]).length > 0 && (
                <div>
                  <p className="text-xs font-medium text-purple-800 mb-1.5">Maladies rares & négligées</p>
                  <div className="flex flex-wrap gap-1.5">
                    {(access.rareDiseases||[]).map(id => {
                      const item = catalog.rareDiseases.find(e => e.id === id);
                      return item ? <span key={id} className="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-lg">{item.name}</span> : null;
                    })}
                  </div>
                </div>
              )}
              {(access.vulnerablePrograms||[]).length > 0 && (
                <div>
                  <p className="text-xs font-medium text-amber-800 mb-1.5">Programmes populations vulnérables</p>
                  <div className="flex flex-wrap gap-1.5">
                    {(access.vulnerablePrograms||[]).map(id => {
                      const item = catalog.vulnerablePrograms.find(e => e.id === id);
                      return item ? <span key={id} className="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-lg">{item.name}</span> : null;
                    })}
                  </div>
                </div>
              )}
              {(access.interpretation||[]).length > 0 && (
                <div>
                  <p className="text-xs font-medium text-teal-800 mb-1.5">Interprétariat & médiation</p>
                  <div className="flex flex-wrap gap-1.5">
                    {(access.interpretation||[]).map(id => {
                      const item = catalog.interpretation.find(e => e.id === id);
                      return item ? <span key={id} className="text-xs bg-teal-100 text-teal-700 px-2 py-1 rounded-lg">{item.name}</span> : null;
                    })}
                  </div>
                </div>
              )}
              {access.notes && (
                <p className="text-sm text-blue-700 italic border-t border-blue-200 pt-2">{access.notes}</p>
              )}
            </div>
          );
        })()}

        {/* Rating explanation */}
        {(() => {
          const bgMap = { outstanding: 'bg-indigo-50', good: 'bg-teal-50', requires_improvement: 'bg-amber-50', inadequate: 'bg-slate-50' };
          const h4Map = { outstanding: 'text-indigo-900', good: 'text-teal-900', requires_improvement: 'text-amber-900', inadequate: 'text-slate-900' };
          const pMap = { outstanding: 'text-indigo-700', good: 'text-teal-700', requires_improvement: 'text-amber-700', inadequate: 'text-slate-700' };
          return (
            <div className={(bgMap[inst.rating] || 'bg-gray-50') + " rounded-xl p-4"}>
              <h4 className={"font-medium mb-1 " + (h4Map[inst.rating] || 'text-gray-900')}>{r.label}</h4>
              <p className={"text-sm " + (pMap[inst.rating] || 'text-gray-700')}>{r.desc}</p>
            </div>
          );
        })()}

        {/* Actions */}
        <div className="flex gap-3">
          <Button variant="secondary" onClick={handlePositive} icon={Heart} className="flex-1 !bg-emerald-50 !text-emerald-700 !border-emerald-200 hover:!bg-emerald-100">Partager une bonne expérience</Button>
          <Button onClick={handleReport} className="flex-1">Signaler un incident</Button>
        </div>
      </div>
    </Modal>
  );
}

  ];

  const handleLogout = () => {

    setUserType(null);
    setUser(null);
    setView('landing');
  };

    switch (view) {
      case 'patient-home': return <PatientHome />;
      case 'professional-home': return <ProfessionalHome />;
      case 'new-report': return <NewReport />;
      case 'positive-report': return <PositiveReport />;

      case 'institutions': return adminReel ? <ModerationPage integre="referentiels" /> : <InstitutionsView />;

      case 'plafa-doc': return <PLAFAModule />;
      case 'dossier-analysis': return <DossierAnalysis />;
      case 'help': return <HelpView />;
      case 'news': return <NewsView />;
      case 'peer-support': return <PeerSupportView />;
      case 'formations': return <FormationsView />;
      case 'dashboard': return <AdminDashboard />;
      case 'admin-reports': return adminReel ? <ModerationPage integre="moderation" /> : <AdminReports />;
      case 'users': return adminReel ? <ModerationPage integre="acces" /> : <AdminUsers />;
      case 'inspections': return <InspectionsView />;
      case 'admin-opendata': return adminReel ? <OpenDataPage integre /> : <AdminOpenData />;

          { name: 'Service de médiation pour le secteur hospitalier du canton de Berne', tel: '031 633 79 31', url: 'https://www.gef.be.ch', desc: 'Médiation uniquement pour les patients hospitalisés. Pas de médiation pour les consultations ambulatoires.' },
        ],
        plainte: { name: 'Direction de la santé, des affaires sociales et de l\u2019intégration', tel: '031 633 79 20', url: 'https://www.gef.be.ch', desc: 'Traitement des plaintes des patients à l\u2019encontre des professionnels et des institutions de santé.' },
        lavi: { name: 'Centre LAVI Biel/Bienne', tel: '032 322 56 33', url: 'https://www.opferhilfe-bern.ch', addr: 'Rue de l\u2019Argent 4, 2502 Biel/Bienne', desc: 'Aide gratuite pour la population francophone du Jura bernois et de Bienne.' },
      },
    };
    // Ressources cantonales : la base d'abord, la page en secours
    const cantonResources = (() => {
      if (!(ref && Array.isArray(ref.ressources_cantonales) && ref.ressources_cantonales.length)) return cantonResourcesEmbarquees;
      const res = {};
      ref.ressources_cantonales.forEach(r => {
        const c = res[r.canton] = res[r.canton] || { label: DB.cantonNames[r.canton] || r.canton, mediation: [] };
        const item = { name: r.nom, tel: r.telephone || undefined, url: r.url || undefined, email: r.email || undefined, addr: r.adresse || undefined, desc: r.description || '' };
        if (r.type === 'mediation') c.mediation.push(item);
        else if (r.type === 'plainte') { if (!c.plainte) c.plainte = item; else c.plainte2 = item; }
        else if (r.type === 'lavi') { if (!c.lavi) c.lavi = item; else c.lavi2 = item; }
      });
      return res;
    })();
    const psy = { name: 'Pro Mente Sana (Suisse romande)', tel: '0840 00 00 61', url: 'https://promentesana.org', desc: 'Conseil juridique et psychosocial gratuit et anonyme. Spécialisé dans les droits des personnes en santé mentale. Lu, ma, je 10h-13h.' };

    // === TRIAGE INTELLIGENT ===
    const canton = data.canton;
    const grounds = data.grounds || [];
    const dmsEntries = Object.entries(dms);
    const dmsScoreMap = { 'Jamais': 0, 'Rarement': 1, 'Parfois': 2, 'Souvent': 3, 'Toujours': 4 };
    const dmsTotal = dmsEntries.reduce((s, [,v]) => {
      if (typeof v === 'string') return s + (dmsScoreMap[v] || 0);
      if (typeof v === 'number') return s + v;
      return s + (v?.score || 0);
    }, 0);
    const dmsMax = dmsEntries.length * 4;
    const severity = dmsMax > 0 ? dmsTotal / dmsMax : 0;
    const inst = DB.institutions.find(i => i.id === data.institution);
    const instName = inst ? inst.fullName : data.institution || '';
    const isPsychiatric = /psych|Belle-Id|Prangins|psychiatr|Marsens|RFSM/i.test(instName);
    const hasPhysicalHarm = /violen|frapp|agress|forc|contrain|attach|isol|enfer/i.test(data.description || '');
    const groundLabels = grounds.map(gId => {
      const g = discriminationGrounds.find(x => x.id === gId);
      return g ? g.label : gId;
    });
    const cantonRes = cantonResources[canton] || cantonResources.GE;
    const cantonLabel = cantonRes.label;

    // Recommandations triées par pertinence
    const recommendations = [];
    if (hasPhysicalHarm) {
      recommendations.push({ key: 'lavi', priority: 'urgent', icon: '🛡️', title: 'Aide aux victimes d\u2019infractions', reason: 'Votre témoignage mentionne des termes évoquant une atteinte possible à votre intégrité. Si tel est le cas, un centre spécialisé peut vous accompagner gratuitement et confidentiellement.' });
    }
    if (isPsychiatric) {
      recommendations.push({ key: 'psy', priority: 'high', icon: '💬', title: 'Conseil en santé mentale', reason: 'Votre signalement concerne un contexte psychiatrique. Des spécialistes des droits des patients en santé mentale peuvent vous conseiller gratuitement et anonymement.' });
    }
    if (severity > 0.6) {
      recommendations.push({ key: 'plainte', priority: 'high', icon: '⚖️', title: 'Plainte formelle', reason: 'Votre questionnaire indique une expérience de discrimination marquée. Vous avez le droit de saisir une autorité indépendante qui peut ouvrir une enquête.' });
    }
    recommendations.push({ key: 'delegue', priority: 'carewatch', icon: '🤝', title: 'Délégué·e CareWatch™', reason: 'Un·e bénévole formé·e par CareWatch™ vous accompagne dans vos démarches : comprendre vos droits, préparer un dossier, choisir la bonne voie de recours. Service gratuit et confidentiel.' });
    if (recommendations.length <= 2) {
      recommendations.push({ key: 'mediation', priority: 'standard', icon: '🗣️', title: 'Médiation', reason: 'La médiation est souvent un premier pas efficace pour faire entendre votre expérience et obtenir une réponse de l\u2019institution concernée.' });
    }

    const priorityStyles = {
      urgent: { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-800', badge: 'bg-red-600 text-white', badgeLabel: 'Prioritaire' },
      high: { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-900', badge: 'bg-amber-500 text-white', badgeLabel: 'Recommandé' },
      carewatch: { bg: 'bg-indigo-50', border: 'border-indigo-300', text: 'text-indigo-900', badge: 'bg-indigo-600 text-white', badgeLabel: 'Accompagnement' },
      standard: { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-800', badge: 'bg-blue-500 text-white', badgeLabel: 'Suggéré' },
    };

    // === DOSSIER EXPORTABLE ===
    const generateDossier = () => {
      const lines = [];
      lines.push('RÉSUMÉ DE MON SIGNALEMENT — CareWatch™');
      lines.push('═'.repeat(50));
      lines.push('');
      lines.push('Ce document est généré automatiquement à partir de');
      lines.push('votre signalement CareWatch™. Vous pouvez le transmettre');
      lines.push('à un·e délégué·e CareWatch™, un médiateur, une commission');
      lines.push('de surveillance, un centre d\u2019aide aux victimes d\u2019infractions');
      lines.push('ou un·e avocat·e pour appuyer votre démarche.');
      lines.push('');
      lines.push('CODE DE SUIVI : ' + code);
      lines.push('DATE DU SIGNALEMENT : ' + new Date().toLocaleDateString('fr-CH'));
      lines.push('');
      lines.push('— FAITS —');
      lines.push('Établissement : ' + instName);
      if (data.service) lines.push('Service : ' + data.service);
      lines.push('Canton : ' + cantonLabel);
      if (data.date) lines.push('Date de l\u2019incident : ' + data.date);
      if (data.time) lines.push('Heure : ' + data.time);
      lines.push('');
      lines.push('— DESCRIPTION —');
      lines.push(data.description || '(non renseignée)');
      lines.push('');
      if (groundLabels.length > 0) {
        lines.push('— MOTIFS PERÇUS DE DISCRIMINATION —');
        lines.push('(Il s\u2019agit de mon ressenti, pas d\u2019une accusation factuelle.)');
        groundLabels.forEach(g => lines.push('  • ' + g));
        lines.push('');
      }
      if (data.impact) {
        lines.push('— CONSÉQUENCES RESSENTIES —');
        lines.push(data.impact);
        lines.push('');
      }
      if (dmsMax > 0) {
        lines.push('— QUESTIONNAIRE DMS —');
        lines.push('Score : ' + dmsTotal + '/' + dmsMax + ' (' + Math.round(severity * 100) + '%)');
        lines.push('(Échelle Discrimination in Medical Settings, Peek et al. 2011)');
        lines.push('');
      }
      lines.push('— INTERLOCUTEURS COMPÉTENTS (' + cantonLabel.toUpperCase() + ') —');
      cantonRes.mediation.forEach(m => lines.push('Médiation : ' + m.name + (m.tel ? ' — ' + m.tel : '')));
      lines.push('Plainte : ' + cantonRes.plainte.name + (cantonRes.plainte.tel ? ' — ' + cantonRes.plainte.tel : ''));
      lines.push('LAVI : ' + cantonRes.lavi.name + ' — ' + cantonRes.lavi.tel);
      lines.push('Santé mentale : Pro Mente Sana — 0840 00 00 61');
      lines.push('');
      lines.push('— BASES LÉGALES APPLICABLES —');
      lines.push('• LAMal art. 58a-58e : qualité des prestations');
      lines.push('• Loi cantonale sur la santé : droits des patients');
      lines.push('• CP art. 261bis : discrimination raciale');
      lines.push('• nLPD art. 25 : droit d\'accès au dossier médical');
      if (isPro) {
        lines.push('• CO art. 328 : protection de la personnalité');
        lines.push('• CO art. 336 : licenciement abusif (protection lanceur d\'alerte)');
        lines.push('• LTr art. 6 : protection de la santé des travailleurs');
      }
      lines.push('');
      lines.push('— ANONYMAT —');
      lines.push('Ce signalement a été anonymisé : aucune donnée personnelle, détails généralisés.');
      lines.push('Aucun nom, aucun code postal n\'a été');
      lines.push('transmis ni conservé. Le code postal a été vérifié localement');
      lines.push('dans le navigateur puis immédiatement effacé.');
      lines.push('');
      lines.push('— NOTE —');
      lines.push('Ce document a été généré via CareWatch™ (carewat.ch).');
      lines.push('Les données sont déclaratives et reflètent le vécu');
      lines.push('subjectif du ou de la patient·e. CareWatch™ ne se');
      lines.push('prononce pas sur la réalité des faits décrits.');
      return lines.join('\n');
    };

    // === RENDU ===
    const RESS_SECTIONS = [
      { t: 'Délégué·e CareWatch™', d: 'Une personne de l’équipe peut vous accompagner dans vos démarches' },
      { t: 'Vos droits et vos options', d: 'Le parcours recommandé selon ce que vous avez décrit' },
      { t: 'Préparer mon dossier et mes courriers', d: 'Récapitulatif à télécharger et lettres types prêtes à envoyer' },
      { t: 'Toutes les démarches possibles', d: 'Médiation, plainte, dossier médical, canton par canton' },
      { t: 'Vous n’êtes pas seul·e', d: 'Associations et soutien entre pairs' },
    ];
    const entete = (k) => {
      const ouvert = ressPage === k;
      return (
        <button type="button" onClick={() => setRessPage(ouvert ? -1 : k)} aria-expanded={ouvert}
          className={`w-full flex items-center gap-3 p-4 rounded-2xl border-2 text-left transition-colors ${ouvert ? 'bg-teal-600 border-teal-600 text-white' : 'bg-white border-gray-200 hover:border-teal-300'}`}>
          <span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold flex-shrink-0 ${ouvert ? 'bg-white text-teal-700' : 'bg-teal-50 text-teal-700'}`}>{k + 1}</span>
          <span className="flex-1">
            <span className={`block font-semibold ${ouvert ? 'text-white' : 'text-gray-900'}`}>{RESS_SECTIONS[k].t}</span>
            <span className={`block text-sm ${ouvert ? 'text-teal-50' : 'text-gray-600'}`}>{RESS_SECTIONS[k].d}</span>
          </span>
          <ChevronRight className="w-5 h-5 flex-shrink-0" style={{ transform: ouvert ? 'rotate(90deg)' : 'none', transition: 'transform 150ms' }} />
        </button>
      );
    };
    return (
      <div className="space-y-3 mb-5" ref={haut}>
        <p className="text-sm text-gray-600">Cinq sections, à ouvrir dans l’ordre ou selon vos besoins. Touchez un titre pour l’ouvrir ou le refermer.</p>
        {entete(0)}
        {ressPage === 0 && (<>
        {/* BLOC 1 : Délégué·e CareWatch™ — l'institution qui n'existait pas */}
        <div className="bg-gradient-to-br from-indigo-100 via-purple-50 to-indigo-50 rounded-2xl p-5 border-2 border-indigo-300 relative overflow-hidden">
          <div className="absolute top-0 right-0 w-24 h-24 bg-indigo-200 rounded-bl-full opacity-30" />
          <div className="relative">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-sm text-indigo-600 font-medium">Service CareWatch™</span>
            </div>
            <h3 className="font-bold text-indigo-900 text-lg mb-2 flex items-center gap-2">
              <Users className="w-5 h-5 text-indigo-600" />
              Délégué·e CareWatch™
            </h3>
            <p className="text-sm text-gray-700 mb-3">Dans de nombreux pays, la loi impose une représentation des patient·e·s au sein des institutions de soins : représentant·e·s des usagers en France (loi Kouchner, 2002), Patient Advocate aux États-Unis (Joint Commission), médiateur·rice·s obligatoires en Belgique (loi droits du patient, 2002), Patientombudsman en Suède et en Finlande, ou encore Commissaire aux plaintes au Québec. En Suisse, aucun dispositif équivalent n'existe à ce jour. <strong>CareWatch™ comble cette lacune.</strong></p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
              {[
                { icon: '📋', label: 'Comprendre vos droits', desc: 'Un·e bénévole formé·e vous explique les voies de recours dans votre canton' },
                { icon: '📄', label: 'Préparer votre dossier', desc: 'Aide à structurer votre témoignage pour une médiation ou une plainte' },
                { icon: '🧭', label: 'Vous orienter', desc: 'Vers le bon interlocuteur : médiateur, commission, centre d\u2019aide aux victimes d\u2019infractions' },
                { icon: '📞', label: 'Vous accompagner', desc: 'Suivi de votre démarche et soutien moral tout au long du processus' },
              ].map((item, i) => (
                <div key={i} className="flex items-start gap-2 p-2.5 bg-white/60 rounded-xl border border-indigo-100">
                  <span className="text-lg flex-shrink-0">{item.icon}</span>
                  <div>
                    <p className="text-xs font-semibold text-indigo-900">{item.label}</p>
                    <p className="text-sm text-gray-700">{item.desc}</p>
                  </div>
                </div>
              ))}
            </div>
            <div className="bg-white/80 rounded-xl p-3 border border-indigo-200 mb-3">
              <p className="text-sm text-gray-700 mb-2"><strong className="text-indigo-800">Fonctionnement :</strong> Après votre signalement, vous pouvez demander à être mis·e en contact avec un·e délégué·e CareWatch™ — un·e bénévole formé·e au droit des patients, indépendant·e de toute institution. Ce service est gratuit, confidentiel, et sans obligation.</p>
              <p className="text-sm text-gray-600">Le ou la délégué·e ne donne pas de conseil juridique (pour cela, orientez-vous vers Pro Mente Sana ou un·e avocat·e), mais vous aide à naviguer dans un système complexe et à faire valoir vos droits.</p>
            </div>
            <button onClick={() => { window.open('mailto:delegue@carewat.ch?subject=Demande%20de%20délégué·e%20CareWatch™%20—%20' + encodeURIComponent(code) + '&body=Bonjour,%0A%0AJe%20souhaite%20être%20accompagné·e%20par%20un·e%20délégué·e%20CareWatch™.%0A%0ACode%20de%20suivi%20:%20' + encodeURIComponent(code) + '%0ACanton%20:%20' + encodeURIComponent(cantonLabel) + '%0A%0AMerci.', '_blank'); }} className="w-full py-3 px-4 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2 shadow-sm">
              <Heart className="w-4 h-4" /> Demander un·e délégué·e CareWatch™
            </button>
            <p className="text-sm text-indigo-400 text-center mt-2">Service en cours de déploiement — délai de réponse : 48 à 72 heures</p>
          </div>
        </div>

        </>)}
        {entete(1)}
        {ressPage === 1 && (<>
        {/* BLOC 2 : Recommandations personnalisées */}
        <div className="bg-white rounded-2xl p-5 border border-gray-200">
          <h3 className="font-semibold text-gray-900 mb-2 flex items-center gap-2">
            <Shield className="w-5 h-5 text-gray-600" />
            Vos droits et vos options — {cantonLabel}
          </h3>
          <p className="text-sm text-gray-700 mb-4">En fonction de ce que vous avez décrit, voici les démarches les plus pertinentes pour votre situation. Ces démarches sont indépendantes de CareWatch™.</p>

          {/* PARCOURS RECOMMANDÉ — Escalade progressive */}
          <div className="bg-gradient-to-r from-teal-50 to-emerald-50 rounded-xl p-4 mb-4 border border-teal-200">
            <p className="text-sm font-bold text-teal-900 mb-2 flex items-center gap-2"><TrendingUp className="w-4 h-4" /> Parcours recommandé — par ordre d'efficacité</p>
            <div className="space-y-2">
              {[
                { step: 1, label: 'Médiation cantonale', desc: 'Gratuite, rapide (2-4 semaines). Résout la majorité des situations sans procédure formelle. Premier recours recommandé.', efficacy: 'Résolution dans ~60% des cas', color: 'teal' },
                { step: 2, label: 'Plainte à la commission de surveillance', desc: 'Si la médiation échoue ou pour les cas graves. Peut ouvrir une enquête et prononcer des sanctions (avertissement, blâme, amende).', efficacy: 'Sanction dans ~30% des cas instruits', color: 'amber' },
                { step: 3, label: 'Plainte pénale (art. 261bis CP)', desc: 'En cas de discrimination raciale caractérisée, contrainte, lésions corporelles ou abus d\'autorité. Voie judiciaire formelle.', efficacy: 'Réservé aux infractions pénales', color: 'rose' },
              ].map(s => (
                <div key={s.step} className="flex items-start gap-3">
                  <div className={`w-7 h-7 rounded-full bg-${s.color}-100 flex items-center justify-center flex-shrink-0 mt-0.5`}>
                    <span className={`text-xs font-bold text-${s.color}-700`}>{s.step}</span>
                  </div>
                  <div className="flex-1">
                    <p className="text-sm font-semibold text-gray-900">{s.label}</p>
                    <p className="text-sm text-gray-700">{s.desc}</p>
                    <p className={`text-xs font-medium text-${s.color}-600 mt-0.5`}>{s.efficacy}</p>
                  </div>
                </div>
              ))}
            </div>
            <p className="text-sm text-teal-700 mt-3 bg-white/60 rounded-lg p-2 border border-teal-100">Chaque étape renforce la suivante : un dossier de médiation bien préparé devient une pièce à conviction pour une plainte formelle. <strong>Le Délégué·e CareWatch™ vous guide à chaque palier.</strong></p>
          </div>

          {/* ONE-CLICK : Demande de médiation pré-remplie */}
          {cantonRes.mediation[0] && (() => {
            const mediator = cantonRes.mediation[0];
            const hasEmail = !!mediator.email;
            const letterBody = 
              'Madame, Monsieur,\n\n' +
              'Je me permets de vous écrire suite à une expérience de soins que je souhaite porter à votre connaissance.\n\n' +
              'Établissement concerné : ' + instName + '\n' +
              (data.service ? 'Service : ' + data.service + '\n' : '') +
              'Date approximative : ' + (data.date || '[à préciser]') + '\n' +
              'Canton : ' + cantonLabel + '\n\n' +
              'Résumé de la situation :\n' +
              '[Décrivez brièvement les faits — vous pouvez reprendre la description de votre signalement CareWatch™]\n\n' +
              'Impact ressenti :\n' +
              (data.impact || '[Décrivez les conséquences sur votre santé, votre confiance, votre parcours de soins]') + '\n\n' +
              'Je souhaiterais bénéficier d\'une médiation pour que cette situation soit entendue et, si possible, qu\'elle contribue à améliorer la prise en charge.\n\n' +
              'Mes coordonnées :\n' +
              'Nom : [Votre nom]\n' +
              'Téléphone : [Votre numéro]\n' +
              'Email : [Votre email]\n\n' +
              'Je vous remercie de votre attention et reste à votre disposition.\n\n' +
              'Cordialement,\n[Votre nom]\n\n' +
              '---\nRéf. CareWatch™ : ' + code;
            const subject = 'Demande de médiation — expérience de soins';
            return (
            <div className="bg-blue-50 rounded-xl p-4 mb-4 border border-blue-200">
              <p className="text-sm font-bold text-blue-900 mb-2 flex items-center gap-2"><Mail className="w-4 h-4" /> Demande de médiation en un clic</p>
              <p className="text-sm text-gray-700 mb-3">
                {hasEmail 
                  ? 'Un email pré-rempli avec les informations de votre signalement. Complétez vos coordonnées entre [crochets] et envoyez.'
                  : 'Une lettre pré-remplie avec les informations de votre signalement. Copiez-la, puis envoyez-la par courrier ou lors de votre appel téléphonique.'}
              </p>
              {hasEmail ? (
                <button onClick={() => {
                  window.open('mailto:' + mediator.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(letterBody), '_blank');
                }} className="w-full py-2.5 px-4 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                  <Mail className="w-4 h-4" /> Ouvrir l'email pré-rempli → {mediator.email}
                </button>
              ) : (
                <div className="space-y-2">
                  <button onClick={() => { navigator.clipboard?.writeText('Objet : ' + subject + '\n\n' + letterBody); }} className="w-full py-2.5 px-4 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                    <ClipboardList className="w-4 h-4" /> Copier la lettre de médiation
                  </button>
                  <div className="flex gap-2">
                    {mediator.tel && (
                      <a href={'tel:' + mediator.tel.replace(/\s/g, '')} className="flex-1 py-2 px-3 rounded-lg bg-white text-blue-700 text-sm font-medium border border-blue-300 hover:bg-blue-50 transition-colors flex items-center justify-center gap-1.5">
                        <Phone className="w-3.5 h-3.5" /> {mediator.tel}
                      </a>
                    )}
                    {mediator.url && (
                      <a href={mediator.url} target="_blank" rel="noopener noreferrer" className="flex-1 py-2 px-3 rounded-lg bg-white text-blue-700 text-sm font-medium border border-blue-300 hover:bg-blue-50 transition-colors flex items-center justify-center gap-1.5">
                        <ExternalLink className="w-3.5 h-3.5" /> Site web
                      </a>
                    )}
                  </div>
                </div>
              )}
              <p className="text-sm text-blue-600 text-center mt-2">{mediator.name}</p>
              <div className="mt-2 bg-white/70 rounded-lg p-2 border border-blue-100">
                <p className="text-sm text-blue-800"><Lock className="w-3.5 h-3.5 inline mr-1" /><strong>Votre anonymat CareWatch™ est préservé.</strong> {hasEmail ? 'L\'email ne contient que des informations que vous choisissez de révéler. Utilisez une adresse email dédiée si vous souhaitez rester anonyme.' : 'La lettre ne contient que des informations que vous choisissez de révéler.'}</p>
              </div>
            </div>
            );
          })()}

          {/* Protection lanceurs d'alerte */}
          {isPro && (
            <div className="bg-emerald-50 rounded-xl p-4 mb-4 border border-emerald-200">
              <p className="text-sm font-bold text-emerald-900 mb-2 flex items-center gap-2"><Shield className="w-4 h-4" /> Protection des lanceurs et lanceuses d'alerte</p>
              <p className="text-sm text-gray-700 mb-2">En tant que professionnel·le de santé, signaler des dysfonctionnements est un droit protégé par la loi (CO art. 328, 336 ; LTr art. 6). Un licenciement motivé par un signalement de bonne foi est juridiquement <strong>abusif</strong>.</p>
              <p className="text-sm text-emerald-800 font-semibold">Votre signalement CareWatch™ est anonymisé — les détails trop spécifiques sont automatiquement généralisés — votre employeur ne voit que des indicateurs globaux.</p>
            </div>
          )}

          <div className="space-y-3">
            {recommendations.filter(r => r.key !== 'delegue').map((rec) => {
              const sty = priorityStyles[rec.priority];
              let res;
              if (rec.key === 'lavi') res = cantonRes.lavi;

    const cantons = getNpaCanton(npa);
    if (!cantons) return { match: false, message: `⚠ NPA ${npa} non reconnu` };
    const match = cantons.includes(canton);
    const cantonStr = cantons.join('/');
    return { match, message: match ? `✓ Cohérence géographique OK (NPA ${npa} → ${cantonStr})` : `⚠ NPA ${npa} → canton ${cantonStr}, mais établissement en ${canton}` };

  // Alerte de modération par courriel : sans le récit, sans les réponses DMS, sans fichier.
  // L'adresse e-mail n'est transmise que si la personne a demandé un recontact ou la pair-aidance.
  const sendNotificationEmail = async (reportData) => {
    try {
      const institution = DB.institutions.find(i => i.id === reportData.institution);
      const instName = institution ? institution.fullName : reportData.institution || 'Non spécifié';
      const modif = reportData.isModification ? ' ⟳ MODIFICATION' : '';
      const numero = reportData.numero || 'sans numéro (base injoignable)';
      const recontactDemande = reportData.acceptEmailContact === true || reportData.wantPeerSupport === true;
      const corps = {
        _subject: `[CareWatch™]${modif} Signalement ${numero}`,
        _template: 'table',
        _captcha: false,
        type: reportData.isModification ? 'MODIFICATION_SIGNALEMENT' : 'NOUVEAU_SIGNALEMENT',
        numero_base: numero,
        statut: 'soumis, à relire dans l’espace de modération',
        role: reportData.role || 'Non précisé',
        canton: DB.cantonNames?.[reportData.canton] || reportData.canton || 'Non précisé',
        etablissement: instName,
        date_signalement: new Date().toLocaleString('fr-CH'),
      };
      if (recontactDemande) {
        corps.recontact = reportData.acceptEmailContact ? 'Oui' : 'Non';
        corps.pair_aidance = reportData.wantPeerSupport ? 'Oui' : 'Non';
        corps.email_suivi = reportData.email || 'Non fourni';
      }
      const response = await fetch(CW_NOTIFIER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(corps)
      });
      await response.json();
      return true;
    } catch (error) {
      console.error('Erreur envoi email:', error);

    }

  // Enregistrement vocal avec Web Speech API

  const toggleRecording = () => {
    if (isRecording) {
      setIsRecording(false);
      if (recognitionRef.current) recognitionRef.current.stop();
    } else {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Votre navigateur ne supporte pas la reconnaissance vocale. Utilisez Chrome ou Edge.');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-CH';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognitionRef.current = recognition;
      recognitionFinalRef.current = '';
      recognition.onresult = (event) => {
        // Seuls les résultats nouveaux sont lus ; les définitifs vont dans le tampon, les provisoires ne sont qu'affichés
        let provisoire = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const r = event.results[i];
          if (r.isFinal) recognitionFinalRef.current = (recognitionFinalRef.current + ' ' + r[0].transcript).trim();
          else provisoire += r[0].transcript;
        }
        const live = (recognitionFinalRef.current + ' ' + provisoire).trim();
        setData(prev => ({...prev, _liveTranscript: live}));
      };
      recognition.onend = () => {
        setIsRecording(false);
        const definitif = recognitionFinalRef.current.trim();
        recognitionFinalRef.current = '';
        setData(prev => {
          if (!definitif) return {...prev, _liveTranscript: undefined};
          return {...prev, description: ((prev.description || '') + '\n' + definitif).trim(), _liveTranscript: undefined};
        });
      };
      recognition.onerror = (e) => {
        setIsRecording(false);
        if (e.error === 'not-allowed') alert('Veuillez autoriser l\'accès au microphone.');
      };
      setIsRecording(true);
      recognition.start();
    }
  };

    'ju-delemont': [

      { cat: 'Médecine', items: ['Médecine interne', 'Cardiologie', 'Gastro-entérologie', 'Pneumologie', 'Oncologie'] },

      { cat: 'Imagerie', items: ['Radiologie', 'Scanner', 'IRM'] },
      { cat: 'Services support', items: ['Accueil / Admission', 'Facturation'] },
    ],
  };

  // Filter services by context + remove irrelevant individual items
  const filteredServiceGroups = DB.services
    .filter(s => s.context.includes('all') || s.context.includes(instContext) || instContext === 'general' || instContext === 'geriatric')
    .map(s => {
      let items = [...s.items];
      if (instContext === 'pediatric') {
        items = items.filter(i => !i.includes('adultes') && !i.includes('gynécolog') && i !== 'Gériatrie' && !i.includes('Sénologie') && !i.includes('PMA') && !i.includes('Addictologie') && i !== 'Médecine du travail');
      }
      if (instContext === 'maternity') {
        items = items.filter(i => !i.includes('pédiatrique') && i !== 'Gériatrie' && !i.includes('Addictologie'));
      }
      if (instContext === 'psychiatric') {
        items = items.filter(i => !i.includes('gynécolog') && !i.includes('Sénologie') && !i.includes('PMA') && !i.includes('obstétric') && !i.includes('Chirurgie') && i !== 'Bloc opératoire' && !i.includes('Néonatologie') && !i.includes('accouchement'));
      }
      if (instContext === 'geriatric') {
        items = items.filter(i => !i.includes('pédiatr') && !i.includes('Pédiatrie') && !i.includes('Pédopsychiatrie') && !i.includes('Néonatologie') && !i.includes('accouchement') && !i.includes('PMA') && !i.includes('néonatals') && !i.includes('prénatales'));
      }
      if (instContext === 'rehabilitation') {
        items = items.filter(i => !i.includes('gynécolog') && !i.includes('Sénologie') && !i.includes('PMA') && !i.includes('obstétric') && !i.includes('Néonatologie') && !i.includes('accouchement') && !i.includes('néonatals'));
      }
      return { ...s, items };
    })
    .filter(s => s.items.length > 0)
    .sort((a, b) => a.cat.localeCompare(b.cat, 'fr'));

  // Get services for current institution: specific if available, otherwise filtered generic
  // Services propres à un établissement : la base d'abord, la page en secours
  const institutionServices = React.useMemo(() => {
    if (!(ref && Array.isArray(ref.services_etablissement) && ref.services_etablissement.length)) return institutionServicesEmbarques;
    const m = {};
    ref.services_etablissement.forEach(x => { (m[x.etablissement_id] = m[x.etablissement_id] || []).push({ cat: x.categorie, items: Array.isArray(x.items) ? x.items : [] }); });
    return m;
  }, [ref]);
  const currentServiceGroups = data.institution && institutionServices[data.institution]
    ? institutionServices[data.institution]
    : filteredServiceGroups.map(s => ({ cat: s.cat, items: s.items }));

  const groundCategories = [...new Set(discriminationGrounds.map(g => g.category))];

  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto">

              </div>

                  { icon: Check, text: 'Je signale des faits que j\'ai personnellement vécus ou observés' },

            </div>

                label="Votre code postal de domicile" 
                value={data.postalCode || ''} 
                onChange={v => setData({...data, postalCode: v})} 
                placeholder="Ex: 1201" 
                required 
              />
              <p className="text-sm text-gray-700 -mt-2 leading-relaxed"><Lock className="w-3.5 h-3.5 text-teal-600 inline-block align-text-bottom mr-1" /><strong>Non transmis, non conservé.</strong> Utilisé uniquement pour vérifier la cohérence géographique avec l'établissement.</p>

              <div className="flex items-start gap-3 p-4 rounded-xl bg-gray-50 border-2 border-gray-200 hover:border-teal-400 transition-colors cursor-pointer" onClick={() => setData({...data, charterAccepted: !data.charterAccepted})}>
                <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-colors ${data.charterAccepted ? 'bg-teal-500 border-teal-500' : 'border-gray-300'}`}>
                  {data.charterAccepted && <Check className="w-4 h-4 text-white" />}
                </div>
                <label className="text-sm text-gray-700 cursor-pointer">
                  <span className="font-medium">J'accepte la charte de bonne conduite</span> et certifie l'exactitude des informations que je vais fournir.
                </label>
              </div>
              <div className="mt-3 p-3 rounded-xl bg-teal-50 border border-teal-100 flex items-start gap-2">
                <Lock className="w-4 h-4 text-teal-600 flex-shrink-0 mt-0.5" />
                <p className="text-sm text-teal-800"><span className="font-semibold">À la fin, vous recevrez un numéro et un code personnel.</span> Notez-les : ils sont votre seul moyen, sans compte, de consulter, modifier ou retirer ce signalement ensuite.</p>
              </div>
            </div>

            <div className="mt-6 p-5 bg-blue-50 rounded-xl border border-blue-200">
              <div className="flex items-start gap-3">
                <Lock className="w-6 h-6 text-blue-600 flex-shrink-0 mt-0.5" />
                <div>
                  <p className="text-base text-blue-900 font-bold mb-2">Votre identité est protégée — mesures anti-représailles</p>
                  <div className="space-y-2">
                    <p className="text-sm text-blue-800">Aucun compte, aucun nom, aucune adresse IP conservée avec votre signalement. Votre code postal est vérifié localement dans votre navigateur puis <strong>immédiatement effacé</strong> — il n'est jamais transmis ni stocké.</p>
                    <p className="text-sm text-blue-800">L'établissement concerné ne reçoit <strong>jamais</strong> le signalement individuel. Il ne voit que des indicateurs agrégés et anonymes. <strong>Les détails trop spécifiques (dates, unités) sont automatiquement généralisés avant publication.</strong></p>
                    <p className="text-sm text-blue-800">Vous recevrez un code de suivi unique pour suivre votre signalement.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

                  <r.icon className={`w-6 h-6 mb-2 ${data.role === r.value ? 'text-teal-600' : 'text-gray-400'}`} />

                { value: 'patient', icon: User, label: 'D\'un·e patient·e' },

              <h2 className="text-xl font-bold text-gray-900 mb-2">{rt.step2Title}</h2>

            {/* Choix audio ou écrit */}

                  onClick={() => setData({...data, inputMode: 'audio'})}

                </button>
              </div>
            </div>

            {data.inputMode === 'audio' ? (
              <div className="text-center p-6 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                <button 
                  onClick={toggleRecording}
                  className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 transition-all shadow-lg ${isRecording ? 'bg-rose-500 animate-pulse scale-110' : 'bg-gradient-to-br from-teal-500 to-emerald-500 hover:scale-105'}`}

                  {isRecording ? <X className="w-8 h-8 text-white" /> : <MessageCircle className="w-8 h-8 text-white" />}
                </button>
                <p className="text-sm text-gray-700 font-medium mb-1">
                  {isRecording ? 'Enregistrement en cours...' : 'Cliquez pour commencer'}
                </p>
                <p className="text-sm text-gray-600">
                  {isRecording ? 'Cliquez à nouveau pour arrêter' : 'Votre audio sera transcrit automatiquement'}
                </p>
                {data.description && (
                  <div className="mt-4 p-4 bg-white rounded-xl text-left border border-gray-200">
                    <p className="text-sm text-gray-600 mb-2 font-medium">Transcription :</p>
                    <p className="text-sm text-gray-700">{data.description}</p>
                    <CwDescHint value={data.description} />
                  </div>
                )}
                {isRecording && data._liveTranscript && (
                  <div className="mt-3 p-3 bg-teal-50 rounded-lg text-left border border-teal-200">
                    <p className="text-sm text-teal-600 mb-1 font-medium">En cours de transcription...</p>
                    <p className="text-sm text-teal-800 italic">{data._liveTranscript}</p>
                  </div>
                )}
              </div>
            ) : (
              <div>
                <TextArea 
                  label={rt.descLabel} 
                  value={data.description || ''} 
                  onChange={v => setData({...data, description: v})} 
                  placeholder={rt.descPlaceholder} 
                  maxLength={3000} 
                  rows={6}
                  required 
                />
                <CwDescHint value={data.description} />
              </div>
            )}

            {/* Conseil : le dossier reste chez la personne, aucun fichier n'est collecté */}
            <Card className="p-4 bg-teal-50 border-teal-100">
              <p className="text-sm font-semibold text-teal-900 mb-1">Constituer votre dossier</p>
              <p className="text-sm text-teal-800">La discrimination est difficile à prouver : l’enjeu est de réunir un faisceau d’indices concordants (dates, services, témoins, courriers, photos). CareWatch ne collecte aucun fichier ; conservez vos preuves par-devers vous.</p>
            </Card>

            <div className="pt-2">
              <TextArea 
                label="Impact sur vous (optionnel)" 
                value={data.impact || ''} 
                onChange={v => setData({...data, impact: v})} 
                placeholder="Comment cette situation vous a-t-elle affecté·e ? Émotionnellement, physiquement, dans votre parcours de soins..." 
                rows={3} 
              />
              <p className="text-sm text-gray-700 mt-1">Ces informations nous aident à comprendre la gravité de la situation.</p>
            </div>
          </div>
        )}

        {/* Step 3: Lieu (avec date optionnelle) */}
        {step === 3 && (
          <div className="space-y-4">
            <h2 className="text-lg font-semibold mb-1">Où cela s'est-il passé ?</h2>
            <p className="text-sm text-gray-600">Trois choix, dans l’ordre : le canton, l’établissement, puis le service ou département.</p>
            
            <div className={`p-4 rounded-xl border-2 ${data.canton ? 'border-emerald-200 bg-emerald-50' : 'border-teal-300 bg-teal-50'}`}>
              <p className="text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">1 · Canton{data.canton ? ' ✓' : ''}</p>
            <Select label="Canton" value={data.canton || ''} onChange={v => setData({...data, canton: v, institution: '', service: ''})} options={DB.cantons.map(c => ({ value: c, label: DB.cantonNames[c] }))} required />
            </div>
            
            {data.canton && (
              <div className={`p-4 rounded-xl border-2 ${data.institution ? 'border-emerald-200 bg-emerald-50' : 'border-teal-300 bg-teal-50'}`}>
              <p className="text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">2 · Établissement{data.institution ? ' ✓' : ''}</p>
              <SearchableSelect label="Établissement" value={data.institution || ''} onChange={v => {
                const inst = DB.institutions.find(i => i.id === v);
                setData({...data, institution: v, service: '', institutionName: inst?.fullName, institutionCity: inst?.city});
              }} 
                options={DB.institutions.filter(i => i.canton === data.canton).map(i => ({ value: i.id, label: i.fullName })).sort((a, b) => a.label.localeCompare(b.label, 'fr'))} 
                placeholder="Rechercher un établissement..." required />
              </div>
            )}
            {data.canton && data.institution && (
              <div className={`p-4 rounded-xl border-2 ${data.service ? 'border-emerald-200 bg-emerald-50' : 'border-amber-400 bg-amber-50'}`}>
                <p className={`text-xs font-semibold uppercase tracking-wide mb-2 ${data.service ? 'text-gray-600' : 'text-amber-800'}`}>3 · Service ou département{data.service ? ' ✓' : ' — à indiquer pour continuer'}</p>
                <SearchableSelect label="Service / Département" value={data.service || ''} onChange={v => setData({...data, service: v})}
                  groups={currentServiceGroups} 
                  placeholder="Rechercher un service..." required />
                {instContext !== 'general' && (
                  <p className="text-xs text-indigo-600 mt-1 flex items-center gap-1">
                    <Info className="w-3 h-3 flex-shrink-0" />
                    Services adaptés pour : {instContext === 'pediatric' ? 'pédiatrie' : instContext === 'maternity' ? 'maternité' : instContext === 'psychiatric' ? 'psychiatrie' : instContext === 'geriatric' ? 'gériatrie' : 'réadaptation'}
                  </p>
                )}
                {institutionServices[data.institution] && (
                  <p className="text-xs text-teal-600 mt-1 flex items-center gap-1">
                    <CheckCircle className="w-3 h-3 flex-shrink-0" />
                    Services spécifiques à cet établissement
                  </p>
                )}
                <Input label="Précision (optionnel)" value={data.serviceDetail || ''} onChange={v => setData({...data, serviceDetail: v})} placeholder="Ex : Unité 3B, Consultation de rhumatologie, Département de médecine..." className="mt-3" />
                <p className="text-xs text-gray-500 mt-1">Département, consultation, unité ou tout autre détail pour localiser précisément le lieu.</p>
              </div>
            )}
            
            {/* NPA coherence check */}
            {data.postalCode && data.canton && (() => {
              const hint = getNpaHint(data.postalCode, data.canton);
              if (!hint) return null;
              return (
                <div>
                  <div className={`rounded-lg p-3 flex items-start gap-2 text-sm ${hint.match ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                    {hint.match ? <CheckCircle className="w-4 h-4 flex-shrink-0 mt-0.5" /> : <AlertTriangle className="w-4 h-4 flex-shrink-0 mt-0.5" />}
                    <span>{hint.message}</span>
                  </div>
                  {!hint.match && (
                    <div className="mt-2">
                      <label className="block text-sm font-medium text-amber-800 mb-1">{isPro ? 'Pourquoi cet établissement se trouve-t-il dans un autre canton que votre domicile ?' : 'Pourquoi consultez-vous dans un autre canton ?'}</label>
                      <textarea value={data.npaJustification || ''} onChange={e => setData({...data, npaJustification: e.target.value})}
                        placeholder={isPro ? "Ex : j'y travaille, remplacement, formation, garde..." : "Ex : centre de référence, suivi spécialisé, proximité du lieu de travail, urgence lors d'un déplacement..."}
                        className="w-full border-2 border-amber-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:border-amber-400 focus:outline-none resize-none" rows="2" />
                      <p className="text-xs text-amber-600 mt-1">Facultatif mais utile pour la modération. Cette justification n'est pas rendue publique.</p>
                    </div>
                  )}
                </div>
              );
            })()}
            
          </div>
        )}

        {/* Step 4: Moment */}
        {step === 4 && (
          <div className="space-y-4">
            <h2 className="text-lg font-semibold mb-1">Quand cela s'est-il passé ?</h2>
            <p className="text-sm text-gray-600">Pas besoin d’une date précise, une estimation suffit. Les discriminations prennent souvent la forme de faits répétés sur une longue période, difficiles à dater.</p>
            <div>
              <div className="space-y-3">
                <Select 
                  label="Type de période" required 
                  value={data.dateType || ''} 
                  onChange={v => setData({...data, dateType: v})} 
                  options={[
                    { value: 'single', label: 'Un incident précis (date connue)' },
                    { value: 'recent', label: 'Récemment (dernières semaines)' },
                    { value: 'period', label: 'Sur une période (plusieurs mois/années)' },
                    { value: 'ongoing', label: 'Situation continue / répétée' },
                    { value: 'unknown', label: 'Je ne me souviens plus' },
                  ]} 
                  placeholder="Choisir..." 
                />
                
                {data.dateType === 'single' && (
                  <div className="grid grid-cols-2 gap-4">
                    <Input label="Date (si connue)" type="date" value={data.date || ''} onChange={v => setData({...data, date: v})} />
                    <Input label="Heure (optionnel)" type="time" value={data.time || ''} onChange={v => setData({...data, time: v})} />
                  </div>
                )}
                
                {data.dateType === 'period' && (
                  <div className="grid grid-cols-2 gap-4">
                    <Input label="Depuis environ" type="month" value={data.dateFrom || ''} onChange={v => setData({...data, dateFrom: v})} />
                    <Input label="Jusqu'à environ" type="month" value={data.dateTo || ''} onChange={v => setData({...data, dateTo: v})} />
                  </div>
                )}
                
                {(data.dateType === 'ongoing' || data.dateType === 'period') && (
                  <TextArea 
                    label="Précisions sur la période (optionnel)" 
                    value={data.datePrecision || ''} 
                    onChange={v => setData({...data, datePrecision: v})} 
                    placeholder="Ex: Depuis mon arrivée dans ce service il y a 2 ans, plusieurs fois par mois..." 
                    rows={2}
                  />
                )}
              </div>
            </div>
          </div>
        )}

        {/* Step 4: Type d'incident */}
        {step === 5 && (
          <div>
            <h2 className="text-lg font-semibold mb-4">Type d'incident</h2>
            <p className="text-sm text-gray-600 mb-4">{rt.step4Sub}</p>
            <div className="space-y-2 mb-4">
              {(isPro && data.source ? incidentTypes.professional[data.source] : incidentTypes.patient).map(type => (
                <button key={type} onClick={() => setData({...data, incidentType: type, otherIncidentType: type === 'Autre' ? data.otherIncidentType : ''})} className={`w-full p-3 rounded-xl border-2 text-left transition-colors ${data.incidentType === type ? 'border-teal-500 bg-teal-50' : 'border-gray-200 hover:border-gray-300'}`}>
                  {type}
                </button>
              ))}
            </div>
            {data.incidentType === 'Autre' && (
              <div className="mt-4 p-4 bg-gray-50 rounded-xl">
                <TextArea 
                  label="Précisez le type d'incident" 
                  value={data.otherIncidentType || ''} 
                  onChange={v => setData({...data, otherIncidentType: v})} 
                  placeholder="Décrivez brièvement le type d'incident..."
                  rows={2}
                  required
                />
              </div>
            )}
          </div>
        )}

        {/* Step 5: Motifs de discrimination */}
        {step === 6 && (
          <div>
            <h2 className="text-lg font-semibold mb-2">Motifs perçus de discrimination</h2>
            
            <div className="bg-blue-50 rounded-xl p-4 mb-4 border border-blue-100">
              <p className="text-sm text-blue-900 mb-2"><strong>Qu'est-ce qu'un « motif » de discrimination ?</strong></p>
              <p className="text-sm text-blue-800 mb-2">{rt.step5Explain}</p>
              <p className="text-sm text-blue-700">{rt.step5Ressenti}</p>
            </div>

            <p className="text-sm text-gray-600 mb-4">{rt.step5Sub}</p>
            
            {groundCategories.map(cat => (
              <div key={cat} className="mb-4">
                <p className="text-sm font-bold text-gray-500 uppercase tracking-wide mb-2">{cat}</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {discriminationGrounds.filter(g => g.category === cat).map(g => {
                    const selected = (data.grounds || []).includes(g.id);
                    return (
                      <button key={g.id} type="button" onClick={() => {
                        const current = data.grounds || [];
                        if (selected) { setData({...data, grounds: current.filter(x => x !== g.id)}); }
                        else { setData({...data, grounds: [...current, g.id]}); }
                      }} className={`p-3 rounded-xl border-2 text-left transition-all flex items-center gap-2 ${selected ? 'border-teal-500 bg-teal-50' : 'border-gray-200 hover:border-gray-300'}`}>
                        <span className={`text-sm ${selected ? 'font-medium text-teal-800' : 'text-gray-700'}`}>{g.label}</span>
                        {selected && <CheckCircle className="w-4 h-4 text-teal-600 ml-auto flex-shrink-0" />}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}

            {data.grounds && data.grounds.includes('other-ground') && (
              <div className="mt-3">
                <TextArea label="Précisez le motif perçu" value={data.otherGround || ''} onChange={v => setData({...data, otherGround: v})} placeholder="Décrivez ce qui, selon vous, a pu motiver le traitement différencié..." rows={2} />
              </div>
            )}

            {(data.grounds || []).length >= 2 && (
              <div className="mt-4 p-4 rounded-xl bg-indigo-50 border border-indigo-200">
                <div className="flex items-start gap-2.5">
                  <Info className="w-5 h-5 text-indigo-600 flex-shrink-0 mt-0.5" />
                  <div>
                    <p className="text-sm font-medium text-indigo-900 mb-1">Croisement de motifs (intersectionnalité)</p>
                    <p className="text-sm text-indigo-700 mb-2">Vous avez identifié {(data.grounds || []).length} motifs possibles. En pratique, les discriminations se vivent rarement pour une seule raison. Une personne peut être traitée différemment non pas « juste » à cause de sa couleur de peau ou « juste » à cause de son âge, mais parce que ces caractéristiques se combinent et créent une expérience spécifique.</p>
                    <p className="text-sm text-indigo-700 mb-2">C'est ce qu'on appelle l'<strong>intersectionnalité</strong> : l'idée que nos identités (origine, genre, état de santé, situation sociale...) ne s'additionnent pas simplement mais interagissent entre elles. Comprendre ces croisements aide à mieux cibler les actions de prévention.</p>
                    <a href="https://ligue-enseignement.be/education-enseignement/articles/la-ligue/la-roue-des-privileges-un-outil-pour-deconstruire-les-discriminations" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-sm text-indigo-600 hover:text-indigo-800 font-medium underline">Comprendre avec la Roue des privilèges <ExternalLink className="w-3 h-3" /></a>
                  </div>
                </div>
              </div>
            )}

            {(data.grounds || []).length > 0 && (
              <div className="flex flex-wrap gap-1.5 mt-3">
                {(data.grounds || []).map(gId => {
                  const g = discriminationGrounds.find(x => x.id === gId);
                  return g ? (
                    <span key={gId} className="inline-flex items-center gap-1 px-2.5 py-1 bg-teal-100 text-teal-800 rounded-full text-xs font-medium">
                      {g.label}
                      <button type="button" onClick={() => setData({...data, grounds: (data.grounds || []).filter(x => x !== gId)})} className="ml-0.5 text-teal-500 hover:text-teal-700">×</button>
                    </span>
                  ) : null;
                })}
              </div>
            )}

            <div className="mt-4 p-3 bg-gray-50 rounded-xl">
              <p className="text-sm text-gray-600"><strong>Pourquoi cette question ?</strong> Documenter les motifs perçus permet d'identifier des tendances et d'orienter la prévention. Ces données sont toujours anonymes et agrégées — elles ne sont jamais utilisées pour porter un jugement individuel.</p>
            </div>
          </div>
        )}

        {/* Step 6: DMS (patient only) */}
        {step === 7 && !isPro && (
          <div>
            <h2 className="text-lg font-semibold mb-2">{dmsTitle.h}</h2>
            <p className="text-sm text-gray-600 mb-4">{dmsTitle.p}</p>
            <div className="space-y-4">
              {dmsQuestions.map((q, i) => (
                <div key={i} className="p-3 rounded-xl bg-gray-50">
                  <p className="text-sm mb-2">{i+1}. {q}</p>
                  <div className="flex flex-wrap gap-1.5">
                    {['Jamais', 'Rarement', 'Parfois', 'Souvent', 'Toujours'].map(opt => (
                      <button key={opt} onClick={() => setDms({...dms, [i]: opt})} className={`py-1.5 px-3 rounded-lg text-xs font-medium transition-colors ${dms[i] === opt ? 'bg-teal-500 text-white shadow-sm' : 'bg-white border hover:bg-gray-50'}`}>
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Aide et ressources - Patient·e */}
        {step === S.aide && !isPro && (
          <div className="space-y-4">
            <h2 className="text-lg font-semibold mb-1">Aide et ressources</h2>
            <p className="text-sm text-gray-600">Ces structures sont indépendantes de CareWatch™. Rien n’est transmis, ce sont des informations pour vous.</p>
            
            <div className="bg-indigo-50 rounded-xl p-4">
              <p className="text-sm text-indigo-800">
                <strong>Vous n'êtes pas seul·e.</strong> Des structures d'aide gratuite et confidentielle existent pour vous accompagner.
              </p>
            </div>

            <Card className="p-4">
              <h3 className="font-medium mb-3 flex items-center gap-2"><Heart className="w-5 h-5 text-indigo-600" /> Centre LAVI</h3>
              <p className="text-sm text-gray-600 mb-3">Aide gratuite aux victimes d'infractions : accompagnement juridique, psychologique et financier.</p>
              <div className="flex flex-wrap gap-2">
                <a href="tel:+41223200102" className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-medium">GE : 022 320 01 02</a>
                <a href="tel:+41216310300" className="px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-lg text-sm font-medium">VD : 021 631 03 00</a>
                <a href="tel:142" className="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-sm font-medium">142 : aide aux victimes de violences, 24h/24, gratuit</a>
              </div>
            </Card>

            <Card className="p-4">
              <h3 className="font-medium mb-3 flex items-center gap-2"><Users className="w-5 h-5 text-amber-600" /> Pair·e·s aidant·e·s & soutien communautaire</h3>
              <p className="text-sm text-gray-600 mb-3">Échangez avec des personnes — patient·e·s ou professionnel·le·s — ayant vécu des situations similaires.</p>
              <div className="space-y-2">
                {[
                  { name: 'APSR-GE', desc: 'Pair-aidance entre professionnel·le·s de santé racisé·e·s', url: 'https://www.instagram.com/apsr.9446/', urlLabel: 'Instagram' },
                  { name: 'Suisse Drépano', desc: 'Soutien aux patient·e·s drépanocytaires et à leurs proches', url: 'https://www.suissedrepano.ch', urlLabel: 'Site web' },
                  { name: 'Resilia (KimboCare)', desc: 'Navigation dans le système de santé suisse', url: 'https://resilia.kimbocare.com', urlLabel: 'Site web' },
                ].map(assoc => (
                  <a key={assoc.name} href={assoc.url} target="_blank" rel="noopener noreferrer" className="block p-3 rounded-lg bg-white border border-gray-200 hover:border-amber-300 transition-colors">
                    <div className="flex items-center gap-2 mb-1">
                      <Users className="w-4 h-4 text-amber-600 flex-shrink-0" />
                      <span className="font-medium text-sm text-gray-900">{assoc.name}</span>
                      <span className="ml-auto text-sm text-amber-600 font-medium flex items-center gap-1 flex-shrink-0">{assoc.urlLabel} <ExternalLink className="w-3 h-3" /></span>
                    </div>
                    <p className="text-sm text-gray-600 pl-6">{assoc.desc}</p>
                  </a>
                ))}
              </div>
              <p className="text-xs text-gray-500 mt-3">Pour qu’une personne pair-aidante vous contacte, indiquez-le à l’étape suivante, « Suivi ».</p>
            </Card>

          </div>
        )}

        {/* Aide et ressources - Professionnel·le */}
        {step === S.aide && isPro && (
          <div className="space-y-4">
            <h2 className="text-lg font-semibold mb-1">Aide et ressources</h2>
            
            <div className="bg-indigo-50 rounded-xl p-4">
              <p className="text-sm text-indigo-800">
                <strong>Votre signalement est presque prêt.</strong> Des structures d'aide existent également pour les professionnel·le·s témoins de discrimination.
              </p>
            </div>

            {/* Whistleblower protection — NEW */}
            <Card className="p-5 bg-gradient-to-br from-emerald-50 to-teal-50 border-emerald-200">
              <h3 className="font-bold mb-3 flex items-center gap-2 text-emerald-900"><Lock className="w-5 h-5 text-emerald-600" /> Protection des lanceurs et lanceuses d'alerte</h3>
              <p className="text-sm text-gray-700 mb-3">En tant que professionnel·le de santé, vous bénéficiez de protections légales spécifiques lorsque vous signalez des dysfonctionnements :</p>
              <div className="space-y-2 mb-3">
                {[
