function AccessCareView() {
  const { DB, setView, userType } = useApp();
  const [searchQuery, setSearchQuery] = useState('');
  const [activeTab, setActiveTab] = useState('equipment');
  useScrollOnChange(activeTab);
  const [selectedItem, setSelectedItem] = useState(null);
  const [selectedCanton, setSelectedCanton] = useState('');
  const [modalInst, setModalInst] = useState(null);
  const [expandedCats, setExpandedCats] = useState({});
  const [selectedCategory, setSelectedCategory] = useState('');

  const catalog = DB.accessCatalog;

  const tabColors = {
    equipment: { bg: 'bg-blue-100', text: 'text-blue-800', bgLight: 'bg-blue-100', bgExpanded: 'bg-blue-200', border: 'border-blue-400', bgPill: 'bg-blue-100', textPill: 'text-blue-800', bar: 'bg-blue-500' },
    rareDiseases: { bg: 'bg-purple-100', text: 'text-purple-800', bgLight: 'bg-purple-100', bgExpanded: 'bg-purple-200', border: 'border-purple-400', bgPill: 'bg-purple-100', textPill: 'text-purple-800', bar: 'bg-purple-500' },
    vulnerablePrograms: { bg: 'bg-amber-100', text: 'text-amber-800', bgLight: 'bg-amber-100', bgExpanded: 'bg-amber-200', border: 'border-amber-400', bgPill: 'bg-amber-100', textPill: 'text-amber-800', bar: 'bg-amber-500' },
    interpretation: { bg: 'bg-teal-100', text: 'text-teal-800', bgLight: 'bg-teal-100', bgExpanded: 'bg-teal-200', border: 'border-teal-400', bgPill: 'bg-teal-100', textPill: 'text-teal-800', bar: 'bg-teal-500' },
  };

  const tabs = [
    { id: 'equipment', label: 'Équipements', shortLabel: 'Équip.', icon: Activity, items: catalog.equipment },
    { id: 'rareDiseases', label: 'Pathologies rares & négligées', shortLabel: 'Patho.', icon: Heart, items: catalog.rareDiseases },
    { id: 'vulnerablePrograms', label: 'Pop. vulnérables', shortLabel: 'Vulnér.', icon: Users, items: catalog.vulnerablePrograms },
    { id: 'interpretation', label: 'Interprétariat', shortLabel: 'Interpr.', icon: Globe, items: catalog.interpretation },
  ];

  const tc = tabColors[activeTab];
  const currentTab = tabs.find(t => t.id === activeTab);
  const categories = [...new Set(currentTab.items.filter(i => i.category).map(i => i.category))].sort((a, b) => a.localeCompare(b, 'fr'));

  const filteredItems = currentTab.items
    .filter(item =>
      norm(item.name).includes(norm(searchQuery)) ||
      norm(item.desc || '').includes(norm(searchQuery)) ||
      (item.category && norm(item.category).includes(norm(searchQuery)))
    )
    .filter(item => !selectedCategory || item.category === selectedCategory)
    .sort((a, b) => a.name.localeCompare(b.name, 'fr'));

  const groupedItems = {};
  filteredItems.forEach(item => {
    const cat = item.category || 'Autres';
    if (!groupedItems[cat]) groupedItems[cat] = [];
    groupedItems[cat].push(item);
  });
  const sortedCats = Object.keys(groupedItems).sort((a, b) => a.localeCompare(b, 'fr'));
  const isSearching = searchQuery.length > 0;
  const toggleCat = (cat) => setExpandedCats(prev => ({ ...prev, [cat]: !prev[cat] }));
  const isCatExpanded = (cat) => isSearching || expandedCats[cat] || sortedCats.length === 1;

  const getInstitutionsForItem = (itemId) => {
    return DB.institutions.filter(inst => {
      const access = DB.accessByInstitution[inst.id];
      return access && access[activeTab] && access[activeTab].includes(itemId);
    }).filter(inst => !selectedCanton || inst.canton === selectedCanton);
  };
  const getInstitutionAccessCount = (instId) => {
    const access = DB.accessByInstitution[instId];
    return (access && access[activeTab]) ? access[activeTab].length : 0;
  };
  const topInstitutions = DB.institutions
    .map(inst => ({ ...inst, accessCount: getInstitutionAccessCount(inst.id) }))
    .filter(inst => inst.accessCount > 0)
    .filter(inst => !selectedCanton || inst.canton === selectedCanton)
    .sort((a, b) => b.accessCount - a.accessCount);

  const TabIcon = currentTab.icon;
  const rColors = { outstanding: 'bg-indigo-100 text-indigo-800', good: 'bg-teal-100 text-teal-800', requires_improvement: 'bg-amber-100 text-amber-800', inadequate: 'bg-slate-100 text-slate-800' };
  const rIconColors = { outstanding: 'bg-indigo-100', good: 'bg-teal-100', requires_improvement: 'bg-amber-100', inadequate: 'bg-slate-100' };
  const rIconText = { outstanding: 'text-indigo-700', good: 'text-teal-700', requires_improvement: 'text-amber-700', inadequate: 'text-slate-700' };

  // On mobile: when an item is selected, show detail view with back button
  const showMobileDetail = selectedItem !== null;

  const CatalogPanel = () => (
    <div>
      <h3 className="text-sm font-semibold text-gray-800 mb-2 flex items-center gap-2">
        <TabIcon className={"w-4 h-4 " + tc.text} />
        {currentTab.label} ({filteredItems.length})
      </h3>
      <div className="space-y-1">
        {sortedCats.map(cat => {
          const items = groupedItems[cat];
          const expanded = isCatExpanded(cat);
          return (
            <div key={cat}>
              <button onClick={() => toggleCat(cat)} className={"w-full flex items-start justify-between gap-2 px-3 py-3 rounded-lg text-xs font-bold uppercase tracking-wide transition-colors " + (expanded ? tc.bgExpanded + " " + tc.text : "bg-gray-100 text-gray-600 hover:bg-gray-200")}>
                <span className="text-left">{cat} ({items.length})</span>
                <ChevronRight className={"w-4 h-4 flex-shrink-0 mt-0.5 transition-transform " + (expanded ? "rotate-90" : "")} />
              </button>
              {expanded && (
                <div className="space-y-0.5 py-1">
                  {items.map(item => {
                    const instCount = getInstitutionsForItem(item.id).length;
                    const isSelected = selectedItem === item.id;
                    return (
                      <button key={item.id} onClick={() => setSelectedItem(isSelected ? null : item.id)}
                        className={`w-full text-left px-3 py-3 rounded-lg border-2 transition-all ${isSelected ? tc.border + ' ' + tc.bgLight + ' shadow-sm' : 'border-transparent hover:bg-gray-50'}`}>
                        <div className="flex items-start justify-between gap-2">
                          <span className={`text-sm font-medium text-left ${isSelected ? tc.text : 'text-gray-900'}`}>{item.name}</span>
                          <span className={`text-xs font-semibold px-2 py-0.5 rounded-full flex-shrink-0 mt-0.5 ${instCount > 0 ? tc.bgPill + ' ' + tc.textPill : 'bg-gray-200 text-gray-500'}`}>
                            {instCount}
                          </span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        {filteredItems.filter(i => !i.category).length > 0 && !sortedCats.length && (
          <div className="space-y-0.5">
            {filteredItems.filter(i => !i.category).map(item => {
              const instCount = getInstitutionsForItem(item.id).length;
              const isSelected = selectedItem === item.id;
              return (
                <button key={item.id} onClick={() => setSelectedItem(isSelected ? null : item.id)}
                  className={`w-full text-left px-3 py-3 rounded-lg border-2 transition-all ${isSelected ? tc.border + ' ' + tc.bgLight + ' shadow-sm' : 'border-transparent hover:bg-gray-50'}`}>
                  <div className="flex items-start justify-between gap-2">
                    <span className={`text-sm font-medium text-left ${isSelected ? tc.text : 'text-gray-900'}`}>{item.name}</span>
                    <span className={`text-xs font-semibold px-2 py-0.5 rounded-full flex-shrink-0 mt-0.5 ${instCount > 0 ? tc.bgPill + ' ' + tc.textPill : 'bg-gray-200 text-gray-500'}`}>
                      {instCount}
                    </span>
                  </div>
                </button>
              );
            })}
          </div>
        )}
        {filteredItems.length === 0 && (
          <p className="text-sm text-gray-500 text-center py-8">Aucun résultat pour cette recherche.</p>
        )}
      </div>
    </div>
  );

  const DetailPanel = () => {
    if (!selectedItem) {
      // Ranking view
      return (
        <div>
          <h3 className="text-sm font-semibold text-gray-800 mb-3">Classement — {currentTab.label.toLowerCase()}</h3>
          {topInstitutions.length > 0 ? (
            <div className="space-y-2">
              {topInstitutions.map((inst, idx) => {
                const access = DB.accessByInstitution[inst.id];
                const totalForTab = currentTab.items.length;
                const pct = Math.round((inst.accessCount / totalForTab) * 100);
                const rankColors = ['bg-yellow-100 text-yellow-800', 'bg-gray-200 text-gray-700', 'bg-orange-100 text-orange-800'];
                return (
                  <button key={inst.id} onClick={() => setModalInst(inst)} className="w-full text-left p-3 rounded-xl border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 transition-colors">
                    <div className="flex items-center gap-3 mb-2">
                      <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-sm font-bold flex-shrink-0 ${idx < 3 ? rankColors[idx] : 'bg-gray-100 text-gray-500'}`}>{idx + 1}</span>
                      <div className="flex-1 min-w-0">
                        <p className="font-medium text-sm text-gray-900">{inst.fullName}</p>
                        <p className="text-sm text-gray-700">{inst.city} ({inst.canton})</p>
                      </div>
                      <span className="text-sm font-bold text-gray-800 flex-shrink-0">{inst.accessCount}/{totalForTab}</span>
                    </div>
                    <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                      <div className={tc.bar + " h-full rounded-full transition-all"} style={{ width: `${pct}%` }} />
                    </div>
                    {access && access[activeTab] && (
                      <div className="flex flex-wrap gap-1 mt-2">
                        {access[activeTab].slice(0, 4).map(id => {
                          const catItem = currentTab.items.find(e => e.id === id);
                          return catItem ? <span key={id} className={tc.bgLight + " " + tc.text + " text-xs px-1.5 py-0.5 rounded font-medium"}>{catItem.name}</span> : null;
                        })}
                        {access[activeTab].length > 4 && <span className="text-sm text-gray-600 font-medium">+{access[activeTab].length - 4}</span>}
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
          ) : (
            <div className="text-center py-12">
              <Search className="w-8 h-8 text-gray-400 mx-auto mb-3" />
              <p className="text-sm text-gray-600">Aucun établissement trouvé.</p>
            </div>
          )}
        </div>
      );
    }

    // Item detail view
    const item = currentTab.items.find(i => i.id === selectedItem);
    const institutions = getInstitutionsForItem(selectedItem);
    if (!item) return null;

    return (
      <div>
        {/* Back button - mobile */}
        <button onClick={() => setSelectedItem(null)} className="md:hidden flex items-center gap-1.5 text-sm font-medium text-gray-600 mb-3 hover:text-gray-900">
          <ChevronRight className="w-4 h-4 rotate-180" /> Retour au catalogue
        </button>

        <div className={tc.bgLight + " rounded-xl p-4 mb-4 border " + tc.border}>
          <h3 className={"font-semibold text-base mb-1 " + tc.text}>{item.name}</h3>
          <p className="text-sm text-gray-800">{item.desc}</p>
          {item.category && <p className="text-sm text-gray-700 mt-1.5 font-medium">{item.category}</p>}
        </div>

        {institutions.length > 0 ? (
          <div className="space-y-2">
            <p className="text-sm font-semibold text-gray-800">{institutions.length} établissement{institutions.length > 1 ? 's' : ''}</p>
            {institutions.sort((a, b) => a.fullName.localeCompare(b.fullName, 'fr')).map(inst => {
              const access = DB.accessByInstitution[inst.id];
              const r = DB.ratings[inst.rating];
              return (
                <div key={inst.id} className="p-3 rounded-xl border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 transition-colors">
                  <button onClick={() => setModalInst(inst)} className="w-full text-left">
                    <div className="flex items-center gap-3">
                      <div className={"w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 " + (rIconColors[inst.rating] || 'bg-gray-100')}>
                        <Building className={"w-5 h-5 " + (rIconText[inst.rating] || 'text-gray-500')} />
                      </div>
                      <div className="flex-1 min-w-0">
                        <p className="font-medium text-sm text-gray-900">{inst.fullName}</p>
                        <p className="text-sm text-gray-700">{inst.city} ({inst.canton})</p>
                      </div>
                      <span className={"text-xs font-semibold px-2 py-0.5 rounded " + (rColors[inst.rating] || 'bg-gray-100 text-gray-500')}>{r ? r.label : '?'}</span>
                    </div>
                  </button>
                  {access && access.diseaseNotes && access.diseaseNotes[selectedItem] && (
                    <div className={"mt-2.5 p-3 rounded-lg text-sm leading-relaxed " + tc.bgLight + " " + tc.text}>
                      <div className="flex items-start gap-2">
                        <Info className="w-4 h-4 flex-shrink-0 mt-0.5" />
                        <span>{access.diseaseNotes[selectedItem]}</span>
                      </div>
                    </div>
                  )}
                  {access && (!access.diseaseNotes || !access.diseaseNotes[selectedItem]) && access.notes && (
                    <p className="text-sm text-gray-500 mt-2 italic leading-relaxed">{access.notes}</p>
                  )}
                </div>
              );
            })}
          </div>
        ) : (
          <div className="text-center py-12">
            <Search className="w-8 h-8 text-gray-400 mx-auto mb-3" />
            <p className="text-sm text-gray-600">Aucun établissement trouvé{selectedCanton ? ` dans le canton de ${DB.cantonNames[selectedCanton]}` : ''}.</p>
            {selectedCanton && <button onClick={() => setSelectedCanton('')} className="text-sm text-blue-700 mt-2 underline font-medium">Voir tous les cantons</button>}
          </div>
        )}
      </div>
    );
  };

  return (
    <div className="p-4 md:p-8">
      <div className="mb-5">
        <h2 className="text-xl font-bold text-gray-900 mb-1 flex items-center gap-2">
          <Stethoscope className="w-6 h-6 text-blue-700" />
          Accès aux soins spécialisés
        </h2>
        <p className="text-sm text-gray-600">Trouvez les équipements, consultations spécialisées et programmes disponibles en Suisse romande.</p>
        <p className="text-sm text-gray-500 mt-1 flex items-center gap-1.5"><Lock className="w-3.5 h-3.5 text-blue-600" /> Navigation anonyme — aucune donnée de consultation n'est enregistrée.</p>
      </div>

      {/* Filters */}
      <div className="flex flex-col sm:flex-row gap-2 mb-4">
        <div className="flex-1 relative">
          <Search className="w-4 h-4 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2" />
          <input type="text" value={searchQuery} onChange={e => { setSearchQuery(e.target.value); setSelectedItem(null); }}
            placeholder="Rechercher un soin, pathologie..."
            className="w-full pl-9 pr-4 py-2.5 border-2 border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        {categories.length > 1 && (
          <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)}
            className={`border-2 rounded-xl px-3 py-2.5 text-sm font-medium bg-white transition-colors ${selectedCategory ? tc.border + ' ' + tc.text : 'border-gray-200 text-gray-700'}`}>
            <option value="">Catégorie ({currentTab.items.length})</option>
            {categories.map(cat => {
              const count = currentTab.items.filter(i => i.category === cat).length;
              return <option key={cat} value={cat}>{cat} ({count})</option>;
            })}
          </select>
        )}
        <select value={selectedCanton} onChange={e => setSelectedCanton(e.target.value)} className="border-2 border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white font-medium">
          <option value="">Tous les cantons</option>
          {DB.cantons.map(c => <option key={c} value={c}>{DB.cantonNames[c]}</option>)}
        </select>
      </div>

      {/* Tabs */}
      <div className="ac-tabs mb-4">
        {tabs.map(tab => {
          const TIcon = tab.icon;
          const isActive = activeTab === tab.id;
          const tbc = tabColors[tab.id];
          return (
            <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedItem(null); setSearchQuery(''); setSelectedCategory(''); setExpandedCats({}); }}
              className={`px-3 py-2.5 rounded-xl text-sm font-semibold text-left transition-colors ${isActive ? tbc.bg + ' ' + tbc.text + ' shadow-sm' : 'text-gray-600 bg-gray-50 hover:bg-gray-100'}`}>
              <TIcon className="w-4 h-4 inline-block align-middle mr-1.5" />
              <span className="hidden sm:inline align-middle">{tab.label}</span>
              <span className="sm:hidden align-middle">{tab.shortLabel}</span>
            </button>
          );
        })}
      </div>

      {/* Desktop: side-by-side. Mobile: catalog or detail, not both */}
      <div className="hidden md:grid md:grid-cols-3 gap-4">
        <div className="md:col-span-1"><CatalogPanel /></div>
        <div className="md:col-span-2"><DetailPanel /></div>
      </div>
      <div className="md:hidden">
        {showMobileDetail ? <DetailPanel /> : <CatalogPanel />}
      </div>

      <div className="mt-6 bg-gray-100 rounded-xl p-4 border border-gray-200">
        <div className="flex items-start gap-3">
          <Info className="w-5 h-5 text-gray-500 flex-shrink-0 mt-0.5" />
          <div>
            <p className="text-sm text-gray-700">Ces données sont indicatives et basées sur les informations publiques des établissements. Contactez directement l'établissement pour confirmer la disponibilité.</p>
            <p className="text-sm text-gray-700 mt-1">Dernière mise à jour : janvier 2026. Sources : sites institutionnels, ERN EuroBloodNet, ORPHANET Suisse, kosek.</p>
          </div>
        </div>
      </div>

      {modalInst && <InstitutionModal institution={modalInst} onClose={() => setModalInst(null)} />}
    </div>
  );
}

function InstitutionsView() {
  const { showDemo, DB, searchQuery, setSearchQuery, selectedCanton, setSelectedCanton, selectedInstitution, setSelectedInstitution, setView, userType } = useApp();
  const [ratingFilter, setRatingFilter] = useState('');
  const [sortBy, setSortBy] = useState('rating');

  const filtered = DB.institutions.filter(i => {
    const matchSearch = norm(i.fullName).includes(norm(searchQuery)) || norm(i.city).includes(norm(searchQuery));
    const matchCanton = !selectedCanton || i.canton === selectedCanton;
    const matchRating = !ratingFilter || i.rating === ratingFilter;
    return matchSearch && matchCanton && matchRating;
  }).sort((a, b) => {
    if (sortBy === 'name') return a.fullName.localeCompare(b.fullName);
    if (sortBy === 'reports') return b.reports - a.reports;
    if (sortBy === 'rating') {
      const order = { outstanding: 0, good: 1, requires_improvement: 2, inadequate: 3 };
      return order[a.rating] - order[b.rating];
    }
    if (sortBy === 'rating-worst') {
      const order = { outstanding: 0, good: 1, requires_improvement: 2, inadequate: 3 };
      return order[b.rating] - order[a.rating];
    }
    if (sortBy === 'reliability') return b.reliability - a.reliability;
    return 0;
  });

  return (
    <div className="p-4 md:p-8">
      <div className="flex flex-col gap-3 mb-4">
        <div className="flex items-center justify-between">
          <h2 className="text-xl font-semibold">Établissements ({filtered.length})</h2>
        </div>
        <p className="text-sm text-gray-500 flex items-center gap-1.5"><Shield className="w-3.5 h-3.5 text-teal-600" /> Évaluations basées sur des données agrégées et anonymes. Consulter cette page ne laisse aucune trace.</p>
        <div className="flex flex-wrap gap-2">
          <Select value={selectedCanton} onChange={setSelectedCanton} options={DB.cantons.map(c => ({ value: c, label: DB.cantonNames[c] }))} placeholder="Canton" className="min-w-[8rem] flex-shrink-0" />
          <Select value={ratingFilter} onChange={setRatingFilter} options={Object.entries(DB.ratings).map(([k, v]) => ({ value: k, label: v.label }))} placeholder="Note" className="min-w-[9rem] flex-shrink-0" />
          <Select value={sortBy} onChange={setSortBy} options={[{ value: 'rating', label: 'Meilleure note' }, { value: 'rating-worst', label: 'Pire note' }, { value: 'reports', label: 'Plus de signalements' }, { value: 'name', label: 'Nom A-Z' }, { value: 'reliability', label: 'Fiabilité' }]} placeholder="Trier" className="min-w-[11rem] flex-shrink-0" />
          <div className="relative flex-1 min-w-48">
            <Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
            <input type="text" placeholder="Rechercher nom ou ville..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border text-sm" />
          </div>
        </div>
      </div>
      <div className="space-y-2">
        {filtered.map(i => (
          <Card key={i.id} className="p-4 flex items-center gap-4" onClick={() => setSelectedInstitution(i)}>
            <Building className={`w-5 h-5 text-${DB.ratings[i.rating].color}-500`} />
            <div className="flex-1 min-w-0">
              <p className="font-medium truncate">{i.fullName}</p>
              <p className="text-sm text-gray-600">{i.city} ({i.canton}) • {i.reports} signalement{i.reports === 1 ? '' : 's'}{showDemo ? ` • ${i.reliability}% fiabilité` : ` • ${i.verified} vérifié${i.verified === 1 ? '' : 's'}${i.positiveReports ? ` • ${i.positiveReports} positif${i.positiveReports === 1 ? '' : 's'}` : ''}${i.indice != null ? ` • indice d’équité ${i.indice}/100` : ''}`}</p>
            </div>
            <RatingBadge rating={i.rating} />
          </Card>
        ))}
        {filtered.length === 0 && (
          <Card className="p-8 text-center">
            <Building className="w-12 h-12 mx-auto mb-3 text-gray-400" />
            <p className="text-gray-500">Aucun établissement trouvé</p>
          </Card>
        )}
      </div>
    </div>
  );
}

function DirectoryView() {
  const { DB, setView, userType } = useApp();
  const [searchQuery, setSearchQuery] = useState('');
  const [selectedCanton, setSelectedCanton] = useState('');

  const professionals = [
    { name: 'Dr. Aminata Diallo', specialty: 'Médecine interne', city: 'Genève', canton: 'GE', languages: ['FR', 'Wolof', 'EN'], phone: '+41 22 xxx xx xx' },
    { name: 'Dr. Jean-Pierre Mukendi', specialty: 'Pédiatrie', city: 'Lausanne', canton: 'VD', languages: ['FR', 'Lingala', 'EN'], phone: '+41 21 xxx xx xx' },
    { name: 'Dr. Fatou Ndiaye', specialty: 'Gynécologie', city: 'Genève', canton: 'GE', languages: ['FR', 'Wolof', 'EN'], phone: '+41 22 xxx xx xx' },
    { name: 'Dr. Samuel Okonkwo', specialty: 'Psychiatrie', city: 'Fribourg', canton: 'FR', languages: ['FR', 'Igbo', 'EN'], phone: '+41 26 xxx xx xx' },
    { name: 'Dr. Marie-Claire Habimana', specialty: 'Médecine générale', city: 'Neuchâtel', canton: 'NE', languages: ['FR', 'Kinyarwanda', 'EN'], phone: '+41 32 xxx xx xx' },
  ];

  const filtered = professionals.filter(p => {
    const matchSearch = norm(p.name).includes(norm(searchQuery)) || norm(p.specialty).includes(norm(searchQuery));
    const matchCanton = !selectedCanton || p.canton === selectedCanton;
    return matchSearch && matchCanton;
  });

  return (
    <div className="p-4 md:p-8 max-w-2xl mx-auto">
      <h2 className="text-2xl font-bold mb-2">Annuaire des professionnel·le·s</h2>
      <p className="text-sm text-gray-500 mb-4 flex items-center gap-1.5"><Shield className="w-3.5 h-3.5 text-teal-600" /> Navigation anonyme — aucune trace de consultation n'est conservée.</p>
      <p className="text-gray-600 mb-6">Trouvez des soignant·e·s sensibilisé·e·s à l'équité culturelle</p>

      <div className="flex gap-2 mb-6">
        <div className="relative flex-1">
          <Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
          <input type="text" placeholder="Rechercher..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2 rounded-lg border text-sm" />
        </div>
        <Select value={selectedCanton} onChange={setSelectedCanton} options={DB.cantons.map(c => ({ value: c, label: DB.cantonNames[c] }))} placeholder="Canton" className="min-w-[8rem] flex-shrink-0" />
      </div>

      <div className="space-y-3">
        {filtered.map(p => (
          <Card key={p.name} className="p-4">
            <div className="flex items-start gap-4">
              <div className="w-12 h-12 rounded-full bg-teal-100 flex items-center justify-center text-teal-700 font-semibold">
                {p.name.split(' ').slice(1).map(n => n[0]).join('')}
              </div>
              <div className="flex-1">
                <h3 className="font-medium">{p.name}</h3>
                <p className="text-sm text-teal-600">{p.specialty}</p>
                <p className="text-sm text-gray-600">{p.city} ({p.canton})</p>
                <div className="flex gap-1 mt-2">
                  {p.languages.map(l => <span key={l} className="px-2 py-0.5 rounded bg-gray-100 text-xs">{l}</span>)}
                </div>
              </div>
              <a href={`tel:${p.phone.replace(/\s/g, '')}`} className="p-2 rounded-lg bg-teal-50 text-teal-600">
                <Phone className="w-5 h-5" />
              </a>
            </div>
          </Card>
        ))}
        {filtered.length === 0 && (
          <Card className="p-8 text-center">
            <Users className="w-12 h-12 mx-auto mb-3 text-gray-400" />
            <p className="text-gray-500">Aucun·e professionnel·le trouvé·e</p>
          </Card>
        )}
      </div>
    </div>
  );
}

function PLAFAModule() {
  const { setView, setLegalDocRequest, userType } = useApp();
  const [activeTab, setActiveTab] = useState('journal');
  useScrollOnChange(activeTab);
  const [entries, setEntries] = useState(() => { try { return JSON.parse(cwStore.get('cw_plafa') || '[]'); } catch (e) { return []; } });
  useEffect(() => { try { cwStore.set('cw_plafa', JSON.stringify(entries)); } catch (e) {} }, [entries]);
  const [newEntry, setNewEntry] = useState('');
  const [entryType, setEntryType] = useState('etat');
  const [trustedPerson, setTrustedPerson] = useState({ name: '', phone: '', email: '', relation: '' });
  const [trustedPersonSaved, setTrustedPersonSaved] = useState(false);
  const [preDoc, setPreDoc] = useState({ context: '', fears: '', interactions: '', witnesses: '', currentState: '', medications: '' });
  const [preDocSaved, setPreDocSaved] = useState(false);
  const [showLegalDetail, setShowLegalDetail] = useState(null);
      const [urgencyLevel, setUrgencyLevel] = useState('');
    const [directive, setDirective] = useState({ cognitiveBaseline: '', fears: '', values: '', refusals: '', medications: '', witnesses: '', signed: false });
    const [directiveSaved, setDirectiveSaved] = useState(false);
    const [directiveSignedDate, setDirectiveSignedDate] = useState(null);

  const addEntry = () => {
    if (!newEntry.trim()) return;
    const entry = {
      id: Date.now(),
      timestamp: new Date().toISOString(),
      displayTime: new Date().toLocaleString('fr-CH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      type: entryType,
      content: newEntry,
      hash: btoa(newEntry + Date.now()).slice(0, 16)
    };
    setEntries([entry, ...entries]);
    setNewEntry('');
  };

  const entryTypes = {
    etat: { label: 'État personnel', color: 'teal', icon: Heart, desc: 'Mon état physique et mental actuel' },
    interaction: { label: 'Interaction médicale', color: 'amber', icon: Stethoscope, desc: 'Échange avec un·e soignant·e' },
    crainte: { label: 'Crainte / Alerte', color: 'rose', icon: AlertTriangle, desc: 'Situation préoccupante' },
    preuve: { label: 'Élément de preuve', color: 'indigo', icon: FileText, desc: 'Document, témoin, fait objectif' },
    contexte: { label: 'Contexte', color: 'gray', icon: Info, desc: 'Information contextuelle' },
  };

  const legalArticles = [
    { art: 'Art. 426 CC', title: 'Conditions du placement', content: 'Une personne peut être placée dans une institution appropriée lorsque, en raison de troubles psychiques, d\'une déficience mentale ou d\'un grave état d\'abandon, l\'assistance ou le traitement nécessaires ne peuvent lui être fournis d\'une autre manière.', key: 'La charge de la preuve incombe à l\'autorité qui ordonne le placement. Le placement doit être proportionné et subsidiaire (dernier recours).' },
    { art: 'Art. 427 CC', title: 'PLAFA médical (placement par un médecin)', content: 'Les cantons peuvent habiliter des médecins à ordonner un placement pour une durée maximale fixée par le droit cantonal (généralement 6 semaines). Ce placement doit être levé dès que les conditions ne sont plus remplies.', key: 'Un·e seul·e médecin peut décider. C\'est ici que le risque d\'abus est le plus élevé. La documentation préalable est cruciale.' },
    { art: 'Art. 428 CC', title: 'Droits de la personne placée', content: 'La personne concernée et ses proches peuvent en tout temps demander la levée du placement. L\'institution doit examiner cette demande sans délai.', key: 'Vous conservez vos droits pendant le placement. La demande de levée ne peut pas être ignorée.' },
    { art: 'Art. 429 CC', title: 'Droit à une personne de confiance', content: 'La personne concernée peut faire appel à une personne de confiance qui l\'assiste pendant la durée du séjour et jusqu\'au terme des procédures en rapport avec celui-ci.', key: 'Désignez votre personne de confiance AVANT un éventuel placement. C\'est un droit absolu.' },
    { art: 'Art. 439 CC', title: 'Recours au tribunal', content: 'La personne concernée ou un de ses proches peut, par écrit, recourir au tribunal compétent dans les 10 jours dès la notification de la décision de placement.', key: 'Délai de 10 jours. Le recours a un effet suspensif dans certains cantons. Agissez rapidement.' },
    { art: 'Art. 430 CC', title: 'Examen périodique', content: 'L\'autorité de protection examine le placement d\'office dans les six mois qui suivent le début du placement, puis à la fin de la première année, et ensuite au moins une fois par an.', key: 'Le placement n\'est pas permanent. Il doit être réévalué régulièrement.' },
  ];

  const cantonalAuthorities = [
    { canton: 'GE', name: 'Tribunal de protection de l\'adulte et de l\'enfant (TPAE)', phone: '+41 22 327 63 00', address: 'Rue des Glacis-de-Rive 6, 1207 Genève', delay: '10 jours' },
    { canton: 'VD', name: 'Justice de Paix', phone: '+41 21 316 15 55', address: 'Selon district', delay: '10 jours' },
    { canton: 'VS', name: 'Autorité de protection de l\'adulte et de l\'enfant (APEA)', phone: '+41 27 606 47 40', address: 'Selon district', delay: '10 jours' },
    { canton: 'FR', name: 'Justice de Paix', phone: '+41 26 304 15 80', address: 'Selon district', delay: '10 jours' },
    { canton: 'NE', name: 'Autorité de protection de l\'adulte et de l\'enfant (APEA)', phone: '+41 32 889 60 00', address: 'Selon localité', delay: '10 jours' },
    { canton: 'JU', name: 'Autorité de protection de l\'enfant et de l\'adulte (APEA)', phone: '+41 32 420 51 51', address: 'Rue du 24-Septembre 2, 2800 Delémont', delay: '10 jours' },
  ];

  const exportJournal = () => {
    const data = {
      metadata: { source: 'CareWatch™ - Module PLAFA', exported: new Date().toISOString(), entries_count: entries.length, trusted_person: trustedPerson.name ? trustedPerson : null, pre_documentation: preDocSaved ? preDoc : null },
      entries: entries.map(e => ({ timestamp: e.timestamp, type: e.type, type_label: entryTypes[e.type]?.label, content: e.content, hash: e.hash }))
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `carewatch_plafa_journal_${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="p-4 md:p-8 max-w-3xl mx-auto">
      {/* Header d'alerte */}
      <div className="bg-gradient-to-r from-rose-50 to-amber-50 rounded-2xl p-5 mb-6 border border-rose-200">
        <div className="flex items-start gap-4">
          <div className="w-12 h-12 rounded-xl bg-rose-100 flex items-center justify-center flex-shrink-0">
            <Shield className="w-6 h-6 text-rose-600" />
          </div>
          <div>
            <h2 className="text-xl font-bold text-gray-900 mb-1">Protection PLAFA</h2>
            <p className="text-sm text-gray-600 mb-2">Module de documentation préventive contre les placements abusifs à des fins d'assistance (art. 426-439 CC)</p>
            <p className="text-sm text-rose-700 bg-rose-100 px-3 py-1 rounded-lg inline-block"><strong>Important :</strong> Ce journal horodaté crée une trace qui peut servir de preuve en cas de recours.</p>
            <p className="text-sm text-teal-700 bg-teal-50 px-3 py-1 rounded-lg inline-block mt-1"><Lock className="w-3.5 h-3.5 inline mr-1" /><strong>Confidentiel :</strong> Vos données sont stockées localement sur votre appareil. Aucune institution n'y a accès.</p>
          </div>
        </div>
      </div>

      {/* Urgence immédiate */}
      <Card className="p-4 bg-rose-50 border-rose-200 mb-6">
        <div className="flex items-start gap-3">
          <AlertTriangle className="w-5 h-5 text-rose-600 flex-shrink-0 mt-0.5" />
          <div>
            <p className="text-sm text-rose-800 font-medium mb-2">Vous faites face à un PLAFA en cours ?</p>
            <div className="flex flex-wrap gap-2">
              <a href="tel:+41223276300" className="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-sm font-medium">TPAE Genève : 022 327 63 00</a>
              <a href="tel:143" className="px-3 py-1.5 bg-amber-600 text-white rounded-lg text-sm font-medium">La Main Tendue : 143</a>
              <a href="tel:+41223200102" className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-medium">Centre LAVI : 022 320 01 02</a>
            </div>
            <p className="text-sm text-rose-700 mt-2">Vous avez <strong>10 jours</strong> pour recourir. Demandez immédiatement une personne de confiance (art. 429 CC).</p>
            <button onClick={() => { setLegalDocRequest('plafa'); setView('legal-guide'); }} className="mt-3 w-full py-2.5 px-4 rounded-xl bg-rose-700 text-white text-sm font-semibold hover:bg-rose-800 transition-colors flex items-center justify-center gap-2">
              <FileText className="w-4 h-4" /> Générer une opposition PLAFA (modèle pré-rempli)
            </button>
          </div>
        </div>
      </Card>

      {/* Tabs */}
      <div className="flex flex-wrap gap-2 mb-6">
        {[
          { id: 'directives', label: 'Directives anticipées', icon: ShieldCheck },
          { id: 'journal', label: 'Journal', icon: FileText },
          { id: 'predoc', label: 'Pré-documentation', icon: ClipboardList },
          { id: 'confiance', label: 'Personne de confiance', icon: Users },
          { id: 'legal', label: 'Cadre légal', icon: Scale },
          { id: 'recours', label: 'Recours', icon: Shield },
        ].map(tab => (
          <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2.5 rounded-lg font-semibold text-sm flex items-center gap-2 whitespace-nowrap ${activeTab === tab.id ? 'bg-rose-100 text-rose-700' : 'bg-gray-100 text-gray-600'}`}>
            <tab.icon className="w-4 h-4" />{tab.label}
          </button>
        ))}
      </div>

      {/* DIRECTIVES ANTICIPÉES D'ÉQUITÉ */}
      {activeTab === 'directives' && (
        <div className="space-y-4">
          <Card className="p-4 bg-gradient-to-r from-indigo-50 to-teal-50 border-indigo-200">
            <div className="flex items-start gap-3">
              <ShieldCheck className="w-6 h-6 text-indigo-600 flex-shrink-0 mt-0.5" />
              <div>
                <h3 className="font-semibold text-indigo-900 mb-1">Directives anticipées d'équité</h3>
                <p className="text-sm text-indigo-800">Inspirées de l'<strong>art. 370 CC</strong> (directives anticipées du patient), ce document établit <em>avant toute crise</em> votre état cognitif de référence, vos craintes et vos volontés. Il crée un <strong>baseline documenté</strong> qu'il est très difficile de contester rétroactivement.</p>
              </div>
            </div>
          </Card>

          <Card className="p-4 bg-amber-50 border-amber-100">
            <p className="text-sm text-amber-800">
              <strong>L'intérêt de cette démarche :</strong> L'asymétrie du PLAFA réside dans le fait que le médecin évalue au moment de la crise — quand vous êtes le plus vulnérable. Une directive anticipée renverse cette asymétrie en documentant votre lucidité et vos volontés <em>quand vous êtes en pleine possession de vos moyens</em>.
            </p>
          </Card>

          {directiveSaved ? (
            <Card className="p-6">
              <div className="text-center mb-4">
                <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-3">
                  <CheckCircle className="w-8 h-8 text-emerald-600" />
                </div>
                <h3 className="font-semibold text-lg text-gray-900">Directive anticipée enregistrée</h3>
                <p className="text-sm text-gray-600 mt-1">Signée le {directiveSignedDate}</p>
                <p className="text-xs font-mono text-gray-400 mt-1">Hash : {btoa((directive.cognitiveBaseline || '') + directiveSignedDate).slice(0, 24)}</p>
                <button onClick={() => navigator.clipboard?.writeText(btoa((directive.cognitiveBaseline || '') + directiveSignedDate).slice(0, 24))} className="mt-2 mx-auto flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-medium hover:bg-emerald-700 transition-colors">
                  <FileText className="w-3 h-3" /> Copier le hash
                </button>
              </div>

              <div className="space-y-3 mb-4">
                {directive.cognitiveBaseline && (
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600 font-medium mb-1">État cognitif de référence</p>
                    <p className="text-sm text-gray-700">{directive.cognitiveBaseline}</p>
                  </div>
                )}
                {directive.fears && (
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600 font-medium mb-1">Craintes spécifiques</p>
                    <p className="text-sm text-gray-700">{directive.fears}</p>
                  </div>
                )}
                {directive.values && (
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600 font-medium mb-1">Valeurs et volontés</p>
                    <p className="text-sm text-gray-700">{directive.values}</p>
                  </div>
                )}
                {directive.refusals && (
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600 font-medium mb-1">Refus explicites</p>
                    <p className="text-sm text-gray-700">{directive.refusals}</p>
                  </div>
                )}
              </div>

              <div className="flex gap-3">
                <Button size="sm" variant="outline" onClick={() => setDirectiveSaved(false)} icon={Edit}>Modifier</Button>
                <Button size="sm" variant="secondary" onClick={exportJournal} icon={Download}>Exporter (PDF)</Button>
              </div>

              <div className="mt-4 p-3 bg-rose-50 rounded-xl">
                <p className="text-sm text-rose-700"><strong>Transmettez ce document</strong> à votre personne de confiance (onglet dédié) et conservez-en une copie. En cas de PLAFA, il constitue une preuve de votre lucidité et de vos volontés au moment de la rédaction.</p>
              </div>
            </Card>
          ) : (
            <Card className="p-5">
              <h3 className="font-semibold mb-4">Rédiger mes directives anticipées d'équité</h3>
              <div className="space-y-4">

                <div className="bg-teal-50 rounded-xl p-3">
                  <p className="text-sm text-teal-700 font-medium mb-1">Section 1 — État cognitif de référence</p>
                  <p className="text-sm text-teal-600">Ce que vous décrivez ici constitue votre <em>baseline</em>. Un médecin qui allègue une « inaptitude soudaine » face à ce document aura un problème de crédibilité.</p>
                </div>
                <TextArea
                  label="Mon état cognitif actuel"
                  value={directive.cognitiveBaseline}
                  onChange={v => setDirective({...directive, cognitiveBaseline: v})}
                  placeholder="Je suis capable de : gérer mes finances, prendre des décisions médicales éclairées, comprendre les conséquences de mes choix. Je n'ai aucun trouble cognitif diagnostiqué. Mon médecin traitant Dr. X peut confirmer..."
                  rows={4}
                  required
                />

                <div className="bg-teal-50 rounded-xl p-3">
                  <p className="text-sm text-teal-700 font-medium mb-1">Section 2 — Craintes spécifiques</p>
                  <p className="text-sm text-teal-600">Nommez précisément ce que vous craignez. Un document qui anticipe exactement le scénario qui se produit a une force probante considérable.</p>
                </div>
                <TextArea
                  label="Mes craintes concernant un PLAFA ou un abus"
                  value={directive.fears}
                  onChange={v => setDirective({...directive, fears: v})}
                  placeholder="Je crains qu'un placement puisse être ordonné sur la base de : préjugés raciaux, un conflit avec le Dr. Y, une interprétation culturellement biaisée de mon comportement..."
                  rows={4}
                />

                <div className="bg-teal-50 rounded-xl p-3">
                  <p className="text-sm text-teal-700 font-medium mb-1">Section 3 — Valeurs et volontés</p>
                  <p className="text-sm text-teal-600">Ce que vous souhaitez qu'on respecte, même en situation de crise.</p>
                </div>
                <TextArea
                  label="Mes volontés en cas de crise"
                  value={directive.values}
                  onChange={v => setDirective({...directive, values: v})}
                  placeholder="En cas de crise, je souhaite : être accompagné·e par ma personne de confiance, que ma famille soit informée, être traité·e dans l'établissement X plutôt que Y, qu'un interprète soit présent si nécessaire..."
                  rows={3}
                />

                <div className="bg-teal-50 rounded-xl p-3">
                  <p className="text-sm text-teal-700 font-medium mb-1">Section 4 — Refus explicites</p>
                  <p className="text-sm text-teal-600">Ce que vous refusez expressément. Un refus documenté à l'avance est juridiquement plus fort qu'un refus exprimé en situation de crise.</p>
                </div>
                <TextArea
                  label="Ce que je refuse"
                  value={directive.refusals}
                  onChange={v => setDirective({...directive, refusals: v})}
                  placeholder="Je refuse expressément : tout placement sans consultation préalable de ma personne de confiance, toute médication sédative sans mon consentement éclairé, tout transfert vers l'établissement Z..."
                  rows={3}
                />

                <TextArea
                  label="Traitements en cours (optionnel)"
                  value={directive.medications}
                  onChange={v => setDirective({...directive, medications: v})}
                  placeholder="Liste de mes traitements actuels..."
                  rows={2}
                />

                <TextArea
                  label="Témoins pouvant attester de mon état actuel (optionnel)"
                  value={directive.witnesses}
                  onChange={v => setDirective({...directive, witnesses: v})}
                  placeholder="Nom, lien, coordonnées de personnes qui peuvent confirmer ma lucidité actuelle..."
                  rows={2}
                />

                {/* Signature */}
                <div className="border-t pt-4">
                  <div className="flex items-start gap-3 p-4 rounded-xl bg-gray-50 border-2 border-gray-200 hover:border-indigo-400 transition-colors cursor-pointer" onClick={() => setDirective({...directive, signed: !directive.signed})}>
                    <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-colors ${directive.signed ? 'bg-indigo-500 border-indigo-500' : 'border-gray-300'}`}>
                      {directive.signed && <Check className="w-4 h-4 text-white" />}
                    </div>
                    <label className="text-sm text-gray-700 cursor-pointer">
                      <span className="font-medium">Je certifie être en pleine possession de mes facultés</span> au moment de la rédaction de ce document. Je comprends sa portée juridique et souhaite qu'il soit pris en compte en cas de placement à des fins d'assistance (art. 370 CC par analogie).
                    </label>
                  </div>
                </div>

                <div className="bg-indigo-50 rounded-xl p-4">
                  <p className="text-sm text-indigo-800">
                    <strong>Valeur juridique :</strong> Par analogie avec les directives anticipées (art. 370 CC), ce document horodaté exprime vos volontés quand vous disposez de votre capacité de discernement. Tout médecin et toute institution est tenu d'en prendre connaissance avant d'ordonner un PLAFA.
                  </p>
                </div>

                <Button
                  onClick={() => {
                    const now = new Date().toLocaleString('fr-CH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    setDirectiveSignedDate(now);
                    setDirectiveSaved(true);
                  }}
                  className="w-full"
                  disabled={!directive.cognitiveBaseline || !directive.signed}
                >
                  Signer et enregistrer mes directives
                </Button>
              </div>
            </Card>
          )}
        </div>
      )}

      {/* JOURNAL DE BORD */}
      {activeTab === 'journal' && (
        <div className="space-y-4">
          <Card className="p-4 bg-teal-50 border-teal-100">
            <p className="text-sm text-teal-800">
              <strong>Pourquoi tenir ce journal ?</strong> Chaque entrée est horodatée et génère un identifiant unique. En cas de PLAFA contesté, ce journal constitue un faisceau d'indices concordants démontrant votre état et vos interactions avec le système de santé <em>avant</em> le placement.
            </p>
          </Card>

          {/* Nouvelle entrée */}
          <Card className="p-4">
            <h3 className="font-medium mb-3">Nouvelle entrée</h3>

function DossierAnalysis() {
  const { setView, userType } = useApp();
  const [files, setFiles] = useState([]);
  const [context, setContext] = useState('');
  const [analyzing, setAnalyzing] = useState(false);
  const [results, setResults] = useState(null);
  const [error, setError] = useState('');
  const [progress, setProgress] = useState('');

  const maxFiles = 20;

  const handleFiles = async (e) => {
    const newFiles = Array.from(e.target.files);
    const processed = [];
    for (const file of newFiles) {
      if (files.length + processed.length >= maxFiles) break;
      const isText = file.type === 'text/plain' || file.name.endsWith('.txt');
      const isDocx = file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || file.name.endsWith('.docx');
      
      if (isText) {
        const text = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => rej(new Error('Erreur de lecture'));
          r.readAsText(file);
        });
        processed.push({ name: file.name, size: file.size, type: 'text', textContent: text });
      } else if (isDocx) {
        const arrayBuffer = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => rej(new Error('Erreur de lecture'));
          r.readAsArrayBuffer(file);
        });
        try {
          const result = await mammoth.extractRawText({ arrayBuffer });
          processed.push({ name: file.name, size: file.size, type: 'text', textContent: result.value || '[Document vide]' });
        } catch {
          processed.push({ name: file.name, size: file.size, type: 'text', textContent: '[Erreur d\'extraction — essayez un PDF à la place]' });
        }
      } else {
        const base64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result.split(',')[1]);
          r.onerror = () => rej(new Error('Erreur de lecture'));
          r.readAsDataURL(file);
        });
        const isPdf = file.type === 'application/pdf';
        processed.push({
          name: file.name, size: file.size, type: file.type,
          base64, mediaType: isPdf ? 'application/pdf' : file.type,
          contentType: isPdf ? 'document' : 'image',
        });
      }
    }
    setFiles(prev => [...prev, ...processed]);
    e.target.value = '';
  };

  const removeFile = (idx) => setFiles(prev => prev.filter((_, i) => i !== idx));

  const analyze = async () => {
    if (files.length === 0) { setError('Veuillez ajouter au moins un document.'); return; }
    setAnalyzing(true);
    setError('');
    setResults(null);
    setProgress('Préparation des documents...');

    const systemPrompt = `Tu es un expert juridique et médical suisse spécialisé dans les droits des patient·e·s et l'analyse de dossiers médicaux. Tu analyses des documents de dossiers patients pour détecter des problèmes potentiels.

CADRE LÉGAL SUISSE À APPLIQUER :
- Code civil suisse art. 426-439 (PLAFA — placement à des fins d'assistance)
- LAMal art. 41-41a (libre choix de l'hôpital, garantie des soins)
- Loi sur les droits des patient·e·s (cantonale — GE: K 1 80, VD: LSP 810.01)
- Code des obligations art. 328, 336 (protection du travailleur, si professionnel)
- CEDH art. 3, 5, 8 (traitements inhumains, liberté, vie privée)

CATÉGORIES D'ANALYSE — examine chaque document pour :

1. **PLAFA / Mesures de contrainte** : Le placement est-il justifié ? Les conditions légales (danger grave, subsidiarité, proportionnalité) sont-elles remplies ? Le patient a-t-il été informé de ses droits de recours ? La durée est-elle proportionnée ?

2. **Incohérences documentaires** : Contradictions entre notes, diagnostics changeants sans justification, chronologie douteuse, informations manquantes cruciales.

3. **Décisions hâtives** : Évaluation insuffisante avant une décision lourde, absence d'avis secondaire, temps d'observation trop court.

4. **Discrimination perçue** : Langage stigmatisant, stéréotypes, traitement différentiel basé sur l'origine, le genre, la maladie, la langue, le statut social ou migratoire.

5. **Accusations sans preuve** : Allégations non documentées dans le dossier (ex. "patient agressif" sans description factuelle, "non compliant" sans contexte).

6. **Qualité des soins** : Retards de prise en charge, traitements inadaptés, absence de consentement éclairé, information insuffisante.

7. **Droits du patient** : Accès au dossier respecté ? Droit d'être entendu ? Personne de confiance informée ?

8. **Points positifs** : Bonnes pratiques identifiées, documentation soignée, respect des protocoles.

FORMAT DE RÉPONSE — Réponds UNIQUEMENT en JSON valide (pas de markdown, pas de backticks) :
{
  "summary": "Résumé en 2-3 phrases",
  "risk_level": "low|medium|high|critical",
  "findings": [
    {
      "category": "plafa|inconsistency|hasty_decision|discrimination|accusation_without_proof|quality|rights|positive",
      "severity": "info|warning|serious|critical",
      "title": "Titre court",
      "detail": "Description détaillée du problème identifié",
      "source": "Référence au document/page concerné si identifiable",
      "legal_basis": "Article de loi pertinent",
      "recommendation": "Recommandation concrète"
    }
  ],
  "legal_actions": ["Actions juridiques possibles si pertinent"],
  "next_steps": ["Prochaines étapes recommandées"]
}`;

    const userContent = [];
    files.forEach((f, i) => {
      if (f.type === 'text') {
        userContent.push({ type: 'text', text: `[Document ${i + 1}: ${f.name}]\n\n${f.textContent}` });
      } else {
        userContent.push({
          type: f.contentType,
          source: { type: 'base64', media_type: f.mediaType, data: f.base64 },
        });
        userContent.push({ type: 'text', text: `[Document ${i + 1}: ${f.name}]` });
      }
    });
    userContent.push({ 
      type: 'text', 
      text: `Analyse ces ${files.length} document(s) de dossier patient.${context ? '\n\nContexte fourni par la personne :\n' + context : ''}\n\nRéponds UNIQUEMENT en JSON valide.` 
    });

    try {
      setProgress('Analyse en cours par l\'IA...');
      let parsed;
      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 4000,
            system: systemPrompt,
            messages: [{ role: 'user', content: userContent }],
          }),
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'Erreur API');
        const text = data.content?.map(b => b.text || '').join('') || '';
        const clean = text.replace(/```json|```/g, '').trim();
        parsed = JSON.parse(clean);
      } catch (apiErr) {
        // API unavailable (standalone mode) — generate demo analysis
        console.log('API indisponible, mode démonstration:', apiErr.message);
        setProgress('API indisponible — génération d\'une analyse de démonstration...');
        await new Promise(r => setTimeout(r, 1500));
        parsed = {
          summary: `Analyse de démonstration basée sur ${files.length} document(s) importé(s). En production, l'IA analyserait le contenu réel de vos documents. Cette simulation illustre le type de résultats que vous obtiendriez.`,
          risk_level: 'moderate',
          findings: [
            { category: 'rights', severity: 'warning', title: 'Exemple : Défaut d\'information sur les droits', description: 'En production, l\'IA détecterait ici si le dossier mentionne que le/la patient·e a été informé·e de ses droits (droit de refuser un traitement, droit d\'accès au dossier, droit de désigner une personne de confiance).', legal_basis: 'LAMal art. 40 ; CC art. 377-381', recommendation: 'Vérifier que le consentement éclairé figure au dossier pour chaque acte significatif.' },
            { category: 'inconsistency', severity: 'info', title: 'Exemple : Chronologie à vérifier', description: 'L\'IA comparerait les dates des différents documents pour détecter des incohérences temporelles (ex. un compte-rendu daté avant la consultation, ou un traitement prescrit avant le diagnostic).', legal_basis: null, recommendation: 'Comparer les dates entre les différents documents du dossier.' },
            { category: 'quality', severity: 'info', title: 'Exemple : Documentation des décisions', description: 'L\'IA vérifierait que les décisions thérapeutiques importantes sont justifiées par écrit dans le dossier, avec les alternatives envisagées.', legal_basis: 'Droit cantonal de la santé', recommendation: 'Demander une explication écrite pour toute décision thérapeutique majeure.' },
            { category: 'positive', severity: 'info', title: 'Exemple : Point positif détecté', description: 'L\'IA identifierait aussi les éléments positifs du dossier : bonne tenue, explications claires, suivi régulier documenté.', legal_basis: null, recommendation: null }
          ],
          demo_mode: true
        };
      }
      setResults(parsed);
      setProgress('');
      setTimeout(() => scrollMainTop(), 100);
    } catch (err) {
      console.error(err);
      setError('Erreur lors de l\'analyse : ' + (err.message || 'Veuillez réessayer.'));
      setProgress('');
    }
    setAnalyzing(false);
  };

  const severityColors = {
    info: { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-800', badge: 'bg-blue-100 text-blue-700', label: 'Information' },
    warning: { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-800', badge: 'bg-amber-100 text-amber-700', label: 'Attention' },
    serious: { bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-800', badge: 'bg-orange-100 text-orange-700', label: 'Sérieux' },
    critical: { bg: 'bg-rose-50', border: 'border-rose-200', text: 'text-rose-800', badge: 'bg-rose-100 text-rose-700', label: 'Critique' },
  };

  const categoryLabels = {
    plafa: { label: 'PLAFA / Contrainte', icon: '⚖️' },
    inconsistency: { label: 'Incohérence', icon: '🔍' },
    hasty_decision: { label: 'Décision hâtive', icon: '⏱️' },
    discrimination: { label: 'Discrimination', icon: '🚫' },
    accusation_without_proof: { label: 'Accusation sans preuve', icon: '❓' },
    quality: { label: 'Qualité des soins', icon: '🏥' },
    rights: { label: 'Droits du patient', icon: '📋' },
    positive: { label: 'Point positif', icon: '✅' },
  };

  const riskColors = {
    low: { bg: 'bg-emerald-100', text: 'text-emerald-800', label: 'Faible' },
    medium: { bg: 'bg-amber-100', text: 'text-amber-800', label: 'Modéré' },
    high: { bg: 'bg-orange-100', text: 'text-orange-800', label: 'Élevé' },

  return (

      <div className="flex items-start gap-3 mb-6">
        <div className="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center flex-shrink-0">
          <FileSearch className="w-6 h-6 text-purple-600" />
        </div>
        <div>
          <h1 className="text-xl font-bold text-gray-900">Analyse de dossier patient</h1>
          <p className="text-gray-600 mt-1">Importez des pages de votre dossier médical — l'IA détecte les incohérences, injustices et violations de vos droits. <strong>Analyse confidentielle — documents non conservés.</strong></p>

      </div>

      {/* Privacy notice */}
      <Card className="p-4 bg-purple-50 border-purple-200 mb-6">
        <div className="flex gap-3">
          <Lock className="w-5 h-5 text-purple-600 flex-shrink-0 mt-0.5" />
          <div>
            <p className="text-sm text-purple-900 font-bold">Analyse anonyme et dé-identifiée</p>

      {!results ? (

          <Card className="p-5">

            <textarea

                { icon: '⏱️', label: 'Décisions hâtives', desc: 'Évaluation insuffisante' },
                { icon: '🚫', label: 'Discrimination', desc: 'Langage, traitement' },
                { icon: '❓', label: 'Accusations sans preuve', desc: 'Allégations non documentées' },
                { icon: '🏥', label: 'Qualité des soins', desc: 'Retards, protocoles' },
                { icon: '📋', label: 'Droits du patient', desc: 'Information, consentement' },
                { icon: '✅', label: 'Bonnes pratiques', desc: 'Points positifs identifiés' },
              ].map(c => (
                <div key={c.label} className="flex items-start gap-2 p-2">

              ))}
            </div>
          </Card>

          {error && (
            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-sm text-rose-700 flex items-start gap-2">

          <Button onClick={analyze} disabled={analyzing || files.length === 0} icon={FileSearch} className="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-50">

              <div className="flex-shrink-0">

                      </div>
                    </div>

                    {f.source && <p className="text-xs text-gray-500 mt-2 ml-7"><strong>Source :</strong> {f.source}</p>}
                    {f.legal_basis && <p className="text-xs text-indigo-600 mt-1 ml-7"><strong>Base légale :</strong> {f.legal_basis}</p>}

                      </div>
                    )}
                  </Card>
                );
              })}
            </div>
          </div>

          {/* Legal actions */}
          {results.legal_actions && results.legal_actions.length > 0 && (
            <Card className="p-5 bg-indigo-50 border-indigo-200">
              <h3 className="font-bold text-indigo-900 mb-3 flex items-center gap-2">
                <Shield className="w-5 h-5" /> Actions juridiques possibles
              </h3>
              <div className="space-y-2">
                {results.legal_actions.map((a, i) => (
                  <div key={i} className="flex items-start gap-2">
                    <span className="text-indigo-600 font-bold mt-0.5">•</span>
                    <p className="text-sm text-indigo-800">{a}</p>
                  </div>
                ))}
              </div>
            </Card>
          )}

          {/* Next steps */}
          {results.next_steps && results.next_steps.length > 0 && (
            <Card className="p-5 bg-teal-50 border-teal-200">
              <h3 className="font-bold text-teal-900 mb-3 flex items-center gap-2">
                <TrendingUp className="w-5 h-5" /> Prochaines étapes recommandées
              </h3>
              <div className="space-y-2">
                {results.next_steps.map((s, i) => (
                  <div key={i} className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-teal-200 text-teal-800 flex items-center justify-center flex-shrink-0 text-xs font-bold">{i + 1}</span>
                    <p className="text-sm text-teal-800">{s}</p>
                  </div>
                ))}
              </div>
            </Card>
          )}

          {/* Disclaimer */}
          <Card className="p-4 bg-amber-50 border-amber-200">
            <div className="flex gap-2">
              <AlertTriangle className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
              <div>
                <p className="text-sm text-amber-900 font-bold">Avertissement</p>
                <p className="text-sm text-amber-800 mt-1">Cette analyse est produite par une intelligence artificielle et ne constitue <strong>pas un avis juridique ni médical</strong>. Elle identifie des pistes à explorer avec un·e professionnel·le (avocat·e, médiateur·trice, association de patient·e·s). En cas de PLAFA, le délai de recours est de <strong>10 jours</strong> (art. 439 CC).</p>
                <p className="text-xs text-amber-700 mt-2 flex items-center gap-1"><Lock className="w-3 h-3" /> Vos documents et cette analyse ne sont ni stockés ni conservés. Aucune donnée n'a été transmise à CareWatch™.</p>
              </div>
            </div>
          </Card>

          {/* Actions */}
          <div className="flex flex-col sm:flex-row gap-3">
            <Button onClick={() => { setResults(null); setFiles([]); setContext(''); }} variant="outline" icon={Plus} className="flex-1">
              Nouvelle analyse
            </Button>
            <Button onClick={() => setView('rights')} icon={Shield} className="flex-1 bg-indigo-600 hover:bg-indigo-700">
              Consulter mes droits
            </Button>
          </div>
        </div>
      )}
    </div>
  );
}

  const generateDocument = (type) => {

    const codeRef = lastReport?.code ? `\nRéférence CareWatch™ : ${lastReport.code}` : '';

    const templates = {
      interne: `${expediteur}\n${adresseExp}\n${u.tel || '[Téléphone]'}\n${u.email || '[Email]'}\n\n${instName}\nÀ l\u2019attention de la Direction\n${addrs.direction.split('\n').slice(2).join('\n')}\n\n${adresseExp.split('\n').pop()}, le ${dateStr}\n\nObjet : Réclamation — traitement discriminatoire perçu\n${codeRef}\n\nMadame, Monsieur,\n\nJe me permets de vous écrire afin de porter à votre connaissance des faits survenus le ${dateIncident} au sein de votre établissement, dans le service ${serviceStr}.\n\n1. EXPOSÉ DES FAITS\n\n${descStr}\n\n2. MOTIFS DE DISCRIMINATION PERÇUS\n\nJ\u2019estime avoir été traité·e de manière différenciée en raison de : ${groundsStr}.\n\nJe précise qu\u2019il s\u2019agit de mon ressenti en tant que patient·e. Je ne porte pas d\u2019accusation mais souhaite que ces faits soient examinés.\n\n3. CONSÉQUENCES\n\n${impactStr}\n\n4. DEMANDES\n\nJe vous demande :\n— de prendre connaissance de cette réclamation et de l\u2019enregistrer conformément à votre procédure interne de gestion des plaintes ;\n— de me fournir une réponse écrite dans un délai de 30 jours ;\n— de prendre les mesures nécessaires pour éviter que de tels faits ne se reproduisent.\n\nJe me réserve le droit de saisir les autorités compétentes si cette réclamation ne devait pas recevoir de suite satisfaisante.\n\nJe vous prie d\u2019agréer, Madame, Monsieur, mes salutations distinguées.\n\n\n${expediteur}\n\nPièces jointes :\n— Résumé de signalement CareWatch™ (le cas échéant)\n— [Autres pièces justificatives]`,

      medcantonal: `${expediteur}\n${adresseExp}\n${u.tel || '[Téléphone]'}\n${u.email || '[Email]'}\n\n${addrs.medecin}\n\n${adresseExp.split('\n').pop()}, le ${dateStr}\n\nObjet : Signalement de dysfonctionnement — discrimination perçue dans les soins\n${codeRef}\n\nMonsieur le Médecin cantonal,\nMadame la Médecin cantonale,\n\nConformément aux dispositions de la loi cantonale sur la santé, je souhaite porter à votre connaissance les faits suivants.\n\n1. ÉTABLISSEMENT CONCERNÉ\n\n${instName}\nService : ${serviceStr}\nCanton : ${lastCantonLabel || '[Canton]'}\n\n2. FAITS\n\nLe ${dateIncident}, j\u2019ai vécu la situation suivante :\n\n${descStr}\n\n3. MOTIFS DE DISCRIMINATION PERÇUS\n\nJ\u2019estime avoir été traité·e de manière différenciée en raison de : ${groundsStr}.\n\nIl s\u2019agit de mon ressenti. Je ne formule pas d\u2019accusation mais signale une situation qui me paraît contraire aux droits des patient·e·s tels que garantis par la loi cantonale sur la santé.\n\n4. CONSÉQUENCES SUR MA PRISE EN CHARGE\n\n${impactStr}\n\n5. DÉMARCHES PRÉALABLES\n\n[Indiquez si vous avez déjà contacté l\u2019établissement, un médiateur, ou si c\u2019est votre première démarche.]\n\n6. DEMANDES\n\nJe vous demande :\n— d\u2019examiner ce signalement ;\n— de prendre, le cas échéant, les mesures administratives appropriées ;\n— de m\u2019informer de la suite donnée à ce signalement.\n\nJe reste à votre disposition pour tout complément d\u2019information.\n\nJe vous prie d\u2019agréer, Monsieur le Médecin cantonal / Madame la Médecin cantonale, l\u2019expression de mes salutations distinguées.\n\n\n${expediteur}\n\nPièces jointes :\n— Résumé de signalement CareWatch™ (le cas échéant)\n— Copie de la réclamation interne et de la réponse de l\u2019établissement (le cas échéant)\n— [Autres pièces justificatives]`,

      penal: `${expediteur}\n${adresseExp}\n${u.tel || '[Téléphone]'}\n${u.email || '[Email]'}\n\n${addrs.parquet}\n\n${adresseExp.split('\n').pop()}, le ${dateStr}\n\nObjet : Plainte pénale pour [discrimination raciale (art. 261bis CP) / injure (art. 177 CP) / contrainte (art. 181 CP) — adaptez selon votre cas]\n${codeRef}\n\nMonsieur le Procureur,\nMadame la Procureure,\n\nPar la présente, je dépose plainte pénale contre :\n\n— [Nom du/de la professionnel·le si connu] et/ou\n— Inconnu·e(s) au sein de ${instName}, service ${serviceStr}\n\npour les infractions suivantes : [précisez les articles applicables].\n\n1. FAITS\n\nLe ${dateIncident}, dans le service ${serviceStr} de ${instName} :\n\n${descStr}\n\n2. QUALIFICATION PÉNALE\n\n[Adaptez selon votre situation :]\n— Art. 261bis CP (discrimination raciale) si propos ou actes discriminatoires fondés sur l\u2019appartenance raciale, ethnique ou religieuse, tenus devant des tiers\n— Art. 177 CP (injure) si propos méprisants\n— Art. 181 CP (contrainte) si vous avez été contraint·e d\u2019accepter ou de refuser un acte contre votre volonté\n— Art. 312 CP (abus d\u2019autorité) si l\u2019auteur est un fonctionnaire public\n\n3. PREUVES\n\n— Signalement CareWatch™${lastReport?.code ? ' n° ' + lastReport.code : ''} (plateforme de veille en équité des soins)\n— [Témoins : noms et coordonnées]\n— [Documents médicaux]\n— [Photos, captures d\u2019écran]\n— [Autres]\n\n4. CONSTITUTION DE PARTIE PLAIGNANTE\n\nJe me constitue partie plaignante au sens de l\u2019art. 118 CPP et demande à être informé·e de toute décision relative à cette procédure.\n\n5. CONSÉQUENCES\n\n${impactStr}\n\nJe me réserve le droit de compléter cette plainte par des éléments supplémentaires.\n\nJe vous prie d\u2019agréer, Monsieur le Procureur / Madame la Procureure, l\u2019expression de mes salutations distinguées.\n\n\n${expediteur}\n\nPièces jointes :\n— [Liste des pièces]`,

      mediation: `${expediteur}\n${adresseExp}\n${u.tel || '[Téléphone]'}\n${u.email || '[Email]'}\n\n${addrs.mediation}\n\n${adresseExp.split('\n').pop()}, le ${dateStr}\n\nObjet : Demande de médiation\n${codeRef}\n\nMadame, Monsieur,\n\nJe souhaite recourir à vos services de médiation suite à une situation vécue le ${dateIncident} au sein de ${instName} (service ${serviceStr}).\n\n1. RÉSUMÉ DE LA SITUATION\n\n${descStr}\n\n2. CE QUE J\u2019AI RESSENTI\n\nJ\u2019ai perçu un traitement différencié possiblement lié à : ${groundsStr}.\n\n3. CE QUE J\u2019ATTENDS DE LA MÉDIATION\n\n— Être entendu·e et que mon vécu soit pris en compte\n— Comprendre ce qui s\u2019est passé du point de vue de l\u2019institution\n— Trouver un terrain d\u2019entente et, si possible, des garanties pour la suite de ma prise en charge\n\nJe reste à votre disposition pour un premier entretien.\n\nJe vous prie d\u2019agréer, Madame, Monsieur, mes salutations distinguées.\n\n\n${expediteur}`,

      dossier: `${expediteur}\n${adresseExp}\n${u.tel || '[Téléphone]'}\n${u.email || '[Email]'}\n\n${instName}\nService des archives médicales\n[Adresse de l\u2019établissement]\n\n${adresseExp.split('\n').pop()}, le ${dateStr}\n\nEnvoi recommandé\n\nObjet : Demande d\u2019accès à mon dossier médical\n(art. 25 LPD ; art. 40 let. f LPMéd ; loi cantonale sur la santé)\n\nMadame, Monsieur,\n\nConformément à la loi fédérale sur la protection des données (nLPD, art. 25) et aux dispositions cantonales applicables, je vous demande par la présente de me transmettre une copie complète de mon dossier médical.\n\nIdentification :\n— Nom, prénom : ${expediteur}\n— Date de naissance : [Votre date de naissance]\n— Numéro de patient (si connu) : [N° patient]\n— Période concernée : [du ... au ...]\n— Service(s) concerné(s) : ${serviceStr}\n\nJe souhaite recevoir :\n☐ L\u2019intégralité du dossier médical (notes médicales, résultats d\u2019examens, imagerie, protocoles opératoires, courriers, rapports)\n☐ Les notes infirmières et transmissions\n☐ Les prescriptions et ordonnances\n☐ Tout autre document me concernant\n\nFormat souhaité : [copie papier / format électronique sécurisé]\n\nConformément à la loi, je vous rappelle que :\n— Vous disposez d\u2019un délai de 30 jours pour répondre à cette demande ;\n— Le droit d\u2019accès ne peut être refusé que dans des cas très limités et motivés ;\n— En cas de refus, je me réserve le droit de saisir le Préposé cantonal à la protection des données.\n\nJe vous remercie de votre diligence et vous prie d\u2019agréer, Madame, Monsieur, mes salutations distinguées.\n\n\n${expediteur}\n\nAnnexe : copie d\u2019une pièce d\u2019identité`,

      plafa: `${expediteur}\n${adresseExp}\n${u.tel || '[Téléphone]'}\n\nTribunal de protection de l\u2019adulte et de l\u2019enfant\n${canton === 'GE' ? 'Rue des Glacis-de-Rive 6\n1207 Genève' : canton === 'VD' ? 'Justice de paix du district de [votre district]\n[Adresse]' : '[Tribunal compétent de votre canton]'}\n\n${adresseExp.split('\n').pop()}, le ${dateStr}\n\nPar la voie la plus rapide — URGENT\n\nObjet : Recours contre une décision de placement à des fins d\u2019assistance (PLAFA)\n(art. 439 CC — délai de 10 jours)\n\nMadame la Présidente / Monsieur le Président,\n\nPar la présente, je forme recours contre la décision de placement à des fins d\u2019assistance me concernant, rendue le [DATE DE LA DÉCISION] par [NOM DU MÉDECIN / DE L\u2019AUTORITÉ].\n\n1. RECEVABILITÉ\n\nLe présent recours est formé dans le délai de 10 jours prévu par l\u2019art. 439 CC.\n— Date de la décision : [DATE]\n— Date de notification : [DATE]\n— Date du présent recours : ${dateStr}\n\n2. CONCLUSIONS\n\nJe conclus :\n— principalement, à la levée immédiate du placement ;\n— subsidiairement, à l\u2019octroi de l\u2019effet suspensif et à mon audition personnelle.\n\n3. MOTIFS\n\n[Exposez pourquoi le placement n\u2019est pas ou plus justifié :]\n— Les conditions de l\u2019art. 426 CC ne sont pas (plus) remplies\n— [Mon état de santé ne justifie pas une privation de liberté]\n— [Des mesures moins restrictives sont possibles (traitement ambulatoire, aide à domicile)]\n— [Le principe de proportionnalité n\u2019est pas respecté]\n— [Autres motifs]\n\n4. DEMANDES ADDITIONNELLES\n\n— Je demande à être entendu·e personnellement (art. 450e CC)\n— Je demande la désignation d\u2019un·e avocat·e d\u2019office si nécessaire\n— Je demande que le tribunal statue dans les 5 jours ouvrables (art. 450e al. 3 CC)\n\n5. DOCUMENTATION PRÉALABLE\n\n[Si vous avez des directives anticipées, un journal CareWatch™, des attestations :]\n— Directives anticipées datées du [DATE]\n— Journal CareWatch™ (pièce jointe)\n— [Autres documents]\n\nJe vous prie d\u2019agréer, Madame la Présidente / Monsieur le Président, l\u2019expression de mes salutations distinguées.\n\n\n${expediteur}\n\nPièces jointes :\n— Copie de la décision de placement contestée\n— [Directives anticipées]\n— [Certificats médicaux]\n— [Journal CareWatch™]`,
    };

    return templates[type] || '';
  };

  const patientRights = [
    { id: 'soins', title: 'Droit à des soins équitables', icon: Heart, articles: ['Art. 8 Cst. (égalité)', 'Art. 41 al. 1 let. b Cst.', 'LAMal art. 25 ss'], content: 'Toute personne a droit à des soins de qualité, sans discrimination fondée sur l\'origine, la couleur de peau, la religion, le statut socio-économique, l\'orientation sexuelle ou le genre.', practical: 'Si vous constatez un traitement différencié, documentez-le factuellement : heure, lieu, service, comportement observé. Comparez avec le traitement d\'autres patient·e·s si possible.', delai: null },
    { id: 'dignite', title: 'Droit au respect de la dignité', icon: Shield, articles: ['Art. 7 Cst.', 'Art. 3 CEDH', 'Art. 28 CC'], content: 'La dignité humaine est inviolable. Elle doit être respectée et protégée dans tout cadre de soins. Cela inclut le respect de l\'intimité, de la pudeur, et des convictions personnelles.', practical: 'Les remarques dégradantes, les attitudes condescendantes, ou le manque de respect de votre intimité sont des atteintes à la dignité documentables.', delai: null },
    { id: 'information', title: 'Droit à l\'information', icon: Info, articles: ['Art. 10 CC', 'LPMéd art. 40 let. b-c'], content: 'Vous avez le droit d\'être informé·e de manière claire et compréhensible sur votre état de santé, les diagnostics, les traitements proposés, leurs risques et alternatives, ainsi que les coûts prévisibles.', practical: 'Si l\'information vous est refusée ou donnée de manière incompréhensible (sans interprète alors que nécessaire), c\'est une violation de ce droit. Demandez une explication écrite.', delai: null },
    { id: 'consentement', title: 'Droit au consentement éclairé', icon: CheckCircle, articles: ['Art. 10 al. 2 Cst.', 'CC art. 16, 17', 'ATF 117 Ib 197'], content: 'Aucun acte médical ne peut être pratiqué sans votre consentement libre et éclairé. Vous devez avoir reçu toutes les informations nécessaires pour décider. Le consentement doit être renouvelé pour chaque acte.', practical: 'Un consentement obtenu sous pression, sans information suffisante, ou dans une langue que vous ne comprenez pas n\'est pas valable. Refusez de signer si vous ne comprenez pas.', delai: null },
    { id: 'refus', title: 'Droit de refuser un traitement', icon: X, articles: ['Art. 10 al. 2 Cst.', 'ATF 134 II 235'], content: 'Toute personne capable de discernement peut refuser un traitement, même si ce refus met sa santé en danger. Le corps médical doit respecter ce choix après avoir informé des conséquences.', practical: 'Votre refus doit être respecté. Si on vous force à accepter un traitement, documentez-le immédiatement (date, heure, personnes présentes, traitement imposé).', delai: null },
