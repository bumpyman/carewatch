                  { art: 'CO art. 328', text: 'Votre employeur a l\'obligation légale de protéger votre personnalité. Un licenciement motivé par un signalement de bonne foi est abusif (CO art. 336).' },
                  { art: 'LTr art. 6', text: 'L\'employeur doit prendre toutes les mesures nécessaires pour protéger la santé et l\'intégrité personnelle des travailleurs et travailleuses.' },
                  { art: 'CP art. 261bis', text: 'La discrimination raciale est un délit pénal en Suisse. Signaler un fait pénalement répréhensible est un droit, pas une faute professionnelle.' },
                  { art: 'Jurisprudence fédérale', text: 'Le Tribunal fédéral reconnaît le droit de signaler des irrégularités aux autorités compétentes lorsque l\'employeur n\'a pas réagi (ATF 127 III 310).' },
                ].map((item, i) => (
                  <div key={i} className="flex items-start gap-2 bg-white/70 rounded-lg p-3">
                    <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded flex-shrink-0 mt-0.5">{item.art}</span>
                    <p className="text-sm text-gray-700">{item.text}</p>
                  </div>
                ))}
              </div>
              <div className="bg-emerald-100 rounded-lg p-3 border border-emerald-200">
                <p className="text-sm text-emerald-900 font-semibold">CareWatch™ renforce cette protection : aucun nom, aucun identifiant, aucune adresse IP conservée avec votre témoignage. Si votre témoignage décrit une situation trop spécifique, les détails sont automatiquement généralisés (dates, services) pour qu'il ne puisse pas être relié à une seule personne.</p>
              </div>
            </Card>

            <Card className="p-4">
              <h3 className="font-medium mb-3 flex items-center gap-2"><Heart className="w-5 h-5 text-indigo-600" /> Ressources</h3>
              <p className="text-sm text-gray-700 mb-2">Centre LAVI, Appartenances, Pluriels — accompagnement gratuit et confidentiel.</p>
              <a href="tel:+41223200102" className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-medium inline-block">Centre LAVI GE : 022 320 01 02</a>
              <a href="tel:142" className="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-sm font-medium inline-block ml-2">142 : aide aux victimes de violences, 24h/24</a>
            </Card>

            <Card className="p-4">
              <h3 className="font-medium mb-3 flex items-center gap-2"><Users className="w-5 h-5 text-amber-600" /> Pair-aidance entre professionnel·le·s</h3>
              <p className="text-sm text-gray-700 mb-2">L'APSR-GE propose un soutien entre pairs pour les soignant·e·s confronté·e·s à la discrimination.</p>
              <a href="https://www.instagram.com/apsr.9446/" target="_blank" rel="noopener noreferrer" className="block p-3 rounded-lg bg-amber-50 border border-amber-200 hover:bg-amber-100 transition-colors">
                <div className="flex items-center gap-2 mb-1">
                  <Users className="w-4 h-4 text-amber-600 flex-shrink-0" />
                  <span className="font-medium text-sm text-gray-900">APSR-GE</span>
                  <span className="ml-auto text-sm text-amber-600 font-medium flex items-center gap-1 flex-shrink-0">Instagram <ExternalLink className="w-3 h-3" /></span>
                </div>
                <p className="text-sm text-gray-700 pl-6">Réseau de professionnel·le·s de santé racisé·e·s</p>
              </a>
            </Card>

          </div>
        )}

        {/* Suivi */}
        {step === S.suivi && (
          <div className="space-y-4">
            <h2 className="text-lg font-semibold mb-1">Suivi</h2>
            <p className="text-sm text-gray-600">Deux questions, facultatives. Vos réponses n’influencent pas le traitement du signalement.</p>
            <SuiviCheckboxes data={data} setData={setData} partie="suivi" />
          </div>
        )}

        {/* Autorisations et envoi */}
        {step === S.autorisations && (
          <div className="space-y-4">
            <h2 className="text-lg font-semibold mb-1">Autorisations et envoi</h2>
            <SuiviCheckboxes data={data} setData={setData} partie="autorisations" />
            <TextArea label="Informations complémentaires (facultatif)" value={data.additionalInfo || ''} onChange={v => setData({...data, additionalInfo: v})} placeholder="Ce que vous souhaitez ajouter avant l’envoi." rows={3} />
          </div>
        )}

        {/* Confirmation - Enhanced Design */}
        {step === steps.length - 1 && code && (
          <div className="py-2">
            {/* Success Animation Container */}
            <div className="relative mb-6">
              <div className="absolute inset-0 flex items-center justify-center">
                <div className="w-32 h-32 bg-emerald-100 rounded-full animate-ping opacity-20" />
              </div>
              <div className="relative flex flex-col items-center">
                <div className="w-20 h-20 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/30 mb-4">
                  <CheckCircle className="w-10 h-10 text-white" />
                </div>
                <h2 className="text-2xl font-bold text-gray-900 mb-1">Merci pour votre témoignage</h2>
                <p className="text-gray-500 text-center">Votre signalement a été enregistré avec succès</p>
              </div>
            </div>
            
            <div className="flex gap-1.5 mb-5 justify-center">
              {['Vos codes', 'La suite', 'Ressources'].map((l, i) => (
                <button key={l} onClick={() => setPageConf(i)} className={`px-3 py-1.5 rounded-full text-sm font-medium ${pageConf === i ? 'bg-teal-600 text-white' : 'bg-gray-100 text-gray-700'}`}>{i + 1}. {l}</button>
              ))}
            </div>

            {pageConf === 0 && (<>
            {/* Code Card */}
            <div className="bg-gradient-to-br from-teal-50 to-emerald-50 rounded-2xl p-5 mb-5 border-2 border-teal-200">
              <p className="text-sm text-teal-700 text-center mb-2 font-medium">Votre code de suivi</p>
              <div className="bg-white rounded-xl p-4 shadow-sm border border-teal-100">
                <p className="text-3xl md:text-4xl font-mono font-bold text-center text-teal-600 tracking-wider">{code}</p>
                {!numero && (
                  <p className="text-xs text-amber-700 text-center mt-3"><strong>Non enregistré en base</strong>{dbErreur ? ' : ' + dbErreur : ''}. {emailSent ? 'Votre signalement a été transmis par courriel à l’équipe, mais aucun numéro ni code personnel n’a pu être attribué.' : 'Le courriel à l’équipe n’a pas pu partir non plus. Réessayez plus tard ou écrivez à contact@carewat.ch.'}</p>
                )}
                {numero && (
                  <div className="mt-3 pt-3 border-t border-teal-100 text-center">
                    <p className="text-xs text-gray-500">Numéro du signalement</p>
                    <p className="text-xl font-mono font-bold text-teal-600">{numero}</p>
                    <p className="text-xs text-gray-500 mt-2">Code personnel</p>
                    <p className="text-xl font-mono font-bold text-teal-600 tracking-wider">{codePerso}</p>
                    {(() => {
                      const inst = DB.institutions.find(i => i.id === data.institution);
                      const corps = ['Copie de mes réponses CareWatch', 'Numéro : ' + numero, 'Code personnel : ' + codePerso, 'Établissement : ' + (inst ? inst.fullName : ''), 'Service : ' + (data.service || ''), 'Type d\'incident : ' + (data.incidentType || ''), '', 'Description :', data.description || '', '', 'Impact :', data.impact || ''].join('\n');
                      return (
                        <a href={'mailto:?subject=' + encodeURIComponent('Copie de mon signalement CareWatch') + '&body=' + encodeURIComponent(corps)} className="mt-3 mx-auto flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-teal-300 text-teal-700 text-sm font-medium hover:bg-teal-50 transition-colors" style={{ width: "fit-content" }}>
                          <Mail className="w-4 h-4" /> Recevoir une copie de mes réponses
                        </a>
                      );
                    })()}
                    <p className="text-xs text-gray-500 mt-1">Courriel préparé sur votre appareil, rien n'est conservé par l'observatoire.</p>
                  </div>
                )}
              </div>
              <button onClick={() => navigator.clipboard?.writeText(code)} className="mt-3 mx-auto flex items-center gap-2 px-4 py-2 rounded-lg bg-teal-600 text-white text-sm font-medium hover:bg-teal-700 transition-colors shadow-sm">
                <FileText className="w-4 h-4" /> Copier le code
              </button>
              <p className="text-sm text-teal-600 text-center mt-3 flex items-center justify-center gap-1">
                <Info className="w-3 h-3" />
                Conservez ce code pour suivre l'avancement de votre signalement
              </p>
              <p className="text-sm text-gray-600 text-center mt-2">
                Avec le numéro et le code personnel, vous pouvez à tout moment consulter, modifier ou retirer ce signalement dans « Mes témoignages ».
              </p>
            </div>
            
            {emailSent && (
              <div className="bg-emerald-50 rounded-xl p-4 mb-5 flex items-center gap-3 border border-emerald-200">
                <div className="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center flex-shrink-0">
                  <Check className="w-5 h-5 text-emerald-600" />
                </div>
                <div>
                  <p className="font-medium text-emerald-800 text-sm">Notification envoyée</p>
                  <p className="text-emerald-600 text-xs">L'équipe CareWatch™ a été informée de votre signalement</p>
                </div>
              </div>
            )}
            
            </>)}

            {pageConf === 1 && (<>
            {/* Ce qui se passe maintenant */}
            <div className="bg-gray-50 rounded-2xl p-5 mb-5">
              <h3 className="font-semibold text-gray-900 mb-2 flex items-center gap-2">
                <Clock className="w-5 h-5 text-gray-500" />
                Que se passe-t-il après votre signalement ?
              </h3>
              <p className="text-sm text-gray-600 mb-4">Votre témoignage ne reste pas dans un tiroir. Voici ce qui va se passer concrètement :</p>
              <div className="space-y-4">
                {[
                  { step: 1, title: 'Lecture et vérification', desc: 'Un membre de l\'équipe CareWatch™ lit votre témoignage dans les 48 heures. Il vérifie que le signalement est complet et cohérent. Votre ressenti est toujours respecté.', time: 'Sous 48h', status: 'active' },
                  { step: 2, title: 'Anonymisation', desc: 'Votre code postal est déjà effacé (vérifié localement uniquement). Toute information permettant de vous identifier est retirée. Si votre témoignage décrit une situation trop spécifique (petit service, date précise), les détails sont automatiquement généralisés pour qu\'il ne puisse pas être relié à une seule personne.', time: 'Automatique', status: 'pending' },
                  { step: 3, title: 'Droit de réponse', desc: 'L\'établissement concerné est informé du signalement (sans vos données personnelles) et dispose de 14 jours pour apporter son point de vue. Cela garantit l\'équité de la démarche.', time: '14 jours', status: 'pending' },
                  { step: 4, title: 'Agrégation et impact', desc: 'Une fois le délai de réponse écoulé, votre témoignage rejoint ceux des autres usager·ère·s pour former des indicateurs d\'équité publics. L\'accumulation des voix crée le changement.', time: 'En continu', status: 'pending' },
                ].map((item, i) => (
                  <div key={item.step} className="flex items-start gap-3">
                    <div className="flex flex-col items-center">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${item.status === 'active' ? 'bg-teal-500 text-white' : 'bg-gray-200 text-gray-500'}`}>
                        {item.step}
                      </div>
                      {i < 3 && <div className={`w-0.5 h-8 ${item.status === 'active' ? 'bg-teal-200' : 'bg-gray-200'}`} />}
                    </div>
                    <div className="flex-1 pb-2">
                      <div className="flex items-center justify-between">
                        <p className={`font-medium ${item.status === 'active' ? 'text-teal-700' : 'text-gray-700'}`}>{item.title}</p>
                        <span className="text-sm text-gray-600 bg-white px-2 py-0.5 rounded">{item.time}</span>
                      </div>
                      <p className="text-sm text-gray-600">{item.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* À quoi sert concrètement votre témoignage */}
            <div className="bg-amber-50 rounded-2xl p-5 mb-5 border border-amber-100">
              <h3 className="font-semibold text-amber-900 mb-3 flex items-center gap-2">
                <TrendingUp className="w-5 h-5 text-amber-600" />
                À quoi sert votre témoignage ?
              </h3>
              <div className="space-y-3">
                <div className="flex items-start gap-2.5">
                  <div className="w-6 h-6 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                    <BarChart3 className="w-3.5 h-3.5 text-amber-700" />
                  </div>
                  <div>
                    <p className="text-sm font-medium text-gray-900">Créer une mémoire collective des expériences de soins</p>
                    <p className="text-sm text-gray-700">Aujourd'hui, ces expériences ne sont documentées nulle part en Suisse. Chaque témoignage contribue à combler ce vide.</p>
                  </div>
                </div>
                <div className="flex items-start gap-2.5">
                  <div className="w-6 h-6 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                    <Shield className="w-3.5 h-3.5 text-amber-700" />
                  </div>
                  <div>
                    <p className="text-sm font-medium text-gray-900">Aider les institutions à progresser</p>
                    <p className="text-sm text-gray-700">Les établissements reçoivent des indicateurs agrégés et anonymes qui leur permettent d'identifier leurs points faibles et de s'améliorer.</p>
                  </div>
                </div>
                <div className="flex items-start gap-2.5">
                  <div className="w-6 h-6 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                    <Users className="w-3.5 h-3.5 text-amber-700" />
                  </div>
                  <div>
                    <p className="text-sm font-medium text-gray-900">Peser dans le débat public</p>
                    <p className="text-sm text-gray-700">Les données agrégées sont partagées avec les associations, les chercheur·euse·s et les autorités pour alimenter le plaidoyer en faveur de l'équité des soins.</p>
                  </div>
                </div>
              </div>
              <p className="text-sm text-amber-700 mt-3 pt-3 border-t border-amber-200">Un témoignage seul est un récit. Des centaines de témoignages deviennent une preuve.</p>
            </div>

            </>)}

            {pageConf === 2 && (<>
            {/* ORIENTATION INTELLIGENTE POST-SIGNALEMENT — Romandie complète + Délégué·e CareWatch™ */}
            <OrientationRecours data={data} code={code} dms={dms} isPro={isPro} />
            
            </>)}

            {/* Actions */}
            <div className="flex flex-col sm:flex-row gap-3">
              {pageConf > 0 && <Button variant="ghost" onClick={() => setPageConf(pageConf - 1)} icon={ChevronLeft}>Précédent</Button>}
              {pageConf < 2 ? (
                <Button onClick={() => setPageConf(pageConf + 1)} className="flex-1">Continuer <ChevronRight className="w-5 h-5" /></Button>
              ) : (
                <Button onClick={() => setView(userType === 'professional' ? 'professional-home' : 'patient-home')} icon={Home} className="flex-1">Retour à l'accueil</Button>
              )}
            </div>
          </div>
        )}

        {/* Navigation */}
        {step < steps.length - 1 && champsManquants().length > 0 && (
          <p className="text-sm text-amber-700 text-right mt-6 flex items-center justify-end gap-1.5"><AlertTriangle className="w-4 h-4" /> Pour continuer : {champsManquants().join(', ')}.</p>
        )}
        {step < steps.length - 1 && (
          <div className="flex justify-between mt-3 pt-4 border-t">
            <Button variant="ghost" onClick={() => step === 0 ? setView(userType === 'professional' ? 'professional-home' : 'patient-home') : setStep(step - 1)} icon={ChevronLeft}>{step === 0 ? 'Retour' : 'Précédent'}</Button>
            {step < steps.length - 2 ? (
              <Button onClick={() => setStep(step + 1)} disabled={
                (step === 0 && (!data.postalCode || !data.charterAccepted)) ||
                (step === 1 && !isPro && !data.role) ||
                (step === 1 && isPro && !data.source) ||
                (step === 2 && (data.description || '').trim().length < CW_DESC_MIN) ||
                (step === 3 && (!data.canton || !data.institution || !data.service)) ||
                (step === 4 && !data.dateType) ||
                (step === 5 && (!data.incidentType || (data.incidentType === 'Autre' && !data.otherIncidentType))) ||
                (step === 6 && (data.grounds || []).length === 0) ||
                (step === 6 && (data.grounds || []).includes('other-ground') && !data.otherGround) ||
                (step === S.suivi && data.acceptEmailContact && !emailValide(data.email))
              }>Suivant <ChevronRight className="w-5 h-5" /></Button>
            ) : (
              <Button onClick={submit}>Envoyer le signalement</Button>
            )}
          </div>
        )}
      </Card>
    </div>
  );
}

// ============================================
// POSITIVE REPORT (simplified)
// ============================================

function PositiveReport() {
  const { setView, DB, userType, reports, setReports } = useApp();
  const [step, setStep] = useState(0);
  useScrollOnChange(step);
  const [data, setData] = useState({ role: userType === 'professional' ? 'professionnel' : 'patient' });
  const [submitted, setSubmitted] = useState(false);
  const [code, setCode] = useState('');
  const [dbRes, setDbRes] = useState(null);
  const [isModificationAffichee, setIsModificationAffichee] = useState(false);

  const allInstitutions = DB.institutions;
  const [instSearch, setInstSearch] = useState('');
  const filteredInst = allInstitutions.filter(i => 
    norm(i.fullName).includes(norm(instSearch)) || 
    norm(i.city).includes(norm(instSearch))
  ).slice(0, 10);

  const steps = ['Établissement', 'Votre expérience', 'Suivi et autorisations', 'Confirmation'];
  const [pageConf, setPageConf] = useState(0);
  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [pageConf]);
  const emailValide = (e) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e || '');

  const genCode = () => 'POS-' + Math.random().toString(36).substring(2, 8).toUpperCase();

  const getNpaHint = (npa) => {
    if (!npa || npa.length < 4) return null;
    const instCanton = data.canton || '';
    if (!instCanton) return null;
    const cantons = getNpaCanton(npa);
    if (!cantons) return { match: false, message: `⚠ NPA ${npa} non reconnu` };
    const match = cantons.includes(instCanton);
    const cantonStr = cantons.join('/');
    return { match, message: match ? `✓ Cohérence géographique OK (NPA ${npa} → ${cantonStr})` : `⚠ NPA ${npa} → canton ${cantonStr}, mais établissement en ${instCanton}` };
  };

  const submit = async () => {
    const c = data.existingCode || genCode();
    const isModification = !!data.existingCode;
    setCode(c);
    const npaCheck = getNpaHint(data.npa);
    const modif = isModification ? ' ⟳ MODIFICATION' : '';
    setIsModificationAffichee(isModification);
    const db = isModification ? null : await cwSoumettre({
      type: 'positif',
      role: data.role || null,
      canton: data.canton,
      etablissement_id: data.institution,
      etablissement_nom: data.institutionName,
      service: data.service || 'Non précisé',
      type_incident: 'Expérience positive',
      date_incident: /^\d{4}-\d{2}-\d{2}$/.test(data.date || '') ? data.date : null,
      categories_positives: data.categories || [],
      npa_coherent: npaCheck ? (npaCheck.match ? 'oui' : 'non') : 'non_verifiable',
      description: data.description,
      impact: null,
      tranche_age: data.ageRange || null,
      recevoir_resultats: !!data.wantResults,
      recontact_echange: !!data.contactExchange,
      recontact_etude: !!data.contactStudy,
      publier_fiche: !!data.publishSummary,
      usage_recherche: !!data.researchUse,
      lecture_texte_complet: !!data.allowFullRead,
      accepte_recontact_email: !!data.acceptEmailContact,
    });
    setDbRes(db);
    try {
      const response = await fetch(CW_NOTIFIER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: `[CareWatch™]${modif} Expérience positive ${(db && db.numero) || 'sans numéro (base injoignable)'}`,
          _template: 'table',
          _captcha: false,
          type: isModification ? 'MODIFICATION_POSITIVE' : 'EXPERIENCE_POSITIVE',
          numero_base: (db && db.numero) || 'sans numéro (base injoignable)',
          statut: 'soumis, à relire dans l’espace de modération',
          role: data.role || 'Non précisé',
          canton: data.canton || 'Non précisé',
          etablissement: data.institutionName,
          date_temoignage: new Date().toLocaleString('fr-CH'),
          ...(data.acceptEmailContact === true ? { recontact: 'Oui', email_suivi: data.email || 'Non fourni' } : {}),
        })
      });
      const result = await response.json();
    } catch(e) { console.log('FormSubmit error (mode local):', e); }
    
    // Add to local reports list
    const newReport = {
      id: Date.now(),
      code: c,
      type: 'positive',
      incidentType: 'Expérience positive',
      institution: data.institution,
      service: data.service || '',
      date: data.date || 'Non précisée',
      submittedAt: Date.now(),
      categories: data.categories || [],
      description: data.description || '',
      status: 'En modération',
      ...data,
      numero: db ? db.numero : undefined
    };
    setReports([...reports, newReport]);
    
    setSubmitted(true);
    setPageConf(0);
    setStep(3);
  };

  const categories = [
    { id: 'accueil', label: 'Accueil bienveillant', icon: Heart, color: 'rose' },
    { id: 'ecoute', label: 'Écoute & communication', icon: MessageCircle, color: 'teal' },
    { id: 'competence', label: 'Compétence médicale', icon: Stethoscope, color: 'indigo' },
    { id: 'interculturel', label: 'Sensibilité interculturelle', icon: Users, color: 'amber' },
    { id: 'accompagnement', label: 'Accompagnement global', icon: ShieldCheck, color: 'emerald' },
    { id: 'autre', label: 'Autre', icon: MessageCircle, color: 'gray' },
  ];

  return (
    <div className="p-4 md:p-8 max-w-2xl mx-auto">
      <Card className="p-5 md:p-6">
        {/* Header */}
        <div className="flex items-center gap-3 mb-6">
          <div className="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center">
            <Heart className="w-6 h-6 text-emerald-600" />
          </div>
          <div>
            <h2 className="text-lg font-bold text-gray-900">Partager une bonne expérience</h2>
            <p className="text-sm text-gray-600">Valorisez les soins équitables et bienveillants</p>
          </div>
        </div>

        {/* Progress */}
        <div className="flex gap-2 mb-6">
          {steps.map((s, i) => (
            <div key={i} className="flex-1">
              <div className={`h-1.5 rounded-full ${i <= step ? 'bg-emerald-500' : 'bg-gray-200'}`} />
              <p className={`text-xs mt-1 ${i <= step ? 'text-emerald-600 font-medium' : 'text-gray-400'}`}>{s}</p>
            </div>
          ))}
        </div>

        {/* Step 0: Institution + Role + NPA */}
        {step === 0 && (
          <div className="space-y-4">
            {/* Role */}
            {userType === 'professional' ? (
              <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 flex items-center gap-3">
                <Stethoscope className="w-5 h-5 text-amber-600 flex-shrink-0" />
                <p className="text-sm text-amber-800 font-medium">Témoignage en tant que professionnel·le de santé</p>
              </div>
            ) : (
            <div>
              <label className="block text-sm font-semibold text-gray-800 mb-2">Vous êtes :</label>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id: 'patient', label: 'Patient·e', icon: User },
                  { id: 'proche', label: 'Proche', icon: Users },
                  { id: 'temoin', label: 'Témoin', icon: Eye },
                ].map(r => {
                  const RIcon = r.icon;
                  return (
                  <button key={r.id} onClick={() => setData({...data, role: r.id})} className={`p-3 rounded-xl border-2 text-center transition-all ${data.role === r.id ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200 hover:border-gray-300'}`}>
                    <RIcon className={`w-5 h-5 mx-auto mb-1 ${data.role === r.id ? 'text-emerald-600' : 'text-gray-400'}`} />
                    <span className={`text-xs sm:text-sm ${data.role === r.id ? 'text-emerald-700 font-medium' : 'text-gray-600'}`}>{r.label}</span>
                  </button>
                  );
                })}
              </div>
            </div>
            )}

            {/* Institution */}
            <div>
              <label className="block text-sm font-semibold text-gray-800 mb-2">Quel établissement souhaitez-vous valoriser ?</label>
              <div className="relative">
                <Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                <input 
                  type="text" 
                  value={instSearch} 
                  onChange={e => setInstSearch(e.target.value)} 
                  placeholder="Rechercher un établissement..." 
                  className="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-emerald-500 focus:outline-none"
                />
              </div>
            </div>
            {instSearch && (
              <div className="divide-y border rounded-xl max-h-60 overflow-y-auto">
                {filteredInst.map(inst => (
                  <button key={inst.id} onClick={() => { setData({...data, institution: inst.id, institutionName: inst.fullName, canton: inst.canton, institutionCity: inst.city}); setInstSearch(''); }} className={`w-full text-left p-3 hover:bg-emerald-50 transition-colors ${data.institution === inst.id ? 'bg-emerald-50 border-l-4 border-emerald-500' : ''}`}>
                    <p className="font-medium text-sm">{inst.fullName}</p>
                    <p className="text-sm text-gray-700">{inst.city} ({inst.canton})</p>
                  </button>
                ))}
              </div>
            )}
            {data.institutionName && (
              <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                <p className="text-sm text-emerald-800 font-medium">✓ {data.institutionName}</p>
                <p className="text-sm text-emerald-600">{data.institutionCity} ({data.canton})</p>
              </div>
            )}

            {/* NPA */}
            <Input label="Votre code postal (NPA)" type="text" value={data.npa || ''} onChange={v => setData({...data, npa: v})} placeholder="ex. 1205" maxLength="4" required />
            <p className="text-sm text-gray-700 -mt-2 leading-relaxed"><Lock className="w-3.5 h-3.5 text-teal-600 inline-block align-text-bottom mr-1" /><strong>Non transmis, non conservé.</strong> Utilisé uniquement pour vérifier la cohérence géographique avec l'établissement.</p>
            {/* NPA coherence check */}
            {data.npa && data.npa.length >= 4 && data.canton && (() => {
              const hint = getNpaHint(data.npa);
              if (!hint) return null;
              return (
                <div>
                  <div className={`rounded-lg p-3 flex items-start gap-2 text-sm ${hint.match ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                    {hint.match ? <CheckCircle className="w-4 h-4 flex-shrink-0 mt-0.5" /> : <AlertTriangle className="w-4 h-4 flex-shrink-0 mt-0.5" />}
                    <span>{hint.message}</span>
                  </div>
                  {!hint.match && (
                    <div className="mt-2">
                      <label className="block text-sm font-medium text-amber-800 mb-1">{data.role === 'professionnel' ? 'Pourquoi cet établissement se trouve-t-il dans un autre canton que votre domicile ?' : 'Pourquoi consultez-vous dans un autre canton ?'}</label>
                      <textarea value={data.npaJustification || ''} onChange={e => setData({...data, npaJustification: e.target.value})}
                        placeholder={data.role === 'professionnel' ? "Ex : j'y travaille, remplacement, formation, garde..." : "Ex : centre de référence, suivi spécialisé, proximité du lieu de travail..."}
                        className="w-full border-2 border-amber-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:border-amber-400 focus:outline-none resize-none" rows="2" />
                      <p className="text-xs text-amber-600 mt-1">Facultatif mais utile pour la modération.</p>
                    </div>
                  )}
                </div>
              );
            })()}

            {/* Date */}
            <Input label="Date approximative" type="date" value={data.date || ''} onChange={v => setData({...data, date: v})} />
          </div>
        )}

        {/* Step 1: Experience */}
        {step === 1 && (
          <div className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Qu'est-ce qui vous a le plus marqué positivement ?</label>
              <p className="text-sm text-gray-600 mb-3">Sélectionnez de 1 à 3 éléments, dans l'ordre d'importance (le premier = le plus marquant).</p>
              <div className="grid grid-cols-2 gap-2">
                {categories.map(cat => {
                  const idx = (data.categories || []).indexOf(cat.id);
                  const isSelected = idx !== -1;
                  const rank = idx + 1;
                  return (
                    <button key={cat.id} onClick={() => {
                      const current = data.categories || [];
                      if (isSelected) {
                        setData({...data, categories: current.filter(c => c !== cat.id)});
                      } else if (current.length < 3) {
                        setData({...data, categories: [...current, cat.id]});
                      }
                    }} className={`p-3 rounded-xl border-2 text-left transition-all flex items-center gap-2 relative ${isSelected ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200 hover:border-gray-300'} ${!isSelected && (data.categories || []).length >= 3 ? 'opacity-40' : ''}`}>
                      {isSelected && (
                        <span className="absolute -top-2 -right-2 w-6 h-6 bg-emerald-500 text-white rounded-full text-xs font-bold flex items-center justify-center shadow">{rank}</span>
                      )}
                      <cat.icon className={`w-5 h-5 ${isSelected ? 'text-emerald-600' : 'text-gray-400'}`} />
                      <span className={`text-sm ${isSelected ? 'text-emerald-700 font-medium' : 'text-gray-600'}`}>{cat.label}</span>
                    </button>
                  );
                })}
              </div>
              {(data.categories || []).length > 0 && (
                <div className="mt-3 flex flex-wrap gap-2">
                  {(data.categories || []).map((catId, i) => {
                    const cat = categories.find(c => c.id === catId);
                    return (
                      <span key={catId} className="px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-lg text-xs font-medium flex items-center gap-1">
                        <span className="w-4 h-4 bg-emerald-500 text-white rounded-full text-xs flex items-center justify-center">{i + 1}</span>
                        {cat.label}
                        <button onClick={() => setData({...data, categories: (data.categories || []).filter(c => c !== catId)})} className="ml-1 text-emerald-400 hover:text-emerald-600">×</button>
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
            <TextArea 
              label="Décrivez votre expérience positive" 
              value={data.description || ''} 
              onChange={v => setData({...data, description: v})} 
              placeholder="Qu'est-ce qui vous a marqué positivement ? Un geste, une attention, une compétence particulière ? Soyez aussi précis·e que possible..."
              rows={5}
              maxLength={2000}
              required
            />
            <CwDescHint value={data.description} />
            <div className="bg-emerald-50 rounded-xl p-4">
              <p className="text-sm text-emerald-800">
                <strong>L'importance de votre retour :</strong> Les retours positifs permettent d'identifier les bonnes pratiques et de valoriser les équipes engagées. Comme pour les signalements, votre témoignage sera vérifié par notre équipe avant publication.
              </p>
            </div>
          </div>
        )}

        {/* Step 2: Suivi et autorisations */}
        {step === 2 && (
          <div className="space-y-4">
            <SuiviCheckboxes data={data} setData={setData} positif />
          </div>
        )}

        {/* Step 3: Confirmation */}
        {step === 3 && submitted && (
          <div className="text-center py-4">
            <div className="w-20 h-20 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/30">
              <CheckCircle className="w-10 h-10 text-white" />
            </div>
            <h2 className="text-2xl font-bold text-gray-900 mb-2">Merci !</h2>
            <p className="text-gray-600 mb-4">Votre témoignage positif a été enregistré pour <strong>{data.institutionName}</strong>.</p>
            <div className="flex gap-1.5 mb-5 justify-center">
              {['Vos codes', 'La suite'].map((l, i) => (
                <button key={l} onClick={() => setPageConf(i)} className={`px-3 py-1.5 rounded-full text-sm font-medium ${pageConf === i ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700'}`}>{i + 1}. {l}</button>
              ))}
            </div>
            {pageConf === 0 && (<>
            <div className="bg-emerald-50 rounded-xl p-4 mb-5 border border-emerald-200 text-center">
              <p className="text-sm text-emerald-700 mb-1 font-medium">Code de suivi</p>
              <p className="text-2xl font-mono font-bold text-emerald-600">{code}</p>
              {!isModificationAffichee && (!dbRes || !dbRes.numero) && (
                <p className="text-xs text-amber-700 mt-3"><strong>Non enregistré en base</strong>{dbRes && dbRes.erreur ? ' : ' + dbRes.erreur : ''}. Votre retour a été transmis par courriel à l’équipe, mais aucun numéro ni code personnel n’a pu être attribué.</p>
              )}
              {dbRes && dbRes.numero && (
                <div className="mt-3 pt-3 border-t border-emerald-200">
                  <p className="text-xs text-gray-500">Numéro</p>
                  <p className="text-lg font-mono font-bold text-emerald-600">{dbRes.numero}</p>
                  <p className="text-xs text-gray-500 mt-1">Code personnel</p>
                  <p className="text-lg font-mono font-bold text-emerald-600 tracking-wider">{dbRes.code}</p>
                </div>
              )}
              <button onClick={() => navigator.clipboard?.writeText(code)} className="mt-3 mx-auto flex items-center gap-2 px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 transition-colors shadow-sm">
                <FileText className="w-4 h-4" /> Copier le code
              </button>
            </div>
            <p className="text-sm text-gray-600 text-center mb-5">
              Avec le numéro et le code personnel, vous pouvez à tout moment consulter, modifier ou retirer ce témoignage dans « Mes témoignages ».
            </p>
            </>)}

            {pageConf === 1 && (<>
            {/* Verification timeline - same as negative reports */}
            <div className="bg-gray-50 rounded-xl p-5 mb-5 text-left">
              <h3 className="font-semibold text-gray-900 mb-4 flex items-center gap-2">
                <Clock className="w-5 h-5 text-gray-500" />
                Prochaines étapes
              </h3>
              <div className="space-y-4">
                {[
                  { n: 1, title: 'Vérification', desc: 'Examen par notre équipe de modération', time: '< 48h', active: true },
                  { n: 2, title: 'Validation', desc: 'Confirmation de la cohérence du témoignage', time: 'Après vérification', active: false },
                  { n: 3, title: 'Notification', desc: 'L\'établissement est informé et peut commenter', time: '7 jours', active: false },
                  { n: 4, title: 'Publication', desc: 'Intégré aux indicateurs d\'équité publics', time: 'Après validation', active: false },
                ].map((item, i) => (
                  <div key={item.n} className="flex items-start gap-3">
                    <div className="flex flex-col items-center">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${item.active ? 'bg-emerald-500 text-white' : 'bg-gray-200 text-gray-500'}`}>{item.n}</div>
                      {i < 3 && <div className={`w-0.5 h-8 ${item.active ? 'bg-emerald-200' : 'bg-gray-200'}`} />}
                    </div>
                    <div className="flex-1 pb-2">
                      <div className="flex items-center justify-between">
                        <p className={`font-medium ${item.active ? 'text-emerald-700' : 'text-gray-700'}`}>{item.title}</p>
                        <span className="text-sm text-gray-600 bg-white px-2 py-0.5 rounded">{item.time}</span>
                      </div>
                      <p className="text-sm text-gray-600">{item.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <p className="text-sm text-gray-600 mb-6 flex items-start gap-2 text-left">
              <Info className="w-4 h-4 text-emerald-500 flex-shrink-0 mt-0.5" />
              <span>Comme pour les signalements, les retours positifs sont vérifiés pour garantir leur authenticité. Cela protège la crédibilité de la plateforme et la valeur des bonnes pratiques identifiées.</span>
            </p>

            {/* Associations & soutien */}
            <div className="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-2xl p-5 mb-5 border border-emerald-100 text-left">
              <h3 className="font-semibold text-emerald-900 mb-3 flex items-center gap-2">
                <Users className="w-5 h-5 text-emerald-600" />
                Nos associations partenaires
              </h3>
              <p className="text-sm text-emerald-700 mb-3">Continuez à soutenir l'équité en santé en découvrant nos partenaires.</p>
              <div className="space-y-2">
                {[
                  { name: 'APSR-GE', desc: 'Réseau de professionnel·le·s de santé racisé·e·s', url: 'https://www.instagram.com/apsr.9446/', label: 'Instagram' },
                  { name: 'Suisse Drépano', desc: 'Soutien aux patient·e·s et proches', url: 'https://www.suissedrepano.ch', label: 'Site web' },
                  { name: 'Resilia (KimboCare)', desc: 'Navigation dans le système de santé suisse', url: 'https://resilia.kimbocare.com', label: 'Site web' },
                ].map(org => (
                  <a key={org.name} href={org.url} target="_blank" rel="noopener noreferrer" className="block p-3 rounded-xl bg-white/70 border border-emerald-100 hover:bg-white transition-colors">
                    <div className="flex items-center gap-2 mb-1">
                      <Users className="w-4 h-4 text-emerald-500 flex-shrink-0" />
                      <span className="font-medium text-sm text-gray-900">{org.name}</span>
                      <span className="ml-auto text-sm text-emerald-600 font-medium flex items-center gap-1 flex-shrink-0">{org.label} <ExternalLink className="w-3 h-3" /></span>
                    </div>
                    <p className="text-sm text-gray-600 pl-6">{org.desc}</p>
                  </a>
                ))}
              </div>
            </div>

            </>)}

            {pageConf === 0 && (
              <Button onClick={() => setPageConf(1)} className="w-full !bg-emerald-600 hover:!bg-emerald-700">Continuer <ChevronRight className="w-5 h-5" /></Button>
            )}
            {pageConf === 1 && (
            <div className="flex gap-3">
              <Button variant="secondary" onClick={() => setView(userType === 'professional' ? 'professional-home' : 'patient-home')} className="flex-1" icon={Home}>Accueil</Button>
              <Button onClick={() => { setStep(0); setData({}); setSubmitted(false); setPageConf(0); }} className="flex-1 !bg-emerald-600 hover:!bg-emerald-700" icon={Heart}>Autre expérience</Button>
            </div>
            )}
          </div>
        )}

        {/* Navigation */}
        {step < 3 && (
          <div className="flex justify-between mt-6 pt-4 border-t">
            <Button variant="ghost" onClick={() => step === 0 ? setView(userType === 'professional' ? 'professional-home' : 'patient-home') : setStep(step - 1)} icon={ChevronLeft}>
              {step === 0 ? 'Retour' : 'Précédent'}
            </Button>
            {step === 0 ? (
              <Button onClick={() => setStep(1)} disabled={!data.institution || !data.role || !data.npa || data.npa.length < 4} className="!bg-emerald-600 hover:!bg-emerald-700">
                Suivant <ChevronRight className="w-5 h-5" />
              </Button>
            ) : step === 1 ? (
              <Button onClick={() => setStep(2)} disabled={(data.description || '').trim().length < CW_DESC_MIN || !(data.categories || []).length} className="!bg-emerald-600 hover:!bg-emerald-700">
                Suivant <ChevronRight className="w-5 h-5" />
              </Button>
            ) : (
              <Button onClick={submit} disabled={data.acceptEmailContact && !emailValide(data.email)} className="!bg-emerald-600 hover:!bg-emerald-700" icon={CheckCircle}>
                Envoyer
              </Button>
            )}
          </div>
        )}
      </Card>
    </div>
  );
}

function MyReports() {
  const { reports, setReports, DB, setView, userType } = useApp();
  const [selectedReport, setSelectedReport] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [editData, setEditData] = useState({});
  const [codePersoEdit, setCodePersoEdit] = useState('');
  const [editMsg, setEditMsg] = useState('');

  const canEdit = (report) => {
    if (report.numero) return report.status !== 'Retiré'; // enregistré en base : modifiable avec le code personnel
    const submittedDate = new Date(report.submittedAt || Date.now());
    const now = new Date();
    const hoursDiff = (now - submittedDate) / (1000 * 60 * 60);
    return hoursDiff < 48 && report.status === 'En modération';
  };

  const handleSaveEdit = async () => {
    const updated = { ...selectedReport, ...editData };
    setEditMsg('');
    if (selectedReport.numero) {
      if (!codePersoEdit.trim()) { setEditMsg('Saisissez votre code personnel pour modifier le témoignage enregistré.'); return; }
      try {
        const { data, error } = await window.cwDb.rpc('modifier_recit', {
          p_numero: selectedReport.numero, p_code: codePersoEdit.trim().toUpperCase(),
          p: { description: editData.description || '', impact: editData.impact || null },
        });
        if (error || !data || !data.ok) {
          const r = data && data.raison;
          setEditMsg(r === 'code' ? 'Numéro ou code personnel incorrect.'
            : r === 'description_courte' ? 'La description doit compter au moins 20 caractères.'
            : r === 'retire' ? 'Ce témoignage a été retiré, il ne peut plus être modifié.'
            : 'Modification impossible pour l’instant, réessayez dans un moment.');
          return;
        }
        updated.status = 'En modération';
      } catch (e) { setEditMsg('Modification impossible pour l’instant, réessayez dans un moment.'); return; }
    }
    setReports(reports.map(r => r.id === selectedReport.id ? updated : r));
    setEditMode(false);
    setSelectedReport(updated);
    setCodePersoEdit('');
    // Email notification for edit
    try {
      await fetch(CW_NOTIFIER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: `[CareWatch™] ⟳ MODIFICATION ${updated.numero || 'sans numéro'}`,
          _template: 'table',
          _captcha: false,
          type: 'MODIFICATION_SIGNALEMENT',
          numero_base: updated.numero || 'sans numéro',
          statut: 'modifié, à relire dans l’espace de modération',
          etablissement: getInstitutionName(updated.institution),
          date_modification: new Date().toLocaleString('fr-CH'),
        })
      });
    } catch(e) { console.log('Email modification non envoyé:', e); }
  };

  const getInstitutionName = (id) => {
    const inst = DB.institutions.find(i => i.id === id);
    return inst ? inst.fullName : id;
  };

  return (
    <div className="p-4 md:p-8 max-w-2xl mx-auto">
      <h2 className="text-xl font-bold mb-2">Mes témoignages</h2>
      <p className="text-sm text-gray-600 mb-4 flex items-center gap-1.5"><Lock className="w-4 h-4 text-teal-600" /> Cette liste est conservée sur cet appareil uniquement, jamais transmise. Elle disparaît si vous effacez les données du site ou si vous avez choisi « Ne rien mémoriser ». Pour agir sur un signalement enregistré, utilisez son numéro et votre code personnel ci-dessous.</p>
      <GererSignalement />
      {reports.length === 0 ? (
        <Card className="p-8 text-center">
          <ClipboardList className="w-12 h-12 mx-auto mb-3 text-gray-400" />
          <p className="text-gray-500">Vous n'avez pas encore fait de témoignage</p>
        </Card>
      ) : (
        <div className="space-y-3">
          {reports.map(r => (
            <Card key={r.id} className={`p-4 ${r.type === 'positive' ? 'border-l-4 border-l-emerald-400' : ''}`} onClick={() => { setSelectedReport(r); setEditData(r); }}>
              <div className="flex items-start justify-between mb-2">
                <div>
                  <div className="flex items-center gap-2">
                    {r.type === 'positive' && <Heart className="w-4 h-4 text-emerald-500" />}
                    <p className="font-medium">{r.type === 'positive' ? 'Expérience positive' : r.incidentType}</p>
                  </div>
                  <p className="text-sm text-gray-600">{getInstitutionName(r.institution)} {r.service ? `• ${r.service}` : ''}</p>
                </div>
                <span className={`px-2 py-1 rounded text-xs ${r.type === 'positive' ? 'bg-emerald-100 text-emerald-700' : r.status === 'Vérifié' ? 'bg-emerald-100 text-emerald-700' : r.status === 'Rejeté' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>{r.status}</span>
              </div>
              <div className="flex items-center justify-between text-sm">
                <span className="text-gray-400">{r.date} {r.time && `à ${r.time}`}</span>
                <span className="font-mono text-teal-600">{r.numero ? r.numero : r.code}</span>
              </div>
              <div className="flex items-center justify-end mt-2">
                <button onClick={(e) => { e.stopPropagation(); if (window.confirm('Retirer ce témoignage de la liste sur cet appareil ? Le signalement lui-même reste enregistré ; utilisez « Gérer mon signalement » pour le retirer de la base.')) setReports(reports.filter(x => x.id !== r.id)); }} className="text-xs text-gray-500 hover:text-rose-600 underline">Retirer de cet appareil</button>
              </div>
              {canEdit(r) && (
                <div className="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">
                  <p className="text-sm text-amber-600">{r.numero ? 'Modifiable avec votre code personnel' : `Modifiable encore ${Math.round(48 - ((Date.now() - (r.submittedAt || Date.now())) / (1000 * 60 * 60)))}h`}</p>
                  <button onClick={(e) => { e.stopPropagation(); setSelectedReport(r); setEditData(r); setEditMode(true); }} className="px-3 py-1.5 rounded-lg bg-amber-100 text-amber-800 text-sm font-semibold hover:bg-amber-200 transition-colors flex items-center gap-1.5">
                    <Edit className="w-3.5 h-3.5" /> Modifier
                  </button>
                </div>
              )}
            </Card>
          ))}
        </div>
      )}

      {/* Modal détail */}
      <Modal isOpen={!!selectedReport} onClose={() => { setSelectedReport(null); setEditMode(false); }} title={editMode ? 'Modifier le signalement' : 'Détail du signalement'} size="lg">
        {selectedReport && (
          <div className="space-y-4">
            {!editMode ? (
              <>
                <div className="flex items-center justify-between">
                  <span className="font-mono text-teal-600 text-lg">{selectedReport.code}</span>
                  <span className={`px-3 py-1 rounded-full text-sm ${selectedReport.status === 'Vérifié' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{selectedReport.status}</span>
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600">Type d'incident</p>
                    <p className="font-medium">{selectedReport.incidentType}</p>
                  </div>
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600">Date & Heure</p>
                    <p className="font-medium">{selectedReport.date} {selectedReport.time && `à ${selectedReport.time}`}</p>
                  </div>
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600">Établissement</p>
                    <p className="font-medium">{getInstitutionName(selectedReport.institution)}</p>
                  </div>
                  <div className="bg-gray-50 rounded-xl p-3">
                    <p className="text-sm text-gray-600">Service</p>
                    <p className="font-medium">{selectedReport.service}</p>
                  </div>
                </div>

                {selectedReport.grounds && selectedReport.grounds.length > 0 && (
                  <div className="bg-gray-50 rounded-xl p-4">
                    <p className="text-sm text-gray-600 mb-2">Motifs perçus{selectedReport.grounds.length >= 2 ? ' (croisés)' : ''}</p>
                    <div className="flex flex-wrap gap-1.5">
                      {selectedReport.grounds.map(gId => (
                        <span key={gId} className="inline-flex items-center px-2.5 py-1 bg-teal-100 text-teal-800 rounded-full text-xs font-medium">{gId}</span>
                      ))}
                    </div>
                  </div>
                )}

                {selectedReport.description && (
                  <div className="bg-gray-50 rounded-xl p-4">
                    <p className="text-sm text-gray-600 mb-1">Description</p>
                    <p className="text-gray-700">{selectedReport.description}</p>
                  </div>
                )}

                {selectedReport.impact && (
                  <div className="bg-gray-50 rounded-xl p-4">
                    <p className="text-sm text-gray-600 mb-1">Impact ressenti</p>
                    <p className="text-gray-700">{selectedReport.impact}</p>
                  </div>
                )}

                {selectedReport.otherDetails && (
                  <div className="bg-gray-50 rounded-xl p-4">
                    <p className="text-sm text-gray-600 mb-1">Précisions supplémentaires</p>
                    <p className="text-gray-700">{selectedReport.otherDetails}</p>
                  </div>
                )}

                <div className="bg-blue-50 rounded-xl p-4">
                  <p className="text-sm text-blue-600 font-medium mb-2">Suivi du signalement</p>
                  <div className="space-y-2">
                    {['Reçu', 'En modération', 'Période de contestation', 'Publié'].map((s, i) => {
                      const done = (i === 0) || (i === 1 && selectedReport.status !== 'Nouveau') || (i >= 2 && selectedReport.status === 'Vérifié');
                      return (
                        <div key={s} className="flex items-center gap-3">
                          <div className={`w-5 h-5 rounded-full flex items-center justify-center ${done ? 'bg-emerald-500' : 'bg-gray-200'}`}>
                            {done && <Check className="w-3 h-3 text-white" />}
                          </div>
                          <span className="text-sm">{s}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="flex gap-3">
                  {canEdit(selectedReport) && (
                    <Button variant="outline" onClick={() => setEditMode(true)} className="flex-1">Modifier</Button>
                  )}
                  <Button variant="secondary" onClick={() => setSelectedReport(null)} className="flex-1">Fermer</Button>
                </div>
              </>
            ) : (
              <>
                <TextArea label="Description" value={editData.description || ''} onChange={v => setEditData({...editData, description: v})} maxLength={2000} />
                <TextArea label="Impact ressenti" value={editData.impact || ''} onChange={v => setEditData({...editData, impact: v})} rows={3} />
                <TextArea label="Précisions supplémentaires" value={editData.otherDetails || ''} onChange={v => setEditData({...editData, otherDetails: v})} rows={3} />
                <CwDescHint value={editData.description} />
                {selectedReport.numero ? (
                  <div className="bg-teal-50 rounded-xl p-3 border border-teal-100">
                    <Input label="Code personnel" value={codePersoEdit} onChange={v => setCodePersoEdit(v.toUpperCase())} placeholder="ABCD234EFG" />
                    <p className="text-xs text-teal-800 mt-2">La description et l’impact sont modifiés dans la base pour le témoignage {selectedReport.numero}. Il repasse ensuite en relecture par l’équipe.</p>
                  </div>
                ) : (
                  <p className="text-xs text-gray-500">Ce témoignage n’a pas de numéro en base : la modification est transmise à l’équipe par courriel.</p>
                )}
                {editMsg && <p className="text-sm text-rose-600">{editMsg}</p>}
                <div className="flex gap-3">
                  <Button variant="secondary" onClick={() => { setEditMode(false); setEditMsg(''); }} className="flex-1">Annuler</Button>
                  <Button onClick={handleSaveEdit} className="flex-1" disabled={selectedReport.numero && (editData.description || '').trim().length < CW_DESC_MIN}>{selectedReport.numero ? 'Enregistrer la modification' : 'Transmettre la modification'}</Button>
                </div>
              </>
            )}
          </div>
        )}
      </Modal>
    </div>
  );
}
